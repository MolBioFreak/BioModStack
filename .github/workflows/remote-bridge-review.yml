name: Remote bridge review

on:
  push:
    branches: [test-remote-bridge-repairs-20260917, test-remote-bridge-integration-20260920, test, test-repository-cleanup-20260921]
  workflow_dispatch:

# No deployment, provider credentials, rental operations, or repository writes.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/remote-bridge-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Run locked source, provisioning, transport and multiworker gates
        working-directory: platform/api
        shell: bash
        run: |
          set -euo pipefail
          # Install locked dependencies before entering a genuinely route-free
          # namespace. Never disable the repository's collection-time guards.
          uv sync --frozen --group dev
          parent_namespace="$(readlink /proc/self/ns/net)"
          sudo env HOME="$HOME" USER="$USER" LOGNAME="$USER" PATH="$PATH" UV_PYTHON="$UV_PYTHON" UV_CACHE_DIR="$UV_CACHE_DIR" \
            _BIOXP_PYTEST_NETNS=1 _BIOXP_PYTEST_PARENT_NETNS="$parent_namespace" \
            unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            timeout --signal=TERM --kill-after=15s 900s uv run --offline --frozen --group dev python -m pytest -vv -o faulthandler_timeout=90 \
            tests/test_remote_provision_isolation.py \
            tests/test_remote_inventory_supersession.py \
            tests/test_remote_incremental_admission.py \
            tests/test_remote_helper_diagnostics.py \
            tests/test_managed_runtime_safety.py \
            tests/test_remote_managed_inventory.py \
            tests/test_remote_preloading.py \
            tests/test_vast_auto_setup.py \
            tests/test_remote_cache_integration.py \
            tests/test_remote_runtime_images.py \
            tests/test_remote_runner_integrity.py \
            tests/test_artifact_cache.py \
            tests/test_cache_batches.py \
            tests/test_multiworker_scheduling.py \
            tests/test_multiworker_migration.py \
            tests/test_managed_ssh_transport.py \
            tests/test_vast_ssh_endpoint_selection.py \
            tests/test_hf_worker_acquisition.py \
            tests/test_remote_telemetry.py \
            --junitxml="$RUNNER_TEMP/remote-bridge-evidence/junit-review.xml"
      - name: Preserve revision and case-level evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-bridge-review-${{ github.sha }}
          path: ${{ runner.temp }}/remote-bridge-evidence/
          retention-days: 14
          if-no-files-found: error
