name: Diagnose pinned remote bridge candidate
on:
  push:
    branches: [test-remote-bridge-ci-diagnostics-20260920]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c15ba52586c66e73f3f3a6d56334b694aa66cdfc
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Install exact locked environment and record tested source
        working-directory: platform/api
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          mkdir -p "$RUNNER_TEMP/bridge-diagnostics"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bridge-diagnostics/candidate.txt"
          .venv/bin/python -c 'import sys; print(sys.executable, sys.version)'
      - name: Diagnose collection without uv inside the isolated namespace
        working-directory: platform/api
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace="$(readlink /proc/self/ns/net)"
          # Same frozen venv and real route-free namespace; no safety opt-out.
          sudo env HOME="$HOME" USER="$USER" LOGNAME="$USER" PATH="$PATH" PYTHONUNBUFFERED=1 \
            _BIOXP_PYTEST_NETNS=1 _BIOXP_PYTEST_PARENT_NETNS="$parent_namespace" \
            unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            timeout --signal=TERM --kill-after=5s 75s \
            "$PWD/.venv/bin/python" -u -c '
          import faulthandler, os, pathlib, sys
          faulthandler.enable()
          faulthandler.dump_traceback_later(45, exit=True)
          print("INTERPRETER_STARTED", sys.executable, flush=True)
          print("NETNS", os.readlink("/proc/self/ns/net"), "PARENT", os.environ.get("_BIOXP_PYTEST_PARENT_NETNS"), flush=True)
          print(pathlib.Path("/proc/net/route").read_text(), flush=True)
          print(pathlib.Path("/proc/net/if_inet6").read_text(), flush=True)
          import pytest
          print("PYTEST_IMPORTED", pytest.__version__, flush=True)
          result = pytest.main(sys.argv[1:])
          faulthandler.cancel_dump_traceback_later()
          raise SystemExit(result)
          ' --collect-only -vv -s \
            tests/test_remote_provision_isolation.py \
            tests/test_remote_inventory_supersession.py \
            tests/test_remote_incremental_admission.py \
            tests/test_remote_helper_diagnostics.py \
            2>&1 | tee "$RUNNER_TEMP/bridge-diagnostics/collection.log"
      - name: Execute integrated candidate gates in the frozen interpreter
        working-directory: platform/api
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace="$(readlink /proc/self/ns/net)"
          sudo env HOME="$HOME" USER="$USER" LOGNAME="$USER" PATH="$PATH" PYTHONUNBUFFERED=1 \
            _BIOXP_PYTEST_NETNS=1 _BIOXP_PYTEST_PARENT_NETNS="$parent_namespace" \
            unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            timeout --signal=TERM --kill-after=10s 600s \
            "$PWD/.venv/bin/python" -u -m pytest -vv -o faulthandler_timeout=90 \
            tests/test_remote_provision_isolation.py \
            tests/test_remote_inventory_supersession.py \
            tests/test_remote_incremental_admission.py \
            tests/test_remote_helper_diagnostics.py \
            tests/test_managed_runtime_safety.py \
            tests/test_ngs_molbio_runtime_record_builder.py \
            tests/test_remote_managed_inventory.py \
            tests/test_remote_preloading.py \
            tests/test_vast_auto_setup.py \
            tests/test_remote_cache_integration.py \
            tests/test_remote_runtime_images.py \
            tests/test_remote_runner_integrity.py \
            tests/test_artifact_cache.py \
            tests/test_cache_batches.py \
            tests/test_multiworker_scheduling.py \
            tests/test_multiworker_migration.py \
            tests/test_managed_ssh_transport.py \
            tests/test_vast_ssh_endpoint_selection.py \
            tests/test_hf_worker_acquisition.py \
            tests/test_remote_telemetry.py \
            --junitxml="$RUNNER_TEMP/bridge-diagnostics/junit-review.xml" \
            2>&1 | tee "$RUNNER_TEMP/bridge-diagnostics/regression.log"
      - name: Preserve exact source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-diagnostics/
          if-no-files-found: error
          retention-days: 14
