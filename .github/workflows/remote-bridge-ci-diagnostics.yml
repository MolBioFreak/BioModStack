name: Verify pinned remote bridge groups
on:
  push:
    branches: [test-remote-bridge-ci-diagnostics-20260920]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: [corrections, provisioning, transport]
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c15ba52586c66e73f3f3a6d56334b694aa66cdfc
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Install exact locked environment and record tested source
        working-directory: platform/api
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          mkdir -p "$RUNNER_TEMP/bridge-diagnostics"
          git rev-parse HEAD | tee "$RUNNER_TEMP/bridge-diagnostics/candidate.txt"
      - name: Execute complete assigned group with startup and test watchdogs
        working-directory: platform/api
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$TEST_GROUP" in
            corrections) modules=(
              tests/test_remote_provision_isolation.py
              tests/test_remote_inventory_supersession.py
              tests/test_remote_incremental_admission.py
              tests/test_remote_helper_diagnostics.py
              tests/test_managed_runtime_safety.py
              tests/test_ngs_molbio_runtime_record_builder.py
            ) ;;
            provisioning) modules=(
              tests/test_remote_managed_inventory.py
              tests/test_remote_preloading.py
              tests/test_vast_auto_setup.py
              tests/test_remote_cache_integration.py
              tests/test_remote_runtime_images.py
              tests/test_remote_runner_integrity.py
              tests/test_artifact_cache.py
              tests/test_cache_batches.py
            ) ;;
            transport) modules=(
              tests/test_multiworker_scheduling.py
              tests/test_multiworker_migration.py
              tests/test_managed_ssh_transport.py
              tests/test_vast_ssh_endpoint_selection.py
              tests/test_hf_worker_acquisition.py
              tests/test_remote_telemetry.py
            ) ;;
            *) exit 2 ;;
          esac
          parent_namespace="$(readlink /proc/self/ns/net)"
          sudo env HOME="$HOME" USER="$USER" LOGNAME="$USER" PATH="$PATH" PYTHONUNBUFFERED=1 \
            _BIOXP_PYTEST_NETNS=1 _BIOXP_PYTEST_PARENT_NETNS="$parent_namespace" \
            unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            timeout --signal=TERM --kill-after=10s 210s \
            "$PWD/.venv/bin/python" -u -c '
          import faulthandler, sys
          faulthandler.enable()
          faulthandler.dump_traceback_later(180, exit=True)
          print("FROZEN_INTERPRETER", sys.executable, flush=True)
          import pytest
          code = pytest.main(sys.argv[1:])
          faulthandler.cancel_dump_traceback_later()
          raise SystemExit(code)
          ' -vv -s --randomly-seed=20260920 "${modules[@]}" \
            --junitxml="$RUNNER_TEMP/bridge-diagnostics/junit-${TEST_GROUP}.xml" \
            2>&1 | tee "$RUNNER_TEMP/bridge-diagnostics/${TEST_GROUP}.log"
      - name: Preserve exact source and case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-diagnostics/
          if-no-files-found: error
          retention-days: 14
