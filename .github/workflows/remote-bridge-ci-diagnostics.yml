name: Complete portable bridge fixture verification
on:
  push:
    branches: [test-remote-bridge-ci-diagnostics-20260920]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: d5e156249a2bb69e91767029053b6cd710c5b37f
      OUTPUT_BRANCH: test-remote-bridge-integration-20260920
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d5e156249a2bb69e91767029053b6cd710c5b37f
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Close fixture-owned links and isolate compiler/root prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$BASE"
          git config user.name 'BMS Review'
          git config user.email 'bms-review@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import ast
          root = Path('platform/api/tests')
          path = root / 'python_runtime_fixture.py'
          text = path.read_text()
          assert text.count('symlinks=True') == 2
          # Materialize the declared Python members: distro stdlib contains
          # libpython aliases into a separate multiarch library directory.
          # Keep production relocation's no-escaping-link checks unchanged.
          path.write_text(text.replace('symlinks=True', 'symlinks=False'))
          path = root / 'test_python_runtime_fixture.py'
          text = path.read_text()
          old = "    assert not list(base.rglob('dist-packages'))\n"
          assert text.count(old) == 1
          text = text.replace(old, old + "    assert all(not member.is_symlink() or member.resolve().is_relative_to(base)\n               for member in base.rglob('*'))\n")
          old = "    (stdlib / 'stdlib.py').write_text('# complete test source')\n"
          assert text.count(old) == 1
          text = text.replace(old, old + "    library = prefix / 'lib/libpython-fixture.so'\n    library.write_bytes(b'fixture library bytes, never executed')\n    (stdlib / 'config').mkdir()\n    (stdlib / 'config/libpython.so').symlink_to(library)\n")
          old = "    assert not list(base.rglob('unrelated'))\n"
          assert text.count(old) == 1
          text = text.replace(old, old + "    copied = next(base.rglob('config/libpython.so'))\n    assert not copied.is_symlink()\n    assert copied.read_bytes() == library.read_bytes()\n")
          path.write_text(text)
          path = root / 'test_remote_bundle_runtime_gaps.py'
          text = path.read_text()
          old = "    current.symlink_to('releases/r1', target_is_directory=True)\n"
          assert text.count(old) == 1
          extra = '''    # Compiler-only command identity: never discover the operator's installed
              # Nextflow. A test that actually executes this placeholder must fail.
              launcher = roots['runtime'] / 'nextflow'
              launcher.write_text('#!/bin/sh\\nprintf "compiler-only Nextflow fixture must not execute\\\\n" >&2\\nexit 125\\n')
              launcher.chmod(0o755)
              monkeypatch.setenv('BMS_NEXTFLOW_BIN', str(launcher))
          '''
          path.write_text(text.replace(old, old + extra))
          path = root / 'test_vast_auto_setup.py'
          text = path.read_text()
          old = 'id() { echo 0; }\n'
          assert text.count(old) == 2
          text = text.replace(old, old + '''chown() { printf '%s\\n' "$*" >> "$STATE/chown-log"; }
          ''')
          old = "env={**os.environ, 'FAIL_STAGE': stage}, capture_output=True, text=True)"
          assert text.count(old) == 1
          text = text.replace(old, "env={**os.environ, 'FAIL_STAGE': stage, 'STATE': str(tmp_path)}, capture_output=True, text=True)")
          for old in ("    assert 'BMS_SETUP_ERROR:' in result.stdout\n", "    assert first.returncode == 0, first.stderr\n"):
              assert text.count(old) == 1
              text = text.replace(old, old + '''    assert f"0:0 -- {tmp_path / 'worker-root'}" in (tmp_path / 'chown-log').read_text()
          ''')
          path.write_text(text)
          for name in ('python_runtime_fixture.py', 'test_python_runtime_fixture.py',
                       'test_remote_bundle_runtime_gaps.py', 'test_vast_auto_setup.py'):
              path = root / name
              ast.parse(path.read_text(), filename=str(path))
          PY
          cat >> docs/plans/2026-09-20-remote-bridge-review-closeout.md <<'EOF'

          The next full run on d5e1562 completed 544 cases: 510 passed, 29 failed,
          five pre-existing explicit live/parser opt-ins skipped. No cases were
          removed to conceal failures. That run exposed incomplete closure of the
          narrowed CPython fixture's multiarch symlinks, a compiler-only fixture
          discovering host Nextflow, and fake-root shell tests attempting a real
          chown as an unprivileged runner. The fixture now materializes actual
          stdlib link referents and asserts containment, explicitly pins a
          compiler-only launcher that fails if executed, and records/asserts the
          simulated ownership call. Real parser/container opt-ins remain separate;
          no fake launcher is accepted as evidence of native Nextflow execution.
          Production readiness, bootstrap ownership and bundle containment are
          unchanged. Case-level results of the corrected candidate must supersede
          this historical failed run before promotion.
          EOF
          git rm platform/api/config/ngs_molbio_runtime/runtime_implementation_v2.json
          git add platform/api/tests/python_runtime_fixture.py platform/api/tests/test_python_runtime_fixture.py \
            platform/api/tests/test_remote_bundle_runtime_gaps.py platform/api/tests/test_vast_auto_setup.py \
            docs/plans/2026-09-20-remote-bridge-review-closeout.md
          git diff --cached --check
          git commit -m 'test(remote): close portable fixture prerequisites and freeze source'
          mkdir -p "$RUNNER_TEMP/bridge-final-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/bridge-final-evidence/freeze.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/bridge-final-evidence/tree.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/bridge-final-evidence/commit.object"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/bridge-final-evidence/frozen-source.tar.gz"
      - name: Canonically bind and validate the corrected source
        working-directory: platform/api
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          evidence="$RUNNER_TEMP/bridge-final-evidence"
          frozen="$RUNNER_TEMP/bridge-final-frozen"
          mkdir -p "$frozen"
          tar -xzf "$evidence/frozen-source.tar.gz" -C "$frozen"
          uv run --offline --frozen --group dev python "$frozen/scripts/build_ngs_molbio_runtime_implementation_record.py" \
            --successor-source-commit "$(cat "$evidence/freeze.txt")" \
            --successor-source-tree "$(cat "$evidence/tree.txt")" \
            --successor-commit-object "$evidence/commit.object"
          cp "$frozen/platform/api/config/ngs_molbio_runtime/runtime_implementation_v2.json" config/ngs_molbio_runtime/runtime_implementation_v2.json
          git add config/ngs_molbio_runtime/runtime_implementation_v2.json
          git diff --cached --check
          git commit -m 'build(runtime): bind portable remote bridge integration candidate'
          git diff --check "$BASE..HEAD"
          git rev-parse HEAD > "$evidence/candidate.txt"
          git log --oneline "$BASE..HEAD" | tee "$evidence/commits.txt"
          uv run --offline --frozen --group dev python - <<'PY'
          import importlib.util, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd().parents[1]
          spec = importlib.util.spec_from_file_location('candidate_sync', root / 'scripts/biomodstack_dev_sync.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          result = module.validate_candidate_runtime_authority(root, revision)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bridge-final-evidence'
          (evidence / 'updater.json').write_text(json.dumps({'revision': revision, 'accepted': True, 'result': result}, sort_keys=True))
          print('UPDATER_ACCEPTED', revision)
          PY
      - name: Publish only bound test-fixture corrections to isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE..HEAD" -- .github/workflows)"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'platform/api/tests/python_runtime_fixture.py',
              'platform/api/tests/test_python_runtime_fixture.py',
              'platform/api/tests/test_remote_bundle_runtime_gaps.py',
              'platform/api/tests/test_vast_auto_setup.py',
              'docs/plans/2026-09-20-remote-bridge-review-closeout.md',
              'platform/api/config/ngs_molbio_runtime/runtime_implementation_v2.json'}
          paths = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE']+'..HEAD'], text=True).splitlines())
          assert paths == allowed, paths
          PY
          test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
      - name: Execute the full unchanged selection and owning relocation tests
        working-directory: platform/api
        shell: bash
        run: |
          set -euo pipefail
          parent_namespace="$(readlink /proc/self/ns/net)"
          sudo env HOME="$HOME" USER="$USER" LOGNAME="$USER" PATH="$PATH" PYTHONUNBUFFERED=1 \
            _BIOXP_PYTEST_NETNS=1 _BIOXP_PYTEST_PARENT_NETNS="$parent_namespace" \
            unshare --net --setgid="$(id -g)" --setuid="$(id -u)" \
            timeout --signal=TERM --kill-after=10s 600s \
            "$PWD/.venv/bin/python" -u -m pytest -vv -s --randomly-seed=20260920 -o faulthandler_timeout=90 \
            tests/test_remote_provision_isolation.py tests/test_remote_inventory_supersession.py \
            tests/test_remote_incremental_admission.py tests/test_remote_helper_diagnostics.py \
            tests/test_managed_runtime_safety.py tests/test_ngs_molbio_runtime_record_builder.py \
            tests/test_remote_managed_inventory.py tests/test_remote_preloading.py \
            tests/test_vast_auto_setup.py tests/test_remote_cache_integration.py \
            tests/test_remote_runtime_images.py tests/test_remote_runner_integrity.py \
            tests/test_artifact_cache.py tests/test_cache_batches.py \
            tests/test_multiworker_scheduling.py tests/test_multiworker_migration.py \
            tests/test_managed_ssh_transport.py tests/test_vast_ssh_endpoint_selection.py \
            tests/test_hf_worker_acquisition.py tests/test_remote_telemetry.py \
            tests/test_python_runtime_fixture.py tests/test_remote_bundle_runtime_gaps.py \
            tests/test_remote_bundle_container_gaps.py tests/test_remote_support_packaging.py \
            --junitxml="$RUNNER_TEMP/bridge-final-evidence/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/bridge-final-evidence/regression.log"
      - name: Preserve exact source and JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-final-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-final-evidence/
          retention-days: 14
          if-no-files-found: error
