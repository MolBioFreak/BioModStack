name: BMS-DEV-57 isolated review
on:
  push:
    branches: [review-build/bms-dev57-msa-provider-settings]
  workflow_dispatch:
# The token is exposed only to the final, explicitly named review-branch push.
# No worker, provider secrets, canonical test/main mutation, or deployment step.
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NXF_VER: 25.10.1
      NXF_DISABLE_CHECK_LATEST: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.17'
          python-version: '3.12'
          enable-cache: false
      - name: Assemble pinned source repair without changing canonical branches
        run: python3 .review/build_dev57.py assemble
      - name: Install the unchanged locked API environment
        run: cd "$RUNNER_TEMP/bms-dev57/candidate/platform/api" && uv sync --frozen --group dev
      - name: Provision the real pinned Nextflow before network isolation
        shell: bash
        run: |
          set -euo pipefail
          launcher="$HOME/.local/lib/nextflow/25.10.1/nextflow"
          mkdir -p "$(dirname "$launcher")" "$RUNNER_TEMP/nextflow-download"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/nextflow-io/nextflow/releases/download/v25.10.1/nextflow -o "$launcher"
          echo "04cf76ee6bef9175273ea908d7ff0d5f82a7c5fd09e668248f56d376ed67ee11  $launcher" | sha256sum --check
          chmod 755 "$launcher"
          (cd "$RUNNER_TEMP/nextflow-download" && "$launcher" -version) | tee "$RUNNER_TEMP/bms-dev57/evidence/nextflow-version.txt"
          sha256sum "$launcher" "$HOME/.nextflow/framework/25.10.1/nextflow-25.10.1-one.jar" > "$RUNNER_TEMP/bms-dev57/evidence/nextflow-sha256.txt"
          echo "BMS_NEXTFLOW_BIN=$launcher" >> "$GITHUB_ENV"
          echo "BMS_NEXTFLOW_VERSION=25.10.1" >> "$GITHUB_ENV"
          echo "NXF_OFFLINE=true" >> "$GITHUB_ENV"
          echo "$(dirname "$launcher")" >> "$GITHUB_PATH"
      - name: Freeze and generate canonical runtime source binding
        run: python3 .review/build_dev57.py bind
      - name: Verify baseline, regression detection, candidate and updater authority
        run: python3 .review/build_dev57.py verify
      - name: Publish only the verified secondary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/bms-dev57/candidate"
          verified="$(cat "$RUNNER_TEMP/bms-dev57/evidence/verified.txt")"
          test "$(git -C "$candidate" rev-parse HEAD)" = "$verified"
          test -z "$(git -C "$candidate" status --porcelain)"
          branch='test-bms-dev57-msa-provider-settings'
          test -z "$(git -C "$candidate" ls-remote origin "refs/heads/$branch")"
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$candidate" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            push origin "HEAD:refs/heads/$branch"
          test "$(git -C "$candidate" ls-remote origin "refs/heads/$branch" | cut -f1)" = "$verified"
          printf '%s\n' "$verified" > "$RUNNER_TEMP/bms-dev57/evidence/published.txt"
      - name: Preserve source and case-level evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bms-dev57-review-${{ github.run_id }}
          path: ${{ runner.temp }}/bms-dev57/evidence/
          retention-days: 14
          if-no-files-found: error
