<script>
const manifest=[{id:'geometry',label:'01 · Geometry workspace'},{id:'upload',label:'02 · Upload and scale'},{id:'generation',label:'03 · RFD3 generation'},{id:'proteinmpnn',label:'04 · ProteinMPNN settings'},{id:'fampnn',label:'05 · FA-MPNN settings'},{id:'caliby',label:'06 · Caliby settings'},{id:'prediction',label:'07 · Structure prediction'},{id:'run',label:'08 · Run configuration'},{id:'results',label:'09 · Results overview'},{id:'candidate',label:'10 · Candidate inspection'},{id:'recovery',label:'11 · Read failure and recovery'}];
window.mockupManifest=manifest;
const defaults={name:'Shape study',length:'120',backbones:'12',seed:'0',steps:'200',count:'3',temperature:'0.1',policy:'Explicit engine',engine:'proteinmpnn',profile:'Shape-transfer control',lengthmode:'Fixed length',unit:'Ångström · 1 unit = 1 Å',predict_samples:'1',predict_msa:'Off · current Shape default',placement:'Local',geometryMode:'surface',source:'saved'};
let state={...defaults};try{Object.assign(state,JSON.parse(localStorage.getItem('bms-cad-design-prototype')||'{}'))}catch{}let route='geometry';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('bms-cad-design-prototype',JSON.stringify(state))}catch{}}
function set(k,v){state[k]=v;save();if(k==='policy')render()}
function field(label,key,value,help='',unit=''){const val=state[key]??value;return `<label class="field"><span>${label}${unit?`<i>${unit}</i>`:''}</span><input data-key="${key}" aria-label="${label}" value="${esc(val)}" oninput="set('${key}',this.value)">${help?`<div class="help">${help}</div>`:''}</label>`}
function select(label,key,options,help=''){return `<label class="field"><span>${label}</span><select data-key="${key}" aria-label="${label}" onchange="set('${key}',this.value)">${options.map((x,i)=>`<option ${state[key]===x||(!(key in state)&&i===0)?'selected':''}>${x}</option>`).join('')}</select>${help?`<div class="help">${help}</div>`:''}</label>`}
function check(label,key,checked=true,note=''){return `<label class="check"><input aria-label="${label}" type="checkbox" ${state[key]??checked?'checked':''} onchange="set('${key}',this.checked)">${label}${note?`<small>${note}</small>`:''}</label>`}
function detail(title,body,open=false){return `<details ${open?'open':''}><summary>${title}</summary><div class="detailbody">${body}</div></details>`}
function button(text,handler,cls=''){return `<button class="${cls}" type="button" onclick="${handler}">${text}</button>`}
function note(t){document.getElementById('toast').textContent=t;clearTimeout(window.to);window.to=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function go(id){location.hash=id}
function theme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='midnight'?'clean_light':'midnight'}
function mesh(protein=false){let lines='',pts='',surface='';const project=(a,b)=>{let r=1+.065*Math.cos(3*a)*Math.cos(2*b),x=155*r*Math.cos(b)*Math.cos(a),y=110*r*Math.cos(b)*Math.sin(a),z=128*Math.sin(b);return [330+x*.86-y*.43,200+x*.17+y*.45-z*.93]};for(let j=0;j<=14;j++){let b=-Math.PI/2+j*Math.PI/14,coords=[];for(let i=0;i<=48;i++){let [x,y]=project(i*2*Math.PI/48,b);coords.push(`${x.toFixed(1)},${y.toFixed(1)}`);if(i%3===0&&j%2===0)pts+=`<circle cx="${x}" cy="${y}" r="2" fill="var(--mesh)" opacity=".8"/>`}lines+=`<polyline points="${coords.join(' ')}" fill="none" stroke="var(--mesh)" stroke-width=".9" opacity=".44"/>`}for(let i=0;i<24;i++){let coords=[];for(let j=0;j<=28;j++){let [x,y]=project(i*2*Math.PI/24,-Math.PI/2+j*Math.PI/28);coords.push(`${x},${y}`)}lines+=`<polyline points="${coords.join(' ')}" fill="none" stroke="var(--mesh)" opacity=".4" stroke-width=".8"/>`}for(let i=-5;i<=5;i++){let a=i*36;surface+=`<path d="M ${110+a},332 L ${450+a},245 M ${120+a},245 L ${460+a},332" stroke="var(--border-primary)" stroke-width=".7"/>`}let ribbon='';if(protein){let p=[];for(let i=0;i<270;i++){let t=i*.085,x=330+93*Math.sin(t)*(.7+.3*Math.cos(t*.2)),y=195+78*Math.cos(t*.59)+18*Math.sin(t*2.5);p.push(`${x.toFixed(1)},${y.toFixed(1)}`)}ribbon=`<polyline points="${p.join(' ')}" fill="none" stroke="var(--accent-primary)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" opacity=".85"/>`}
return `<svg viewBox="0 0 660 410" role="img" aria-label="Schematic geometry${protein?' and protein ribbon':''}; not scientific output"><defs><radialGradient id="fill-${route}"><stop stop-color="var(--mesh)" stop-opacity=".15"/><stop offset="1" stop-color="var(--mesh)" stop-opacity=".02"/></radialGradient></defs>${surface}<ellipse cx="330" cy="316" rx="141" ry="24" fill="var(--mesh)" opacity=".035"/><ellipse cx="330" cy="200" rx="149" ry="129" fill="url(#fill-${route})"/>${state.geometryMode==='points'?pts:lines}${ribbon}<path d="M 176,354 H 473 M 176,349 v 10 M 473,349 v 10" stroke="var(--text-muted)" stroke-width="1"/><text x="324" y="377" text-anchor="middle" fill="var(--text-secondary)" font-size="11">Example span · 48 Å</text><g transform="translate(584,335)"><path d="M0,0h30 M0,0v-32 M0,0l-19,15" stroke="var(--text-secondary)"/><text x="34" y="4" fill="var(--text-secondary)" font-size="10">X</text><text x="-3" y="-38" fill="var(--text-secondary)" font-size="10">Z</text><text x="-30" y="23" fill="var(--text-secondary)" font-size="10">Y</text></g></svg>`}
function preview(title='Geometry preview',protein=false,compact=false){return `<section class="card"><div class="cardheader"><div><h2>${title}</h2><p>${protein?'Source and prediction document comparison':'Canonical geometry · example source'}</p></div><div class="seg">${button('Surface',"set('geometryMode','surface');render()",state.geometryMode==='surface'?'active':'')}${button('Points',"set('geometryMode','points');render()",state.geometryMode==='points'?'active':'')}</div></div><div class="canvas ${compact?'':'big'}"><div class="canvaslabel">SCHEMATIC ${protein?'STRUCTURE OVERLAY':'MESH'} · NOT MODEL OUTPUT</div>${mesh(protein)}<div class="viewtools">${button('↶',"note('Prototype: production orbit control is retained.')")}${button('↷',"note('Prototype: production orbit control is retained.')")}${button('Reset view',"note('Prototype: production camera reset is retained.')")}${button('Expand',"note('Prototype: use the existing viewer fullscreen control in production.')")}</div></div><div class="caption"><span><span style="color:var(--mesh)">●</span> Canonical ${state.geometryMode==='points'?'point pool':'surface'}${protein?' · <span style="color:var(--accent-primary)">●</span> Selected prediction':''}</span>${button('Download geometry',"note('No scientific artifact is attached to this illustrative prototype.')",'quiet')}</div></section>`}
function context(){return `<section class="card pad"><h3>Current design</h3><div class="contextline"><span>Geometry</span><b>rounded_shell.stl</b></div><div class="contextline"><span>Dimensions</span><b>48 × 42 × 36 Å <small>example</small></b></div><div class="contextline"><span>Generation</span><b>RFD3 · ${esc(state.backbones)} backbones</b></div><div class="contextline"><span>Protein length</span><b>${esc(state.length)} residues</b></div><div class="contextline"><span>Sequence policy</span><b>${esc(state.policy)}</b></div><p class="help" style="margin-top:13px">This preview supplies geometric context. It is not a predicted protein.</p></section>`}
function geometry(upload=false,recovery=false){return `<div class="content"><div class="stack"><section class="card pad"><h2>${upload?'Import geometry':'Geometry source'}</h2><p class="intro">Bring a shape, set its physical scale, and inspect it.</p><div class="seg">${button('Saved geometry',"go('geometry')",!upload?'active':'')}${button('Upload OBJ / STL',"go('upload')",upload?'active':'')}</div>${recovery?`<div class="notice warning" style="margin-top:16px"><strong>Geometry list could not refresh.</strong><br>Your selected geometry and settings are retained.<br>${button('Retry list',"go('geometry')",'quiet')}</div>`:''}${upload?`<div class="dropzone"><div class="plus">＋</div><h3>Drop one mesh here</h3><p>Closed triangular OBJ or STL · ASCII or binary</p>${button('Browse files',"note('Visual prototype only. No file is uploaded.')")}</div>`:`<div class="filecard"><div class="fileicon">STL</div><div><div class="filename">rounded_shell.stl</div><small>Illustrative saved geometry</small></div><span class="right" style="color:var(--accent-primary)">✓</span></div>${button('Choose another geometry',"note('Production reuses the current geometry library and exact saved identity.')",'quiet')}`}${upload?select('Source units','unit',['Ångström · 1 unit = 1 Å','Nanometer','Micrometer','Millimeter','Centimeter','Meter','Inch','Foot'],'STL carries no unit metadata. Choose the intended conversion.'):'<div class="contextline"><span>Saved source scale</span><b>1 mesh unit = 1 Å</b></div><p class="help" style="margin-top:10px">To change scale, import a new geometry. This saved source stays unchanged.</p>'}${upload?`<div class="notice"><strong>No automatic resizing.</strong><br>Changing units changes physical dimensions. Review the canonical preview after import.</div><div style="margin-top:16px">${button('Import geometry',"note('Prototype only. Existing mesh validation would run here; no upload occurred.')",'primary')}</div>`:`<div class="kicker">Canonical dimensions · illustrative</div><div class="dim"><div><strong>48 <small>Å</small></strong><span>Width · X</span></div><div><strong>42 <small>Å</small></strong><span>Depth · Y</span></div><div><strong>36 <small>Å</small></strong><span>Height · Z</span></div>${detail('Geometry details',`<p class="help">Retain source format, conversion, vertex/face counts, canonical IDs, source and geometry identity, point pool and SDF details in this existing secondary surface. No hashes in the primary workspace.</p>`)}`}</section>${recovery?`<div class="notice">A failed read is not an empty library. Retry updates only the list; it does not replace your selection or submit anything.</div>`:`<p class="help">Use a mesh from your CAD tool. This workflow does not replace a mesh editor.</p>`}</div><div class="stack">${preview(upload?'Import preview':'Geometry preview')}<div class="notice">${upload?'Example of the post-import preview. Before import, this area shows a neutral empty state.':'Inspect the surface or the sampled interior. Geometry checks and source details are available without crowding the canvas.'}</div></div></div>`}
function generation(){return `<div class="content"><section class="card pad"><h2>RFD3 generation</h2><p class="intro">Set backbone count, length and sampling for this geometry.</p>${select('Guidance profile','profile',['Shape-transfer control','Unguided control'],'Existing control profiles. Neither implies folding or functional validation.')}${select('Length policy','lengthmode',['Fixed length','Deterministic range','Uniform integer range'])}<div class="row">${field('Protein length','length','120','','residues')}${field('Backbones','backbones','12','Illustrative draft; current fresh default is 1.')}</div><div class="row">${field('Diffusion timesteps','steps','200','Current Shape default: 200.')}${field('Seed','seed','0')}</div>${detail('Profile-defined guidance',`<div class="contextline"><span>Shape weight</span><b>0.75 · profile-fixed</b></div><div class="contextline"><span>Guide scale</span><b>2 · profile-fixed</b></div><div class="contextline"><span>Schedule</span><b>Constant · profile-fixed</b></div><div class="contextline"><span>Interior targets</span><b>800 · profile-fixed</b></div><p class="help" style="margin-top:10px">Read-only for the selected existing profile. No custom profile is introduced.</p>`)}${detail('Additional native sampling settings',`<p class="help">Model-owned typed controls for every applicable setting verified in the installed Shape sampler. Checkpoint selection uses the existing managed picker; no editable runtime paths.</p>`)}<p class="help" style="margin-top:16px">Your settings and geometry stay in place when switching sections.</p></section><div class="stack">${preview('Shape conditioning')}<div class="notice"><strong>Geometry is a conditioning objective.</strong> Sequence design and independent prediction remain separate stages, not a universal quality score.</div></div></div>`}
function seq(engine){if(state.policy==='Skip sequence design')return `<div class="content wide"><section class="card pad"><h2>Sequence design</h2><p class="intro">Skip this stage without discarding its settings.</p>${select('Sequence policy','policy',['Explicit engine','Auto · ProteinMPNN when needed','Skip sequence design'])}<div class="notice">Sequence design is off. Existing Shape skip behavior is unchanged.</div>${detail('Retained designer settings',`<p class="help">${esc(state.engine)} · ${esc(state.count)} sequences per backbone. Per-engine drafts remain available when re-enabled.</p>`)}</section>${context()}</div>`;const names={proteinmpnn:'ProteinMPNN',fampnn:'FA-MPNN',caliby:'Caliby'};let extra='';if(engine==='proteinmpnn'){extra=detail('Model and checkpoint',`<div class="row">${select('Model family','mpnn_family',['Soluble','Vanilla'])}${select('Checkpoint','mpnn_checkpoint',['v_48_020','v_48_002','v_48_010','v_48_030'])}</div>`,true)+detail('Sequence constraints',field('Omitted amino acids','mpnn_omit','CX','Native key: mpnn_omitAAs. Existing Shape default.'))+detail('Backbone noise and relaxation',field('Backbone noise','mpnn_noise','0','','Å')+'<p class="help">Applicable native relaxation settings retain their original meanings and defaults.</p>')+detail('Execution and reproducibility','<p class="help">Use the model-owned batch, seed and inference controls. Scheduler placement remains in Run.</p>')}
if(engine==='fampnn'){extra=detail('Side-chain sampling',check('Sequence-only sampling','fa_sequence',true)+check('Repack final side chains','fa_repack',false)+`<p class="help">Shape defaults: sequence-only on, final repacking off. Both remain editable.</p>`,true)+detail('Denoising and checkpoint',`<div class="row">${field('Denoising steps','fa_steps','100')}${select('Checkpoint','fa_checkpoint',['Current Shape checkpoint','Choose managed checkpoint…'])}</div>`)+detail('Sequence constraints',check('Exclude cysteine','fa_cys',false))+detail('Execution and reproducibility',field('Inference batch size','fa_batch','3','Initialized from requested sequences in the current Shape adapter. Explicit edits are retained.'))}
if(engine==='caliby'){extra=detail('Model and checkpoint',select('Model','caliby_model',['soluble_caliby_v1','soluble_caliby','caliby']),true)+detail('Generated-state constraints',`<p class="help">Each backbone supplies one primary state. No implicit multi-state grouping.</p>${field('Fixed sequence positions','caliby_fixed','','Typed author-residue editor in production; no invented A/B chain roles.')}${field('Symmetry positions','caliby_symmetry','','Exact native position semantics and limitations are preserved.')}`)+detail('Potts sampling',`<div class="row">${field('Sweeps','caliby_sweeps','500')}${select('Proposal','caliby_proposal',['dlmc','chromatic'])}</div>`)+detail('Side chains and conformer perturbations',`<div class="row">${field('Side-chain steps','caliby_scn','50')}${field('Gaussian conformers','caliby_gaussian','0')}</div>`)+detail('Execution and reproducibility','<p class="help">Model-owned batch, worker and native reproducibility controls. No binder-specific assumptions.</p>')}
return `<div class="content wide"><section class="card pad"><h2>Sequence design</h2><p class="intro">The generated backbone is the input. No second structure upload.</p>${select('Sequence policy','policy',['Explicit engine','Auto · ProteinMPNN when needed','Skip sequence design'],'Auto uses ProteinMPNN only when the existing workflow requires sequence design.') }<div class="enginechoices">${Object.entries(names).map(([id,label])=>button(`${label}<small>${id==='caliby'?'Ensemble-native':'Model-owned settings'}</small>`,`set('engine','${id}');go('${id}')`,engine===id?'active':'')).join('')}</div><div class="row">${field('Sequences per backbone','count','3','Illustrative selection; existing Shape fresh default is 1.')}${field('Sampling temperature',`${engine}_temperature`,'0.1','Native value, not a speed/quality preset.')}</div>${engine==='caliby'?'<div class="notice">Each generated backbone is one single-state ensemble. Other backbones are not added as conditioning states.</div>':''}<div class="kicker">Advanced settings · retained per designer</div>${extra}</section><div class="stack">${preview('Generated-source context',false,true)}${context()}<p class="help">Switching designer keeps each model’s settings. Advanced controls stay available without crowding the sampling choices.</p></div></div>`}
function prediction(){return `<div class="content wide"><section class="card pad"><h2>Structure prediction</h2><p class="intro">Inspect each predictor separately. Do not merge their scores.</p><div class="predictor selected"><div class="predictorhead"><input type="checkbox" checked disabled aria-label="ESMFold2 existing baseline"><h3>ESMFold2</h3><span class="native">Existing Shape baseline</span></div><p>Baseline structure and confidence for the existing Shape workflow.</p>${detail('ESMFold2 native settings','<p class="help">Expose applicable model-owned inference controls. Preserve current Shape effective defaults.</p>')}</div><div class="predictor selected"><div class="predictorhead"><input type="checkbox" checked aria-label="Include Boltz2" onchange="set('boltz_enabled',this.checked)"><h3>Boltz2</h3><span class="native">Selected</span></div>${detail('Boltz2 native settings',`<div class="row">${field('Recycling steps','boltz_recycles','3')}${field('Sampling steps','boltz_steps','50')}</div><p class="help">Current wrapper values are shown; all applicable native controls must be transported.</p>`)}</div><div class="predictor selected"><div class="predictorhead"><input type="checkbox" checked aria-label="Include Protenix V2" onchange="set('protenix_enabled',this.checked)"><h3>Protenix V2</h3><span class="native">Selected</span></div><div class="row" style="margin-top:14px">${field('Samples per sequence','predict_samples','1','Current Shape wrapper value.')}${select('MSA','predict_msa',['Off · current Shape default','On · shared provider / cache'])}</div>${detail('Advanced Protenix settings','<p class="help">Model version, templates and all applicable inference controls come from the existing native contract. Changing displayed controls must change the compiled invocation.</p>')}</div></section><div class="stack">${context()}<section class="card pad"><h3>Prediction scope</h3><p class="intro">Sequences produced by the selected sequence stage, through the existing Shape execution path.</p><div class="contextline"><span>ESMFold2</span><b>Baseline structure and metrics</b></div><div class="contextline"><span>Boltz2</span><b>Independent native evidence</b></div><div class="contextline"><span>Protenix V2</span><b>Independent native evidence</b></div><p class="help" style="margin-top:13px">A geometry fit is not a folding or functional claim. Missing measurements stay missing.</p></section><div class="notice">Predictions remain separate evidence. A missing confidence value is not zero and does not become a new acceptance cutoff.</div></div></div>`}
function run(){return `<div class="content wide"><section class="card pad"><h2>Run configuration</h2><p class="intro">Choose where this configuration will run.</p>${field('Job name','name','Shape study')}<div class="row">${select('Execution target','placement',['Local','Existing remote worker…'])}${select('Destination','destination',['Standalone','Current Project launch context'])}</div><div class="notice">Reuses the existing execution-target picker and remote review. Selecting Local is explicit; there is no fallback from an unavailable remote target.</div><div class="kicker">Selected work</div><div class="step"><div class="stepmark">1</div><div><h3>RFD3 geometry-conditioned generation</h3><p>${esc(state.backbones)} backbones · ${esc(state.length)} residues · ${esc(state.steps)} timesteps</p></div>${button('Edit',"go('generation')",'quiet right')}</div><div class="step"><div class="stepmark">2</div><div><h3>Sequence design${state.policy==='Skip sequence design'?' · skipped':''}</h3><p>${state.policy==='Skip sequence design'?'Settings retained; this stage will not run.':esc(state.count)+' sequences per backbone · '+({proteinmpnn:'ProteinMPNN',fampnn:'FA-MPNN',caliby:'Caliby'}[state.engine])}</p></div>${button('Edit',"go('proteinmpnn')",'quiet right')}</div><div class="step"><div class="stepmark">3</div><div><h3>Predictions and Shape results</h3><p>${state.policy==='Skip sequence design'?'Existing skip path; no sequence-derived prediction is added.':'Current selected roster · native evidence remains separate'}</p></div>${button('Edit',"go('prediction')",'quiet right')}</div>${detail('Requested and effective settings','<p class="help">Reuse existing readback and remote review; this is not a new local approval step. Keep profile-fixed values distinguishable from editable values.</p>')}</section><div class="stack">${preview('Geometry to be used',false,true)}<section class="card pad"><h3>Before launch</h3><div class="contextline"><span>Saved geometry</span><b>rounded_shell.stl · example</b></div><div class="contextline"><span>Source scale</span><b>1 mesh unit = 1 Å</b></div><p class="help" style="margin-top:13px">Existing request and model-input checks remain at their current owners. No additional proof, diagnostic score or UI section completion is required.</p></section></div></div>`}
function scatter(){let pts='';for(let i=0;i<24;i++){let x=76+(i*71%440),y=32+(i*37%105);pts+=`<circle cx="${x}" cy="${y}" r="4" fill="${i%4===0?'var(--accent-secondary)':'var(--accent-primary)'}" opacity=".8"/>`}return `<svg viewBox="0 0 620 190" role="img" aria-label="Illustrative initial geometry metric scatter"><g stroke="var(--border-primary)"><path d="M55 20V150H580"/>${[50,90,130].map(y=>`<path d="M55 ${y}H580"/>`).join('')}</g>${pts}<g fill="var(--text-secondary)" font-size="10"><text x="10" y="25">1.0</text><text x="10" y="145">0.0</text><text x="245" y="182">Initial shape total · native units</text><text transform="translate(27 133) rotate(-90)">Inside fraction</text></g></svg>`}
function bars(){return `<svg viewBox="0 0 340 190" role="img" aria-label="Illustrative available metrics counts">${[['Initial geometry',24,26],['ESMFold2',18,66],['Boltz2',14,106],['Protenix V2',12,146]].map(([n,v,y])=>`<text x="0" y="${y+12}" fill="var(--text-secondary)" font-size="11">${n}</text><rect x="98" y="${y}" width="185" height="15" rx="3" fill="var(--bg-tertiary)"/><rect x="98" y="${y}" width="${v/24*185}" height="15" rx="3" fill="var(--accent-primary)"/><text x="294" y="${y+12}" fill="var(--text-secondary)" font-size="11">${v}/24</text>`).join('')}</svg>`}
function results(){return `<div class="content single"><div class="resulttabs"><b>Overview</b><a href="#candidate">Candidate inspector</a><span class="muted">Settings and provenance</span><span class="right muted">Illustrative cohort · not a real run</span></div><div class="stats"><div class="stat"><span>Backbone candidates</span><b>24</b><p>Example cohort</p></div><div class="stat"><span>Designed sequences</span><b>18</b><p>Distinct sequence records</p></div><div class="stat"><span>Selected for comparison</span><b>2</b><p>Selection persists across pages</p></div><div class="stat"><span>Prediction evidence</span><b>Mixed</b><p>Read native status per predictor</p></div></div><div class="charts"><section class="card"><div class="cardheader"><div><h3>Geometry measurements</h3><p>Initial stage only · example values</p></div><span class="pill">Metric-selectable</span></div><div class="chart">${scatter()}</div></section><section class="card"><div class="cardheader"><div><h3>Measurement availability</h3><p>Not a scientific success rate</p></div></div><div class="chart">${bars()}</div></section></div><section class="card"><div class="tabletop"><h3>Candidates</h3><select aria-label="Metric stage"><option>Initial geometry</option><option>Post-refold</option></select><select aria-label="Native model"><option>All prediction states</option><option>ESMFold2 measured</option></select>${button('Columns',"note('Production reuses shared column and metric controls.')")}${button('Export selected (2)',"note('Prototype only. Production exports exact selected IDs and declared cohort scope.')")}</div><div class="tablewrap"><table><thead><tr><th>Selection</th><th>Candidate</th><th>Sequence designer</th><th>Shape total</th><th>Inside fraction</th><th>ESMFold2</th><th>Native document</th></tr></thead><tbody>${[['001','ProteinMPNN','0.28','0.93','Measured'],['002','FA-MPNN','0.35','0.90','Not requested'],['003','Caliby','0.31','0.92','Read unavailable'],['004','ProteinMPNN','0.47','0.86','Measured']].map((r,i)=>`<tr class="${i<2?'selectedrow':''}"><td><input type="checkbox" aria-label="Select example candidate ${r[0]}" ${i<2?'checked':''}></td><td><a href="#candidate">shape_${r[0]}</a></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><a href="#candidate">Inspect ↗</a></td></tr>`).join('')}</tbody></table></div><div class="caption"><span>Showing 4 of 24 illustrative records · statistics use the declared cohort</span>${button('Next page',"note('Illustrative bounded table; production uses the existing paginated reader.')",'quiet')}</div></section><div class="notice" style="margin-top:16px">Missing values are not zero and native statuses are not merged into a pass/fail score. Initial geometry, designed sequences and post-refold results remain distinguishable.</div></div>`}
function candidate(){return `<div class="content wide"><div class="stack"><div class="resulttabs"><a href="#results">← Cohort overview</a><b>shape_001</b><span class="right muted">Illustrative candidate</span></div><section class="card"><div class="cardheader"><div><h2>Structure inspection</h2><p>Inspect the selected document against its source and geometry</p></div><span class="pill">Document-bound</span></div><div class="pad" style="padding-bottom:0">${select('Document','document',['ESMFold2 prediction','Source RFD3 backbone','Sequence-designer native output'])}</div><div class="canvas big"><div class="canvaslabel">SCHEMATIC PROTEIN + GEOMETRY · NOT MODEL OUTPUT</div>${mesh(true)}<div class="viewtools">${button('Measure',"note('Reuse the shared workbench when exact document bindings are available.')")}${button('Capture',"note('Production captures the actual selected document, not this schematic.')")}${button('Expand',"note('Production keeps the mounted Mol* runtime on expansion.')")}</div></div><div class="caption"><span>Canonical point pool overlay</span><span>Source backbone comparison</span></div><div class="residues">Sequence / residue tools<br><span>No synthetic amino-acid sequence is presented as a generated result.</span></div></section></div><div class="stack"><section class="card pad"><h2>Candidate evidence</h2><p class="intro">Document and stage labels travel with every measurement.</p><div class="contextline"><span>Initial shape total</span><b>0.28 <small>example</small></b></div><div class="contextline"><span>Initial inside fraction</span><b>0.93 <small>example</small></b></div><div class="contextline"><span>Post-refold shape total</span><b>Not measured</b></div><div class="contextline"><span>Source RMSD</span><b>Not measured</b></div><div class="contextline"><span>ESMFold2 confidence</span><b>Open native evidence</b></div>${detail('Native predictor evidence','<p class="help">Separate ESMFold2, Boltz2 and Protenix V2 records, exact structures and emitted metrics. PAE only where actually emitted and mapped.</p>')}${detail('Settings and provenance','<p class="help">Exact source geometry, requested/effective settings, producer identities and returned documents. Reuse existing records; no second ledger.</p>')}</section><section class="card pad"><h3>Continue from this structure</h3><p class="intro">Use the exact selected document, not an implicit primary fallback.</p>${button('Open in Redesign structure',"note('Planned completion: explicit document handoff to the existing redesign editor.')",'primary')}<div style="margin-top:10px">${button('Download native document',"note('No native document is attached to this visual prototype.')",'quiet')}</div><p class="help" style="margin-top:12px">Destination and execution target belong to the new request. Ancestry does not assign a worker.</p></section></div></div>`}
function body(id){if(id==='geometry'||id==='upload'||id==='recovery')return geometry(id==='upload',id==='recovery');if(id==='generation')return generation();if(['proteinmpnn','fampnn','caliby'].includes(id))return seq(id);if(id==='prediction')return prediction();if(id==='run')return run();if(id==='results')return results();return candidate()}
function shell(id){const result=['results','candidate'].includes(id);const active=['proteinmpnn','fampnn','caliby'].includes(id)?'sequence':['geometry','upload','recovery'].includes(id)?'geometry':id;return `<header class="top"><div class="brand"><span class="logo">∿</span>BioModStack</div><div class="topnav"><span>Dashboard</span><span>Projects</span><span class="${result?'':'chosen'}">Job Launcher</span><span class="${result?'chosen':''}">Data Viewer</span></div><div class="right">${button('◐ Theme',"theme()",'theme')}</div></header><div class="reviewbar"><span><b>DESIGN PROPOSAL</b> · Illustrative data and schematic artwork · No jobs or uploads</span><span>${manifest.find(x=>x.id===id).label}</span></div><main class="wrap" data-screen="${id}"><div class="crumb">Workflows / De Novo Protein Design / Shape</div><div class="heading"><div><h1>${result?'Shape study':'Shape design'}</h1><p>${result?'Geometry, sequence and prediction evidence in one connected result.':'Shape-guided protein design with RFD3'}</p></div><span class="pill">${result?'Example results':'Experimental'}</span><div class="actions">${button(result?'Edit configuration':'Saved configurations',result?"go('run')":"note('Reuses the current configuration library. This prototype does not write to BMS.')")}${button(result?'Export':'Save configuration',"note('Prototype only. No BMS configuration or results were written.')")}</div></div>${result?'':`<div class="modebar"><span>Generate</span><span>Redesign structure</span><span class="selected">Shape</span></div>`}<nav class="tabs" aria-label="Shape sections">${[['geometry','Geometry'],['generation','RFD3'],['sequence','Sequence design'],['prediction','Prediction'],['run','Run']].map(([key,label])=>button(label,`go('${key==='sequence'?state.engine:key}')`,active===key?'active':'')).join('')}<span class="spacer"></span>${button('Results preview',"go('results')",result?'active':'')}</nav>${body(id)}${result?'':`<div class="bottom"><p><strong>Illustrative draft</strong><br>${esc(state.backbones)} backbones · ${esc(state.length)} residues · ${state.policy==='Skip sequence design'?'sequence design skipped':esc(state.count)+' sequences per backbone'}</p><div class="right">${button('Save configuration',"note('Mockup draft retained locally; no application write.')")}${button(id==='run'?'Launch Shape design':'Run configuration',id==='run'?"note('Visual prototype only. No job was created and no GPU was used.')":"go('run')",'primary')}</div></div>`}<footer class="footer"><span>${manifest.find(x=>x.id===id).label} · Proposed UI, not deployed</span><span>Shared BMS controls · existing scientific defaults preserved</span></footer></main>`}
function render(){route=location.hash.slice(1);if(!manifest.some(x=>x.id===route))route='geometry';document.getElementById('app').innerHTML=shell(route);window.scrollTo(0,0)}
window.buildPrint=()=>{const oldroute=route;document.getElementById('printbook').innerHTML=manifest.map(x=>{route=x.id;return `<article class="printpage" data-print-screen="${x.id}">${shell(x.id)}</article>`}).join('');route=oldroute;return manifest.length};
window.resetMock=()=>{state={...defaults};save();render()};
window.addEventListener('beforeprint',()=>window.buildPrint());window.addEventListener('hashchange',render);render();
</script></body></html>
