server {
    listen 127.0.0.1:${BMS_WEB_HOST_PORT};
    server_name ~^(${BMS_CM_ALLOWED_HOST_PATTERN})$;
    if ($host !~* ^(${BMS_CM_ALLOWED_HOST_PATTERN})$) { return 421; }
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 512m;

    location = / {
        return 302 /bms/;
    }

    location = /bms {
        return 302 /bms/;
    }

    location = /bms/index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https: wss:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files /bms/index.html =404;
    }

    location /bms/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /bms/ {
        try_files $uri $uri/ /bms/index.html;
    }

    location = /api/ont/devices/reconnect {
        # Only the reviewed Tailnet ingress possesses this server-only secret.
        # A local caller cannot turn a forged identity header into a trusted API
        # request merely by reaching the host-networked web listener directly.
        if ($http_x_bms_cm_proxy_secret != "${BMS_CM_TRUSTED_PROXY_SECRET}") { return 401; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header X-BMS-CM-Proxy-Secret "${BMS_CM_TRUSTED_PROXY_SECRET}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-BMS-CM-Operator-Token "";
        proxy_set_header Tailscale-User-Login "";
        proxy_set_header X-BMS-CM-Proxy-Secret "${BMS_CM_TRUSTED_PROXY_SECRET}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
