map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:18081;
    server_name 127.0.0.1 localhost;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tailscale Serve asserts this identity to the reviewed loopback proxy.
        # Preserve it only on the server-side hop, accompanied by the same
        # server-only proxy secret that bms-web verifies for Mk1D reconnect.
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header X-BMS-CM-Proxy-Secret "${BMS_CM_TRUSTED_PROXY_SECRET}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
