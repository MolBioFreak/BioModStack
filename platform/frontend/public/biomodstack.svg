<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- BioModStack Logo - DNA Helix / Molecule Design -->
  <!-- Uses currentColor to inherit theme accent -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  
  <!-- Stylized B formed from molecular bonds -->
  <circle cx="8" cy="8" r="3" fill="url(#grad)"/>
  <circle cx="8" cy="16" r="3" fill="url(#grad)"/>
  <circle cx="8" cy="24" r="3" fill="url(#grad)"/>
  <circle cx="18" cy="12" r="2.5" fill="url(#grad)"/>
  <circle cx="18" cy="20" r="2.5" fill="url(#grad)"/>
  <circle cx="24" cy="16" r="2" fill="url(#grad)" opacity="0.7"/>
  
  <!-- Bonds -->
  <line x1="8" y1="8" x2="18" y2="12" stroke="url(#grad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="8" y1="16" x2="18" y2="12" stroke="url(#grad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="8" y1="16" x2="18" y2="20" stroke="url(#grad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="8" y1="24" x2="18" y2="20" stroke="url(#grad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="12" x2="24" y2="16" stroke="url(#grad)" stroke-width="1.2" opacity="0.6"/>
  <line x1="18" y1="20" x2="24" y2="16" stroke="url(#grad)" stroke-width="1.2" opacity="0.6"/>
</svg>
