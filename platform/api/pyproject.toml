[project]
name = "biomodstack-api"
version = "0.1.0"
description = "BioModStack Control Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.3",
    "psutil>=7.1.3",
    "numpy>=2.2.6",
    "pandas>=2.0.0",  # Required for FrustraMPNN API
    "biotite>=0.42.0",  # Structure analysis (PDB/CIF parsing, RMSD, SSE, etc.)
    "biopython>=1.84",
    "aiohttp>=3.13.3",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "viennarna>=2.7.0",
    "mocca2>=0.1.18",
    "pydoe3>=1.6.2",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.7.2",
    "bofire>=0.3.1",
    "qpcr>=4.1.4",
    "qslib>=0.15.0",
    "minknow-api>=6.10.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-randomly>=3.15.0",
    "pytest-socket>=0.7.0",
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "live_bioxp: exact-live contract marker; the default pytest harness remains route-free and live endpoint execution uses a separately authorized host lane",
]
