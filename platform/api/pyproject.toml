[project]
name = "biomodstack-api"
version = "0.1.0"
description = "BioModStack Control Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.18,<5",
    "pydantic-settings>=2.0.0",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.32",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.3",
    "psutil>=7.1.3",
    "numpy>=2.2.6",
    "pod5==0.3.35",
    "pandas>=2.0.0",  # Required for FrustraMPNN API
    "biotite>=0.42.0",  # Structure analysis (PDB/CIF parsing, RMSD, SSE, etc.)
    "biopython>=1.84",
    "aiohttp>=3.13.3",
    "httpx>=0.27.0",
    "viennarna>=2.7.0",
    "minknow-api>=6.10.1",
    "openpyxl>=3.1.5",
    "pillow>=12.1.0",  # Desktop tray icon rendering
]

[tool.uv]
constraint-dependencies = [
    "msgpack>=1.2.1",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-randomly>=3.15.0",
    "pytest-socket>=0.7.0",
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "live_bioxp: exact-live contract marker; the default pytest harness remains route-free and live endpoint execution uses a separately authorized host lane",
]
