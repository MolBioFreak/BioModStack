[project]
name = "biomodstack-api"
version = "0.1.0"
description = "BioModStack Control Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.3",
    "psutil>=7.1.3",
    "numpy>=2.2.6",
    "biotite>=0.42.0",  # Structure analysis (PDB/CIF parsing, RMSD, SSE, etc.)
    "aiohttp>=3.13.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
