[project]
name = "pysam"
version = "0.23.3+bms1"
description = "Pinned upstream pysam with maintained BMS no-save-index binding"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools==80.9.0", "Cython==3.1.3", "wheel==0.45.1"]
build-backend = "bms_build"
backend-path = ["."]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "bms_build.py" }, { file = "upstream.json" }, { file = "no-save-index.patch" }, { file = "build-requirements.lock" }]
