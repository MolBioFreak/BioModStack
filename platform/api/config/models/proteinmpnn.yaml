# ProteinMPNN Model Configuration
# Sequence design from backbone structure

id: proteinmpnn
name: ProteinMPNN
version: "1.1.0"
category: sequence_design
description: >
  Fast backbone-based sequence design using message passing neural networks.
  Includes optional FastRelax cycles for iterative refinement.
container: dl_binder_design.sif

ui_icon: dna
ui_color: "#10B981"

inputs:
  - pdb
outputs:
  - pdb
  - fasta
  - json

modes:
  - id: design
    name: Sequence Design
    description: Design sequences for a given backbone structure
    params:
      - input_pdb
      - seqs_per_design
      - binder_chains
      - target_chains
      - design_chain
      - target_chain
      - fixed_positions
      - mpnn_relax_output
      - mpnn_relax_seqs_per_cycle
      - mpnn_relax_convergence_rmsd
      - mpnn_relax_convergence_score
      - mpnn_relax_convergence_max_cycles
      - mpnn_output_intermediates
      - mpnn_num_connections
      - mpnn_bias_AA_jsonl
      - mpnn_temperature
      - mpnn_omitAAs
      - mpnn_checkpoint_type
      - mpnn_checkpoint_model
      - mpnn_backbone_noise
      - mpnn_relax_max_cycles
      - mpnn_extra_config

params:
  - name: seqs_per_design
    type: integer
    description: "Sequences sampled per input backbone."
    required: false
    default: 8
    minimum: 1

  - name: binder_chains
    type: string
    description: Explicit comma-separated binder chain IDs for complex design. Omitted retains legacy monomer behavior.
    required: false

  - name: target_chains
    type: string
    description: Explicit comma-separated target chain IDs. Target and other non-binder sequences remain fixed.
    required: false

  - name: design_chain
    type: string
    description: "Exact case-sensitive designed chain IDs, comma-separated; omitted only for a monomer."
    required: false

  - name: target_chain
    type: string
    description: "Exact target chain IDs; all non-designed context chains remain fixed."
    required: false

  - name: fixed_positions
    type: string
    description: "Fixed author residues, e.g. a:10B,1:5,A:20-30. Number-only ranges select blank insertion codes."
    required: false

  - name: mpnn_relax_output
    type: boolean
    description: "Run native FastRelax before saving the output."
    required: false
    default: false

  - name: mpnn_relax_seqs_per_cycle
    type: integer
    description: "Intermediate sequences per relaxation cycle; retain the lowest native score."
    required: false
    default: 1
    minimum: 1

  - name: mpnn_relax_convergence_rmsd
    type: number
    description: "Native relaxation convergence C-alpha RMSD threshold (angstrom)."
    required: false
    default: 0.2
    minimum: 0

  - name: mpnn_relax_convergence_score
    type: number
    description: "Native relaxation convergence absolute score-change threshold."
    required: false
    default: 0.1
    minimum: 0

  - name: mpnn_relax_convergence_max_cycles
    type: integer
    description: "Consecutive native convergence cycles."
    required: false
    default: 1
    minimum: 0

  - name: mpnn_output_intermediates
    type: boolean
    description: "Write native intermediate relaxation-cycle candidates."
    required: false
    default: false

  - name: mpnn_num_connections
    type: integer
    description: "Native graph neighbors; must agree with the selected checkpoint architecture."
    required: false
    default: 48
    minimum: 1

  - name: mpnn_bias_AA_jsonl
    type: file
    description: "Native per-amino-acid additive sampling bias JSON file."
    required: false
    file_type: json

  # Input file
  - name: input_pdb
    type: file
    description: Input backbone PDB structure for sequence design
    required: true
    file_type: pdb
    preset_type: pdb

  - name: mpnn_temperature
    type: number
    description: Sampling temperature. Higher = more diverse sequences.
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0

  - name: mpnn_omitAAs
    type: string
    description: Amino acids to exclude from design (e.g., 'CX' excludes Cys)
    required: false
    default: "CX"

  - name: mpnn_checkpoint_type
    type: string
    description: Model checkpoint - 'soluble' optimizes for solubility
    required: false
    default: soluble
    enum:
      - vanilla
      - soluble

  - name: mpnn_checkpoint_model
    type: string
    description: Noise level model (higher noise = more robust to backbone errors)
    required: false
    default: v_48_020
    enum:
      - v_48_002
      - v_48_010
      - v_48_020
      - v_48_030

  - name: mpnn_backbone_noise
    type: number
    description: Add Gaussian noise to backbone (Å) for robustness
    required: false
    default: 0
    minimum: 0
    maximum: 1

  - name: mpnn_relax_max_cycles
    type: integer
    description: Maximum FastRelax refinement cycles (0 = disabled)
    required: false
    default: 0
    minimum: 0
    maximum: 10

  - name: mpnn_extra_config
    type: string
    description: "Additional ProteinMPNN CLI arguments (e.g., '-protein_features=full')"
    required: false

enabled: true
experimental: false
