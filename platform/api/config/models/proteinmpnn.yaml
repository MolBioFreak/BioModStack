# ProteinMPNN Model Configuration
# Sequence design from backbone structure

id: proteinmpnn
name: ProteinMPNN
version: "1.0.1"
category: sequence_design
description: >
  Fast backbone-based sequence design using message passing neural networks.
  Includes optional FastRelax cycles for iterative refinement.
container: dl_binder_design.sif

ui_icon: dna
ui_color: "#10B981"

inputs:
  - pdb
outputs:
  - pdb
  - fasta
  - json

modes:
  - id: design
    name: Sequence Design
    description: Design sequences for a given backbone structure
    params:
      - input_pdb
      - seqs_per_design
      - binder_chains
      - target_chains
      - fixed_positions
      - mpnn_relax_output
      - mpnn_relax_seqs_per_cycle
      - mpnn_relax_convergence_rmsd
      - mpnn_relax_convergence_score
      - mpnn_relax_convergence_max_cycles
      - mpnn_temperature
      - mpnn_omitAAs
      - mpnn_checkpoint_type
      - mpnn_checkpoint_model
      - mpnn_backbone_noise
      - mpnn_relax_max_cycles
      - mpnn_extra_config

params:
  - name: seqs_per_design
    type: integer
    description: Native number of designed sequences per input backbone.
    required: false
    default: 8
    minimum: 1

  - name: binder_chains
    type: string
    description: Explicit comma-separated binder chain IDs for complex design. Omitted retains legacy monomer behavior.
    required: false

  - name: target_chains
    type: string
    description: Explicit comma-separated target chain IDs. Target and other non-binder sequences remain fixed.
    required: false

  - name: fixed_positions
    type: string
    description: "Additional fixed author residues for explicit binder roles, e.g. A:1,A:5-10."
    required: false

  - name: mpnn_relax_output
    type: boolean
    description: Apply native relaxation before writing each final structure.
    default: false

  - name: mpnn_relax_seqs_per_cycle
    type: integer
    description: Native intermediate sequences per relaxation cycle.
    default: 1
    minimum: 1

  - name: mpnn_relax_convergence_rmsd
    type: number
    description: Native relaxation convergence C-alpha RMSD in Angstroms.
    default: 0.2
    minimum: 0

  - name: mpnn_relax_convergence_score
    type: number
    description: Native relaxation convergence score improvement.
    default: 0.1
    minimum: 0

  - name: mpnn_relax_convergence_max_cycles
    type: integer
    description: Consecutive native convergence cycles.
    default: 1
    minimum: 0

  # Input file
  - name: input_pdb
    type: file
    description: Input backbone PDB structure for sequence design
    required: true
    file_type: pdb
    preset_type: pdb

  - name: mpnn_temperature
    type: number
    description: Sampling temperature. Higher = more diverse sequences.
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0

  - name: mpnn_omitAAs
    type: string
    description: Amino acids to exclude from design (e.g., 'CX' excludes Cys)
    required: false
    default: "CX"

  - name: mpnn_checkpoint_type
    type: string
    description: Model checkpoint - 'soluble' optimizes for solubility
    required: false
    default: soluble
    enum:
      - vanilla
      - soluble

  - name: mpnn_checkpoint_model
    type: string
    description: Noise level model (higher noise = more robust to backbone errors)
    required: false
    default: v_48_020
    enum:
      - v_48_002
      - v_48_010
      - v_48_020
      - v_48_030

  - name: mpnn_backbone_noise
    type: number
    description: Add Gaussian noise to backbone (Å) for robustness
    required: false
    default: 0
    minimum: 0
    maximum: 1

  - name: mpnn_relax_max_cycles
    type: integer
    description: Maximum FastRelax refinement cycles (0 = disabled)
    required: false
    default: 0
    minimum: 0
    maximum: 10

  - name: mpnn_extra_config
    type: string
    description: "Additional ProteinMPNN CLI arguments (e.g., '-protein_features=full')"
    required: false

enabled: true
experimental: false
