id: boltz_cp_experimental
name: NVIDIA Fold-CP
version: "0.1.0"
category: structure_prediction
description: >
  NVIDIA BioNeMo boltz-cp execution backend for the Structure Prediction workflow.
  It accepts Structure inputs and uses OEM DTensor context parallelism.
container: fold-cp.sif

ui_icon: sparkles
ui_color: "#F97316"
experimental: false

inputs:
  - yaml
  - fasta
outputs:
  - cif
  - pdb
  - json
  - npz

modes:
  - id: design
    name: Distributed Prediction
    description: Run Fold-CP multi-GPU structure prediction from a prepared Boltz input path
    params:
      - colabfold_use_env
      - colabfold_use_filter
      - colabfold_use_templates
      - colabfold_pairing_mode
      - colabfold_pairing_strategy
      - msa_provider
      - msa_neurosnap_coverage_percent
      - msa_neurosnap_identity_percent
      - msa_neurosnap_max_sequences
      - msa_neurosnap_force_uppercase
      - msa_neurosnap_pad_sequences
      - input_path
      - gpu_ids
      - size_cp
      - input_format
      - output_format
      - write_full_pae
      - recycling_steps
      - sampling_steps
      - diffusion_samples
      - seed

params:
  - name: colabfold_use_env
    type: boolean
    description: "ColabFold API only — Include environmental sequence databases. Native use_env."
    default: true

  - name: colabfold_use_filter
    type: boolean
    description: "ColabFold API only — Filter alignments; unfiltered paired search unsupported. Native use_filter."
    default: true

  - name: colabfold_use_templates
    type: boolean
    description: "ColabFold API only — Retrieve templates; unsupported by the current MSA artifact contract. Native use_templates."
    default: false

  - name: colabfold_pairing_mode
    type: string
    description: "ColabFold API only — Unpaired, paired, or both alignment roles; paired requires distinct chains. Native pairing_mode."
    default: unpaired
    enum: ["unpaired", "paired", "unpaired_paired"]

  - name: colabfold_pairing_strategy
    type: string
    description: "ColabFold API only — ColabFold species pairing strategy. Native pairing_strategy."
    default: greedy
    enum: ["greedy", "complete"]

  - name: msa_provider
    type: string
    description: "External MSA provider; auto selects ColabFold. Local disabled. Unsupported consumer/output combinations fail admission."
    default: colabfold_api
    enum: [auto, colabfold_api, neurosnap_api]

  - name: msa_neurosnap_coverage_percent
    type: number
    description: "Neurosnap API only — Coverage: Minimum query coverage (%)."
    default: 35
    minimum: 10
    maximum: 90

  - name: msa_neurosnap_identity_percent
    type: number
    description: "Neurosnap API only — Identity threshold: Provider minimum identity to query (%); not local redundancy filtering."
    default: 50
    minimum: 25
    maximum: 100

  - name: msa_neurosnap_max_sequences
    type: integer
    description: "Neurosnap API only — Max Sequences: Final MSA depth limit."
    default: 1000000
    minimum: 10
    maximum: 1000000

  - name: msa_neurosnap_force_uppercase
    type: boolean
    description: "Neurosnap API only — Force Uppercase: Uppercase residues including A3M insertions; consumer compatibility required."
    default: false

  - name: msa_neurosnap_pad_sequences
    type: boolean
    description: "Neurosnap API only — Pad Sequences: C-terminal gap padding to longest row; consumer compatibility required."
    default: false

  - name: input_path
    type: file
    description: Path to a Boltz YAML / FASTA input file, directory of configs, or preprocessed Boltz directory
    required: true

  - name: gpu_ids
    type: string
    description: Comma-separated host GPU IDs to expose to the CP run
    required: true
    default: "0,1,2,3"

  - name: size_cp
    type: integer
    description: Total number of context-parallel ranks; must be a perfect square and divide the selected GPU count
    required: true
    default: 4
    minimum: 1
    maximum: 16

  - name: input_format
    type: string
    description: Input layout for the Fold-CP CLI (config_files or preprocessed)
    required: false
    default: config_files

  - name: output_format
    type: string
    description: Output structure format written by Fold-CP (mmcif or pdb)
    required: false
    default: mmcif

  - name: write_full_pae
    type: boolean
    description: Write full PAE matrices in the confidence outputs
    required: false
    default: false

  - name: recycling_steps
    type: integer
    description: Number of Boltz trunk recycling iterations
    required: false
    default: 3
    minimum: 1
    maximum: 16

  - name: sampling_steps
    type: integer
    description: Number of diffusion denoising steps
    required: false
    default: 200
    minimum: 1
    maximum: 500

  - name: diffusion_samples
    type: integer
    description: Number of independent diffusion samples to draw
    required: false
    default: 1
    minimum: 1
    maximum: 32

  - name: seed
    type: integer
    description: Optional random seed for deterministic comparisons
    required: false
    minimum: 0
