id: boltz_cp_experimental
name: Fold-CP Experimental
version: "0.1.0"
category: structure_prediction
description: >
  Experimental Fold-CP large-protein workflow. The default
  true-distributed-context-parallel backend launches the DTensor
  context-parallel Boltz-2 prediction data-plane with torch.distributed.
  shared-cache-serial-output-tiling remains a legacy control-plane/output-tiling
  fallback and is not the default.
container: boltz2-pre-community-20260417-211613.sif

ui_icon: sparkles
ui_color: "#F97316"
experimental: true

inputs:
  - yaml
  - fasta
outputs:
  - cif
  - pdb
  - json
  - npz

modes:
  - id: design
    name: Fold-CP Large-Protein Backend
    description: Select the true distributed CP data-plane or an explicit legacy publication backend without conflating their semantics
    params:
      - input_path
      - shard_plan_id
      - gpu_ids
      - backend
      - triattn_backend
      - context_store_mode
      - context_store_root
      - context_query_tile_tokens
      - context_store_logical_size_cp
      - context_store_pair_tile_tokens
      - context_store_key_tile_tokens
      - context_store_projection_cache_byte_budget
      - input_format
      - output_format
      - write_full_pae
      - confidence_prediction
      - recycling_steps
      - sampling_steps
      - diffusion_samples
      - max_msa_seqs
      - max_parallel_samples
      - precision
      - seed

params:
  - name: input_path
    type: file
    description: Path to a Boltz YAML / FASTA input file, directory of configs, or preprocessed Boltz directory
    required: true

  - name: gpu_ids
    type: string
    description: Comma-separated host GPU IDs to expose to the CP torch.distributed run. If omitted, the scheduler-assigned GPU is used for standalone launches.
    required: false

  - name: backend
    type: string
    description: >
      Large-protein experimental backend. true-distributed-context-parallel runs
      the DTensor context-parallel Boltz-2 prediction data-plane. shared-cache-serial-output-tiling
      is a legacy control-plane/output-tiling fallback. dram-context-spill-workhorse
      remains an operation-level proof backend.
    required: false
    default: true-distributed-context-parallel
    enum:
      - true-distributed-context-parallel
      - shared-cache-serial-output-tiling
      - dram-context-spill-workhorse
      - metadata-only

  - name: shard_plan_id
    type: string
    description: Logical Fold-CP shard geometry identifier (1x1, 2x2, or 4x4); physical launch width is derived from this plan and the available GPU pool
    required: false
    default: 2x2

  - name: triattn_backend
    type: string
    description: >
      Triangle-attention backend for the true distributed CP data-plane.
      Defaults to reference because the current deployed runtime does not ship
      trifast; explicit trifast/cueq selections fail closed during preflight if
      their kernel packages are unavailable.
    required: false
    default: reference
    enum:
      - reference
      - trifast
      - cueq

  - name: context_store_mode
    type: string
    description: >
      Predictor-owned context-store mode for the direct true distributed CP
      data-plane. evidence-only records live Pairformer/DTensor rank metadata
      and does not claim tensor streaming, spill execution, or memory reduction.
      rank-local-dram-spill-layer and rank-local-dram-spill-op are compute-affecting
      true data-plane modes that copy the rank-local Pairformer z shard to host
      RAM between layer or operation boundaries respectively; they do not reduce
      within-operation scratch peaks. virtual-dram-stream-attention is the experimental
      true data-plane DRAM streaming bridge for triangle attention and projected
      triangle multiplication; it requires logical/tile knobs and remains fail-closed.
      Set off to disable the evidence/spill hook.
    required: false
    default: evidence-only
    enum:
      - evidence-only
      - rank-local-dram-spill-layer
      - rank-local-dram-spill-op
      - virtual-dram-stream-attention
      - "off"

  - name: context_store_root
    type: string
    description: >
      Optional output root for predictor-owned true-CP context-store evidence.
      If omitted, the Nextflow task writes true_cp_context_store under the task
      root and publishes it with the other true_cp_* diagnostics.
    required: false

  - name: context_query_tile_tokens
    type: integer
    description: >
      Enable predictor-owned REFERENCE triangle-attention query tiling inside
      the live distributed Pairformer data-plane. This reduces only reference
      triangle-attention score materialization; it is not output tiling or a
      control-plane cache.
    required: false
    default: 512
    minimum: 1

  - name: context_store_logical_size_cp
    type: integer
    description: Logical virtual CP shard count for virtual-dram-stream-attention; e.g. 16 for a 4x4 logical grid on CP4 physical ranks.
    required: false
    minimum: 1

  - name: context_store_pair_tile_tokens
    type: integer
    description: Pair-axis tile token count for virtual DRAM-streamed Pairformer state blocks.
    required: false
    minimum: 1

  - name: context_store_key_tile_tokens
    type: integer
    description: Key-axis tile token count for virtual DRAM-streamed triangle attention blocks.
    required: false
    minimum: 1

  - name: context_store_projection_cache_byte_budget
    type: integer
    description: Byte budget for exact CUDA K/V projection tile reuse in virtual-dram-stream-attention. 0 disables the cache.
    required: false
    default: 0
    minimum: 0

  - name: input_format
    type: string
    description: Input layout for the Fold-CP CLI (config_files or preprocessed)
    required: false
    default: config_files

  - name: output_format
    type: string
    description: Output structure format written by Fold-CP (mmcif or pdb)
    required: false
    default: mmcif

  - name: write_full_pae
    type: boolean
    description: Write full PAE matrices when confidence prediction is enabled
    required: false
    default: false

  - name: confidence_prediction
    type: boolean
    description: Run Boltz confidence heads after structure prediction. Defaults off for large-protein CP so structure-only benchmarks can finish without confidence-head memory pressure.
    required: false
    default: false

  - name: recycling_steps
    type: integer
    description: Number of Boltz trunk recycling iterations
    required: false
    default: 3
    minimum: 1
    maximum: 16

  - name: sampling_steps
    type: integer
    description: Number of diffusion denoising steps. Boltz diffusion sampling requires at least 2 steps; lower smoke values fail before producing predictions.
    required: false
    default: 200
    minimum: 2
    maximum: 500

  - name: diffusion_samples
    type: integer
    description: Number of independent diffusion samples to draw
    required: false
    default: 1
    minimum: 1
    maximum: 32

  - name: max_msa_seqs
    type: integer
    description: Maximum MSA sequences passed to the distributed Boltz predictor
    required: false
    default: 128
    minimum: 1

  - name: max_parallel_samples
    type: integer
    description: Maximum diffusion samples evaluated concurrently per rank
    required: false
    default: 1
    minimum: 1

  - name: precision
    type: string
    description: Precision mode for the distributed Boltz predictor
    required: false
    default: BF16
    enum:
      - BF16
      - BF16_MIXED
      - TF32
      - FP32

  - name: seed
    type: integer
    description: Optional random seed for deterministic comparisons
    required: false
    minimum: 0
