id: boltz_cp_experimental
name: Fold-CP Experimental
version: "0.1.0"
category: structure_prediction
description: >
  Experimental Fold-CP large-protein control-plane workflow. Current backend
  metadata distinguishes DRAM context-spill workhorse proofs from the
  shared-cache legacy path, which is not native distributed context parallel:
  that path performs one single full Boltz prediction then output tiling.
container: boltz2-pre-community-20260417-211613.sif

ui_icon: sparkles
ui_color: "#F97316"
experimental: true

inputs:
  - yaml
  - fasta
outputs:
  - cif
  - pdb
  - json
  - npz

modes:
  - id: design
    name: Fold-CP Large-Protein Backend
    description: Select an honest experimental backend and shard-plan metadata without claiming serial output tiling is native distributed CP
    params:
      - input_path
      - shard_plan_id
      - gpu_ids
      - backend
      - input_format
      - output_format
      - write_full_pae
      - recycling_steps
      - sampling_steps
      - diffusion_samples
      - seed

params:
  - name: input_path
    type: file
    description: Path to a Boltz YAML / FASTA input file, directory of configs, or preprocessed Boltz directory
    required: true

  - name: gpu_ids
    type: string
    description: Comma-separated host GPU IDs to expose to the CP run. If omitted, the scheduler-assigned GPU is used for standalone launches.
    required: false

  - name: backend
    type: string
    description: >
      Large-protein experimental backend. dram-context-spill-workhorse runs the
      current DRAM-backed live-state operation proof; shared-cache-serial-output-tiling
      is control-plane publication only, not native distributed context parallel,
      because it performs one single full Boltz prediction then output tiling.
    required: false
    default: dram-context-spill-workhorse
    enum:
      - dram-context-spill-workhorse
      - shared-cache-serial-output-tiling
      - metadata-only

  - name: shard_plan_id
    type: string
    description: Logical Fold-CP shard geometry identifier (1x1, 2x2, or 4x4); physical launch width is derived from this plan and the available GPU pool
    required: false
    default: 2x2

  - name: input_format
    type: string
    description: Input layout for the Fold-CP CLI (config_files or preprocessed)
    required: false
    default: config_files

  - name: output_format
    type: string
    description: Output structure format written by Fold-CP (mmcif or pdb)
    required: false
    default: mmcif

  - name: write_full_pae
    type: boolean
    description: Write full PAE matrices in the confidence outputs
    required: false
    default: false

  - name: recycling_steps
    type: integer
    description: Number of Boltz trunk recycling iterations
    required: false
    default: 3
    minimum: 1
    maximum: 16

  - name: sampling_steps
    type: integer
    description: Number of diffusion denoising steps
    required: false
    default: 200
    minimum: 1
    maximum: 500

  - name: diffusion_samples
    type: integer
    description: Number of independent diffusion samples to draw
    required: false
    default: 1
    minimum: 1
    maximum: 32

  - name: seed
    type: integer
    description: Optional random seed for deterministic comparisons
    required: false
    minimum: 0
