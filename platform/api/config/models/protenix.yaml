# Protenix V2 model configuration

id: protenix
name: Protenix V2
version: "2.0.0"
category: structure_prediction
description: >
  Protenix V2 structure prediction for protein monomers and multi-component
  complexes. BioModStack pins this model to the installed protenix-v2
  checkpoint; MSA-disabled operation remains Protenix V2 sequence-only mode.
container: protenix.sif

ui_icon: cube
ui_color: "#14B8A6"

inputs:
  - fasta
  - json
outputs:
  - cif
  - json

modes:
  - id: predict
    name: Structure Prediction
    description: Predict a protein structure with Protenix V2
    params:
      - colabfold_use_env
      - colabfold_use_filter
      - colabfold_use_templates
      - colabfold_pairing_mode
      - colabfold_pairing_strategy
      - msa_provider
      - msa_neurosnap_coverage_percent
      - msa_neurosnap_identity_percent
      - msa_neurosnap_max_sequences
      - msa_neurosnap_force_uppercase
      - msa_neurosnap_pad_sequences
      - sequence
      - sequence_name
      - protenix_model_weights
      - protenix_use_msa
      - protenix_msa_backend
      - protenix_use_template
      - protenix_seeds
      - protenix_n_sample
      - protenix_n_step
      - protenix_n_cycle
      - num_parallel_jobs

  - id: complex
    name: Complex Prediction
    description: Predict a protein or mixed-component complex with Protenix V2
    params:
      - colabfold_use_env
      - colabfold_use_filter
      - colabfold_use_templates
      - colabfold_pairing_mode
      - colabfold_pairing_strategy
      - msa_provider
      - msa_neurosnap_coverage_percent
      - msa_neurosnap_identity_percent
      - msa_neurosnap_max_sequences
      - msa_neurosnap_force_uppercase
      - msa_neurosnap_pad_sequences
      - sequence
      - sequence_name
      - protenix_model_weights
      - protenix_use_msa
      - protenix_msa_backend
      - protenix_use_template
      - protenix_seeds
      - protenix_n_sample
      - protenix_n_step
      - protenix_n_cycle
      - num_parallel_jobs

params:
  - name: colabfold_use_env
    type: boolean
    description: "ColabFold API only — Include environmental sequence databases. Native use_env."
    default: true

  - name: colabfold_use_filter
    type: boolean
    description: "ColabFold API only — Filter alignments; unfiltered paired search unsupported. Native use_filter."
    default: true

  - name: colabfold_use_templates
    type: boolean
    description: "ColabFold API only — Retrieve templates; unsupported by the current MSA artifact contract. Native use_templates."
    default: false

  - name: colabfold_pairing_mode
    type: string
    description: "ColabFold API only — Unpaired, paired, or both alignment roles; paired requires distinct chains. Native pairing_mode."
    default: unpaired
    enum: ["unpaired", "paired", "unpaired_paired"]

  - name: colabfold_pairing_strategy
    type: string
    description: "ColabFold API only — ColabFold species pairing strategy. Native pairing_strategy."
    default: greedy
    enum: ["greedy", "complete"]

  - name: msa_provider
    type: string
    description: "External MSA provider; auto selects ColabFold. Local disabled. Unsupported consumer/output combinations fail admission."
    default: colabfold_api
    enum: [auto, colabfold_api, neurosnap_api]

  - name: msa_neurosnap_coverage_percent
    type: number
    description: "Neurosnap API only — Coverage: Minimum query coverage (%)."
    default: 35
    minimum: 10
    maximum: 90

  - name: msa_neurosnap_identity_percent
    type: number
    description: "Neurosnap API only — Identity threshold: Provider minimum identity to query (%); not local redundancy filtering."
    default: 50
    minimum: 25
    maximum: 100

  - name: msa_neurosnap_max_sequences
    type: integer
    description: "Neurosnap API only — Max Sequences: Final MSA depth limit."
    default: 1000000
    minimum: 10
    maximum: 1000000

  - name: msa_neurosnap_force_uppercase
    type: boolean
    description: "Neurosnap API only — Force Uppercase: Uppercase residues including A3M insertions; consumer compatibility required."
    default: false

  - name: msa_neurosnap_pad_sequences
    type: boolean
    description: "Neurosnap API only — Pad Sequences: C-terminal gap padding to longest row; consumer compatibility required."
    default: false

  - name: sequence
    type: text
    description: Amino-acid sequence for standalone prediction
    required: true
    preset_type: sequence

  - name: sequence_name
    type: string
    description: Name for output structure files
    required: false
    default: predicted

  - name: protenix_model_weights
    type: string
    description: Fixed BioModStack Protenix V2 checkpoint selector
    required: false
    default: protenix-v2
    enum:
      - protenix-v2

  - name: protenix_use_msa
    type: boolean
    description: Use Protenix MSA features; disabling keeps the V2 checkpoint in sequence-only mode
    required: false
    default: true

  - name: protenix_msa_backend
    type: string
    description: "ColabFold or Neurosnap API — external services; auto resolves to ColabFold. Sequences are disclosed to a third party; rate limits apply. Local search disabled."
    required: false
    default: auto
    enum:
      - auto
      - colabfold_api
      - neurosnap_api
      - esm
      - none

  - name: protenix_use_template
    type: boolean
    description: Enable template features when available
    required: false
    default: false

  - name: protenix_seeds
    type: string
    description: Comma-separated model seeds
    required: false
    default: "42"

  - name: protenix_n_sample
    type: integer
    description: Number of diffusion samples per seed
    required: false
    default: 1
    minimum: 1
    maximum: 16

  - name: protenix_n_step
    type: integer
    description: Number of diffusion steps
    required: false
    default: 200
    minimum: 1
    maximum: 1000

  - name: protenix_n_cycle
    type: integer
    description: Number of recycling cycles
    required: false
    default: 10
    minimum: 1
    maximum: 20

  - name: num_parallel_jobs
    type: integer
    description: Number of independent prediction jobs
    required: false
    default: 1
    minimum: 1
    maximum: 32

enabled: true
experimental: false
