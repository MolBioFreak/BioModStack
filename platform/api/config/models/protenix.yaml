# Protenix V2 model configuration

id: protenix
name: Protenix V2
version: "2.0.0"
category: structure_prediction
description: >
  Protenix V2 structure prediction for protein monomers and multi-component
  complexes. BioModStack pins this model to the installed protenix-v2
  checkpoint; MSA-disabled operation remains Protenix V2 sequence-only mode.
container: protenix.sif

ui_icon: cube
ui_color: "#14B8A6"

inputs:
  - fasta
  - json
outputs:
  - cif
  - json

modes:
  - id: predict
    name: Structure Prediction
    description: Predict a protein structure with Protenix V2
    params:
      - sequence
      - sequence_name
      - protenix_model_weights
      - protenix_use_msa
      - protenix_msa_backend
      - protenix_use_template
      - protenix_seeds
      - protenix_n_sample
      - protenix_n_step
      - protenix_n_cycle
      - num_parallel_jobs

  - id: complex
    name: Complex Prediction
    description: Predict a protein or mixed-component complex with Protenix V2
    params:
      - sequence
      - sequence_name
      - protenix_model_weights
      - protenix_use_msa
      - protenix_msa_backend
      - protenix_use_template
      - protenix_seeds
      - protenix_n_sample
      - protenix_n_step
      - protenix_n_cycle
      - num_parallel_jobs

params:
  - name: sequence
    type: text
    description: Amino-acid sequence for standalone prediction
    required: true
    preset_type: sequence

  - name: sequence_name
    type: string
    description: Name for output structure files
    required: false
    default: predicted

  - name: protenix_model_weights
    type: string
    description: Fixed BioModStack Protenix V2 checkpoint selector
    required: false
    default: protenix-v2
    enum:
      - protenix-v2

  - name: protenix_use_msa
    type: boolean
    description: Use Protenix MSA features; disabling keeps the V2 checkpoint in sequence-only mode
    required: false
    default: true

  - name: protenix_msa_backend
    type: string
    description: MSA backend used by Protenix V2
    required: false
    default: auto
    enum:
      - auto
      - local
      - esm
      - none

  - name: protenix_use_template
    type: boolean
    description: Enable template features when available
    required: false
    default: false

  - name: protenix_seeds
    type: string
    description: Comma-separated model seeds
    required: false
    default: "42"

  - name: protenix_n_sample
    type: integer
    description: Number of diffusion samples per seed
    required: false
    default: 1
    minimum: 1
    maximum: 16

  - name: protenix_n_step
    type: integer
    description: Number of diffusion steps
    required: false
    default: 200
    minimum: 1
    maximum: 1000

  - name: protenix_n_cycle
    type: integer
    description: Number of recycling cycles
    required: false
    default: 10
    minimum: 1
    maximum: 20

  - name: num_parallel_jobs
    type: integer
    description: Number of independent prediction jobs
    required: false
    default: 1
    minimum: 1
    maximum: 32

enabled: true
experimental: false
