# De Novo Antibody Design Workflow Configuration
# Two-phase pipeline: Generation → Validation & Scoring

id: antibody_denovo
name: De Novo Nanobody Toolkit
version: 1.0.0
category: antibody_design
description: >
  De novo nanobody design toolkit with multiple upstream generators.
  Use RFantibody, BoltzGen nanobody generation, or seeded PPIFlow generation, then reopen selected outputs
  in Antibody Refinement for staged redesign, validation, and downstream review.

workflow_type: pipeline
container: apptainer/antibody_tools.sif

ui_icon: antibody
ui_color: "#ec4899"

# Modes available for this workflow
modes:
  - id: antibody_denovo_pipeline
    name: Full Pipeline
    description: Run the complete de novo antibody design pipeline
    params: []
  - id: antibody_refinement_pipeline
    name: Refinement Pipeline
    description: Start from selected antibody candidates and run modular refinement/validation stages
    params: []

inputs:
  - pdb

outputs:
  - pdb
  - json
  - csv
  - fasta

# Pipeline steps (for UI step-by-step configuration)
steps:
  - id: backbone
    name: De Novo Generation
    models:
      - rfantibody
      - boltzgen
      - ppiflow
    description: Generate nanobody candidates with RFantibody, BoltzGen, or seeded PPIFlow, depending on the chosen de novo engine
    required: true

  - id: sequence
    name: CDR Sequence Design
    models:
      - fampnn
      - caliby
      - antifold
      - proteinmpnn
    description: Design amino acid sequences for CDR loops with production and experimental sequence designers
    default: fampnn
    allow_multiple: true

  - id: validation
    name: Structure Validation
    model: boltz2
    description: Validate designed antibody-antigen complex structure with the configured validator backend
    required: true

  - id: immunogenicity
    name: Immunogenicity Scoring
    model: antiberty
    description: Score sequence naturalness to predict immunogenicity risk
    required: true

  - id: stability
    name: Stability Scoring
    model: thermompnn
    description: Predict thermodynamic stability (ddG)
    required: true

  - id: maturation
    name: Affinity Maturation
    model: iggm
    description: Suggest beneficial mutations for improved binding
    required: false

params:
  # ===== TARGET CONFIGURATION =====
  - name: target_pdb
    type: file
    description: Antigen structure (PDB format)
    file_type: pdb
    preset_type: pdb
    required: true

  - name: epitope_residues
    type: string
    description: Target epitope residues (e.g., "A45,A46,A52")
    placeholder: "A45,A46,A52"
    required: true

  - name: antigen_chain
    type: string
    description: Chain ID of the antigen in the PDB
    default: "A"
    required: false

  # ===== ANTIBODY CONFIGURATION =====
  - name: antibody_format
    type: string
    description: Type of antibody to design
    required: false
    default: "fab"
    enum:
      - fab
      - vhh
      - scfv

  - name: framework_pdb
    type: file
    description: Custom antibody framework template (optional)
    file_type: pdb
    preset_type: pdb
    required: false

  # ===== STEP 1: RFANTIBODY PARAMS =====
  - name: rfantibody_num_designs
    type: integer
    description: Number of backbone designs to generate
    default: 10
    minimum: 1
    maximum: 100
    step: 1

  - name: rfantibody_diffusion_steps
    type: integer
    description: Diffusion denoising steps (higher = better quality, slower)
    default: 50
    minimum: 20
    maximum: 200
    step: 10

  - name: rfantibody_noise_scale_ca
    type: number
    description: C-alpha noise scale (lower = more consistent designs)
    default: 1.0
    minimum: 0.5
    maximum: 2.0
    step: 0.1

  - name: rfantibody_noise_scale_frame
    type: number
    description: Frame noise scale (affects rotational diversity)
    default: 1.0
    minimum: 0.5
    maximum: 2.0
    step: 0.1

  - name: rfantibody_guide_scale
    type: number
    description: Hotspot guidance strength (higher = stronger epitope focus)
    default: 10
    minimum: 1
    maximum: 50
    step: 1

  - name: cdr_lengths
    type: string
    description: CDR length ranges (e.g., "H1:8-13,H2:7,H3:5-13")
    placeholder: "H1:8-13,H2:7,H3:5-13,L1:7-10,L2:7,L3:9-11"
    required: false

  # ===== STEP 2: SEQUENCE DESIGN PARAMS =====
  - name: seq_design_fampnn
    type: boolean
    description: Run FAMPNN for sequence design
    default: true

  - name: seq_design_caliby
    type: boolean
    description: Run Caliby experimental sequence design
    default: false

  - name: seq_design_antifold
    type: boolean
    description: Run AntiFold for sequence design
    default: true

  - name: seq_design_proteinmpnn
    type: boolean
    description: Run ProteinMPNN for sequence design
    default: false

  - name: seqs_per_design
    type: integer
    description: Sequences to generate per backbone design
    default: 8
    minimum: 1
    maximum: 100

  - name: fampnn_constraint_mode
    type: string
    description: FAMPNN constraint mode ('generic' or 'antibody')
    default: antibody
    enum:
      - generic
      - antibody

  - name: fampnn_temperature
    type: number
    description: FAMPNN sampling temperature
    default: 0.1
    minimum: 0.01
    maximum: 2.0
    step: 0.1

  - name: caliby_model_name
    type: string
    description: Caliby experimental checkpoint name
    default: soluble_caliby_v1
    enum:
      - caliby
      - soluble_caliby
      - soluble_caliby_v1

  - name: caliby_temperature
    type: number
    description: Caliby sampling temperature
    default: 0.1
    minimum: 0.001
    maximum: 1.0
    step: 0.01

  - name: caliby_batch_size
    type: integer
    description: Caliby inference batch size
    default: 4
    minimum: 1
    maximum: 64

  - name: caliby_num_workers
    type: integer
    description: Caliby dataloader worker count
    default: 8
    minimum: 1
    maximum: 64

  - name: caliby_clean_num_workers
    type: integer
    description: Workers used to clean structures before Caliby design
    default: 2
    minimum: 1
    maximum: 32

  - name: caliby_omit_aas
    type: string
    description: Comma-separated amino acids excluded from Caliby design
    default: C

  - name: caliby_sampling_overrides_json
    type: text
    description: Optional JSON merged into Caliby sampling_overrides
    required: false

  - name: caliby_run_self_consistency_eval
    type: boolean
    description: Run AF2 self-consistency on Caliby designs before downstream validation
    default: false

  - name: caliby_self_consistency_num_models
    type: integer
    description: Number of AF2 models used for Caliby self-consistency
    default: 5
    minimum: 1
    maximum: 5

  - name: caliby_self_consistency_num_recycles
    type: integer
    description: AF2 recycle count during Caliby self-consistency
    default: 3
    minimum: 1
    maximum: 12

  - name: caliby_self_consistency_use_multimer
    type: boolean
    description: Use AF2-Multimer for Caliby self-consistency
    default: false

  - name: caliby_fixed_pos_override_seq
    type: string
    description: Optional Caliby fixed_pos_override_seq spec (e.g. "H52:A,H53:G")
    required: false

  - name: caliby_pos_restrict_aatype
    type: string
    description: Optional Caliby pos_restrict_aatype spec (e.g. "H52:AVG,H53:VG")
    required: false

  - name: caliby_symmetry_pos
    type: string
    description: Optional Caliby symmetry_pos spec for tied sampling groups
    required: false

  - name: enable_caliby_filter
    type: boolean
    description: Enable Caliby candidate filtering before validation
    default: false

  - name: caliby_max_potts_energy
    type: number
    description: Maximum Caliby Potts energy to keep (lower is stricter)
    required: false

  - name: caliby_min_sc_plddt
    type: number
    description: Minimum Caliby self-consistency pLDDT to keep
    required: false
    minimum: 0
    maximum: 100

  - name: caliby_max_sc_rmsd
    type: number
    description: Maximum Caliby self-consistency RMSD to keep
    required: false

  - name: antifold_temperature
    type: number
    description: AntiFold sampling temperature
    default: 0.2
    minimum: 0.1
    maximum: 1.0
    step: 0.1

  # ===== STEP 3: VALIDATION PARAMS =====
  - name: run_structure_validation
    type: boolean
    description: Validate structures before downstream scoring
    default: true

  - name: structure_validator
    type: string
    description: Validation backend for designed complexes
    default: boltz2
    enum:
      - boltz2
      - protenix

  - name: boltz_iptm_threshold
    type: number
    description: Minimum ipTM score for filtering
    default: 0.6
    minimum: 0.0
    maximum: 1.0
    step: 0.1

  - name: boltz_plddt_threshold
    type: number
    description: Minimum pLDDT score for filtering
    default: 70
    minimum: 0
    maximum: 100
    step: 5

  - name: boltz_predict_affinity
    type: boolean
    description: Predict binding affinity (log10 IC50 & probability) - adds ~2-5 min/design
    default: false

  - name: boltz_diffusion_samples_affinity
    type: integer
    description: Affinity diffusion samples (more = better estimate, slower)
    default: 5
    minimum: 1
    maximum: 20
    step: 1
    depends_on: boltz_predict_affinity

  # ===== STEP 4: IMMUNOGENICITY PARAMS =====
  - name: run_immunogenicity_scoring
    type: boolean
    description: Score immunogenicity with AntiBERTy
    default: true

  - name: antiberty_pll_threshold
    type: number
    description: Minimum pseudo-log-likelihood (lower = more unusual)
    default: -10
    minimum: -50
    maximum: 0
    step: 1

  - name: filter_immunogenic
    type: boolean
    description: Filter out high-risk sequences automatically
    default: true

  - name: antiberty_extract_embeddings
    type: boolean
    description: Extract per-residue embeddings for analysis
    default: false

  # ===== STEP 5: STABILITY PARAMS =====
  - name: run_stability_scoring
    type: boolean
    description: Score stability with ThermoMPNN
    default: true

  - name: thermompnn_ddg_threshold
    type: number
    description: Maximum ddG for stability filtering (kcal/mol)
    default: 2.0
    minimum: -10.0
    maximum: 10.0
    step: 0.5

  # ===== STEP 6: AFFINITY MATURATION PARAMS =====
  - name: run_affinity_maturation
    type: boolean
    description: Run IgGM affinity maturation (optional)
    default: false

  - name: iggm_num_variants
    type: integer
    description: Number of maturation variants to generate
    default: 10
    minimum: 1
    maximum: 50

  - name: iggm_maturation_cycles
    type: integer
    description: Number of maturation optimization cycles
    default: 1
    minimum: 1
    maximum: 5

enabled: true
experimental: true
