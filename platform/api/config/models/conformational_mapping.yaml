id: conformational_mapping
name: Conformational Mapping
version: "1.0.0"
category: structure_prediction
description: >
  Authenticated conformational mapping for complete-complex Protenix ensembles,
  canonical-only instrumented ConforNets hypotheses, and immutable registered
  structure imports. Submission uses the dedicated typed API.
container: conformational_mapping.sif
workflow: conformational_mapping
experimental: true
enabled: true
ui_icon: route
ui_color: "#F97316"

inputs: [json]
outputs: [json, cif]

modes:
  - id: map
    name: Map conformational hypotheses
    description: Dedicated typed submission with backend-specific validation and durable lifecycle control.
    params:
      - backend
      - targets
      - ordered_seeds
      - samples_per_seed
      - feature_policy
      - runtime_policy
      - analysis_policy
      - confornets
      - registered_snapshot_id
      - registered_artifact_ids
      - registered_sequence_id
      - registered_reference_ids
      - registered_checkpoint_id
      - registered_config_id
      - registered_transfer_id

params:
  - {name: backend, type: string, description: Explicit canonical backend; no automatic substitution., required: true, enum: [protenix_v2_ensemble, confornets, external_import]}
  - {name: targets, type: object, description: Ordered cm_request_v1 target identities., required: true, hidden: true}
  - {name: ordered_seeds, type: object, description: Ordered unique signed 32-bit seed authority., required: true, hidden: true}
  - {name: generated_json_ordered_seeds, type: object, description: Internal generated-request seed echo used only for conflict validation., hidden: true}
  - {name: cli_ordered_seeds, type: object, description: Internal CLI seed echo used only for conflict validation., hidden: true}
  - {name: samples_per_seed, type: integer, description: Positive samples per seed., required: true, minimum: 1}
  - {name: feature_policy, type: object, description: Versioned feature policy from cm_request_v1., required: true, hidden: true}
  - {name: runtime_policy, type: object, description: Mutually exclusive default or explicit runtime policy., required: true, hidden: true}
  - {name: analysis_policy, type: object, description: Versioned support and ranking policy., required: true, hidden: true}
  - {name: confornets, type: object, description: Strict single-chain ConforNets coordinate-plan controls., hidden: true}
  - {name: registered_snapshot_id, type: string, description: Principal-owned complete-complex snapshot registry ID.}
  - {name: registered_artifact_ids, type: object, description: Ordered principal-owned import structure registry IDs.}
  - {name: registered_sequence_id, type: string, description: Principal-owned ConforNets protein-sequence registry ID.}
  - {name: registered_reference_ids, type: object, description: Ordered zero-to-two ConforNets reference registry IDs.}
  - {name: registered_checkpoint_id, type: string, description: Principal-owned ConforNets checkpoint registry ID.}
  - {name: registered_config_id, type: string, description: Optional principal-owned ConforNets config registry ID.}
  - {name: registered_transfer_id, type: string, description: Optional principal-owned ConforNets transfer-state registry ID.}
  - {name: protenix_snapshot_id, type: string, description: Server-owned complete-complex snapshot identity., hidden: true}
  - {name: import_receipt_id, type: string, description: Immutable server-owned import receipt identity., hidden: true}
