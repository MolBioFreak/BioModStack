id: binder_refinement
name: Selected binder refinement
version: 1.0.0
category: sequence_design
description: Independent repack, anchors, protein/antibody/nanobody native partial
  flow and explicitly chosen legacy FA-MPNN redesign. Protein emits masked backbones;
  no implicit sequence designer.
container: pyrosetta_tools.sif
inputs:
- pdb
outputs:
- pdb
- json
modes:
- id: refine
  name: Selected binder refinement
  description: Independent repack, anchors, protein/antibody/nanobody native partial
    flow and explicitly chosen legacy FA-MPNN redesign. Protein emits masked backbones;
    no implicit sequence designer.
  params:
  - pdb_paths
  - source_identity_json
  - binder_chains
  - target_chains
  - maturation_repack_enabled
  - maturation_anchors_enabled
  - maturation_flow_enabled
  - maturation_redesign_enabled
  - framework_type
  - ppiflow_region_mode
  - ppiflow_selected_loops
  - maturation_anchor_threshold
  - maturation_anchor_distance_cutoff
  - ppiflow_rotamer_shell_distance
  - ppiflow_relax_antibody_backbone_shell
  - ppiflow_start_t
  - ppiflow_samples_per_target
  - ppiflow_retry_limit
  - ppiflow_checkpoint
  - ppiflow_heavy_chain
  - ppiflow_light_chain
  - ppiflow_antigen_chain
  - epitope_residues
  - fampnn_temperature
  - fampnn_num_steps
  - fampnn_checkpoint
  - fampnn_exclude_cys
  - fampnn_psce_threshold
  - fampnn_seq_only
  - fampnn_repack_last
  - analysis_chain_id
  - cdr_positions_by_loop
  - manual_cdr_definitions
  - fixed_positions
  - fampnn_fix_target_sidechains
  - fampnn_batch_size
  - seqs_per_design
  - ppiflow_task
  - ppiflow_input_model
  - ppiflow_fixed_positions
  - ppiflow_protein_interface_dist
  - ppiflow_protein_sample_hotspot_rate_min
  - ppiflow_protein_sample_hotspot_rate_max
  - ppiflow_protein_t_method
  - ppiflow_protein_alpha_t
  - ppiflow_protein_rotation_corrupt
  - ppiflow_protein_rotation_sample_schedule
  - ppiflow_protein_rotation_exp_rate
  - ppiflow_protein_translation_corrupt
  - ppiflow_protein_translation_var_scale
  - ppiflow_protein_self_condition
  - ppiflow_protein_starting_at_hotspot_center
  - ppiflow_protein_dataset_seed
  - ppiflow_protein_samples_batch_size
  - ppiflow_protein_samples_min_hotspots
  - ppiflow_protein_cache_num_res
  - ppiflow_protein_sample_original_binder_len
  - ppiflow_protein_num_timesteps
  - ppiflow_protein_scaffold_contig
  - ppiflow_protein_twisting_use
  - ppiflow_protein_twisting_motif_loc
  - ppiflow_protein_twisting_num_rots
  - ppiflow_protein_twisting_align
  - ppiflow_protein_twisting_scale_rots
  - ppiflow_protein_twisting_max_offsets
  - ppiflow_protein_twisting_t_min
  - ppiflow_protein_twisting_potential_rot
  - ppiflow_protein_twisting_potential_trans
  - ppiflow_protein_twisting_scale_w_t
  - ppiflow_protein_twisting_obs_noise
  - ppiflow_protein_twisting_scale
  - ppiflow_protein_twisting_update_trans
  - ppiflow_protein_twisting_update_rot
  - ppiflow_protein_trainer_deterministic
  - ppiflow_protein_profile_node_embed_size
  - ppiflow_protein_profile_edge_embed_size
  - ppiflow_protein_profile_node_features_c_s
  - ppiflow_protein_profile_node_features_c_pos_emb
  - ppiflow_protein_profile_node_features_c_timestep_emb
  - ppiflow_protein_profile_node_features_c_aatype_emb
  - ppiflow_protein_profile_node_features_embed_chain
  - ppiflow_protein_profile_node_features_embed_aatype
  - ppiflow_protein_profile_node_features_n_aatype
  - ppiflow_protein_profile_edge_features_c_s
  - ppiflow_protein_profile_edge_features_c_p
  - ppiflow_protein_profile_edge_features_feat_dim
  - ppiflow_protein_profile_edge_features_num_bins
  - ppiflow_protein_profile_edge_features_embed_chain
  - ppiflow_protein_profile_edge_features_embed_diffuse_mask
  - ppiflow_protein_profile_edge_features_embed_hotspot_mask
  - ppiflow_protein_profile_ipa_c_s
  - ppiflow_protein_profile_ipa_c_z
  - ppiflow_protein_profile_ipa_c_hidden
  - ppiflow_protein_profile_ipa_no_heads
  - ppiflow_protein_profile_ipa_no_qk_points
  - ppiflow_protein_profile_ipa_no_v_points
  - ppiflow_protein_profile_ipa_seq_tfmr_num_heads
  - ppiflow_protein_profile_ipa_seq_tfmr_num_layers
  - ppiflow_protein_profile_ipa_num_blocks
  - ppiflow_protein_profile_seq_decoder_use
  - ppiflow_protein_profile_pairformer_use
  - ppiflow_protein_profile_pairformer_num_blocks
  - ppiflow_protein_profile_pairformer_no_heads
  - ppiflow_protein_profile_pairformer_c_hidden_pair_att
  - ppiflow_protein_profile_pairformer_no_heads_pair
params:
- name: pdb_paths
  type: string
  description: Immutable selected PDB snapshots supplied by selection owner.
  required: true
- name: source_identity_json
  type: file
  description: Selected source identity document supplied by selection owner.
  required: false
- name: binder_chains
  type: string
  description: Exact comma-separated binder PDB chain IDs.
  required: true
- name: target_chains
  type: string
  description: Exact comma-separated target PDB chain IDs.
  required: true
- name: maturation_repack_enabled
  type: boolean
  description: Run existing Rosetta interface-shell repacking.
  default: false
- name: maturation_anchors_enabled
  type: boolean
  description: Run existing interface anchor analysis.
  default: false
- name: maturation_flow_enabled
  type: boolean
  description: Run the selected native PPIFlow partial task.
  default: false
- name: maturation_redesign_enabled
  type: boolean
  description: Explicitly run existing FA-MPNN sequence redesign.
  default: false
- name: framework_type
  type: string
  description: Native antibody format for PPIFlow checkpoint selection.
  default: standard-fv
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: ppiflow_region_mode
  type: string
  description: Native movable-region mode.
  default: all_antibody
  enum:
  - selected_cdrs
  - all_cdrs
  - framework_only
  - all_antibody
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: ppiflow_selected_loops
  type: string
  description: Selected native CDR loops, where applicable.
  default: ''
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: maturation_anchor_threshold
  type: number
  description: Existing anchor energy threshold (REU).
  default: -5.0
- name: maturation_anchor_distance_cutoff
  type: number
  description: Existing interface distance cutoff (angstrom).
  default: 12.0
- name: ppiflow_rotamer_shell_distance
  type: number
  description: Existing repack shell distance (angstrom).
  default: 20.0
- name: ppiflow_relax_antibody_backbone_shell
  type: boolean
  description: Explicitly allow native backbone movement during shell relaxation.
  default: false
- name: ppiflow_start_t
  type: number
  description: Protein default .15 (native randomized time transform with max_t=start_t+.02);
    antibody default .8. Higher t retains more seed geometry.
  protein_native_cli: start_t
  protein_default: 0.15
  defaults_by_task:
    protein_binder_partial: 0.15
    antibody_partial: 0.8
    nanobody_partial: 0.8
  ui_control: number
  group: PPIFlow partial-flow science
- name: ppiflow_samples_per_target
  type: integer
  description: 'Native samples per selected complex: protein default 100; historical
    antibody default 1. Expanded once by native dataset.'
  protein_native_cli: samples_per_target
  protein_default: 100
  defaults_by_task:
    protein_binder_partial: 100
    antibody_partial: 1
    nanobody_partial: 1
  ui_control: number
  group: PPIFlow partial-flow science
- name: ppiflow_retry_limit
  type: integer
  description: Native sampling retry limit.
  default: 10
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: ppiflow_checkpoint
  type: string
  description: Native checkpoint selection.
  defaults_by_task:
    protein_binder_partial: binder
    antibody_partial: antibody
    nanobody_partial: nanobody
- name: ppiflow_heavy_chain
  type: string
  description: Explicit native heavy chain; omitted uses first selected binder chain.
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: ppiflow_light_chain
  type: string
  description: Explicit native light chain; omitted uses second selected binder chain
    if present.
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: ppiflow_antigen_chain
  type: string
  description: Explicit native antigen chain; must agree with selected target role.
- name: epitope_residues
  type: string
  description: Explicit native hotspot residues.
  protein_native_cli: specified_hotspots
  protein_default: null
  ui_control: residue
  group: PPIFlow partial-flow science
- name: fampnn_temperature
  type: number
  description: Native FA-MPNN sampling temperature.
  default: 0.1
- name: fampnn_num_steps
  type: integer
  description: Native FA-MPNN denoising steps.
  default: 100
- name: fampnn_checkpoint
  type: string
  description: Native FA-MPNN checkpoint.
  default: fampnn_0_0.pt
- name: fampnn_exclude_cys
  type: boolean
  description: Native cysteine exclusion.
  default: true
- name: fampnn_psce_threshold
  type: number
  description: Native PSCE threshold.
  default: 0.3
- name: fampnn_seq_only
  type: boolean
  description: Native sequence-only sampling.
  default: false
- name: fampnn_repack_last
  type: boolean
  description: Native FA-MPNN final sidechain packing, distinct from optional Rosetta
    pre-repack.
  default: true
- name: analysis_chain_id
  type: string
  description: Chains for existing FA-MPNN output analysis.
  default: all_chains
- name: cdr_positions_by_loop
  type: object
  description: Explicit loop-to-position mapping for native mask preparation.
  default: {}
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: manual_cdr_definitions
  type: array
  description: Explicit native manual CDR definitions.
  default: []
  applicability:
    field: ppiflow_task
    operator: not_equals
    value: protein_binder_partial
- name: fixed_positions
  type: string
  description: Existing generic author-residue sequence mask, e.g. A:1-10,A:50.
- name: fampnn_fix_target_sidechains
  type: boolean
  description: Existing native generic binder-design target sidechain constraint.
  default: false
- name: fampnn_batch_size
  type: integer
  description: Existing native FA-MPNN batch size.
  minimum: 1
  default: 16
- name: seqs_per_design
  type: integer
  description: Number of native FA-MPNN sequences per selected structure.
  minimum: 1
  default: 1
- name: ppiflow_task
  type: string
  description: Explicit native partial task. Omitted retains historical antibody/framework
    selection.
  enum:
  - protein_binder_partial
  - antibody_partial
  - nanobody_partial
  ui_control: select
- name: ppiflow_input_model
  type: integer
  description: Actual prepared PDB MODEL serial; omitted resolves the sole prepared model (implicit 1 without MODEL records). Original CIF/model identity remains source custody, not this transport selector.
  ui_control: number
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_fixed_positions
  type: string
  description: Protein fixed author residue mask; e.g. B12,B:20A,B30-35.
  protein_native_cli: fixed_positions
  ui_control: residue
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_interface_dist
  type: number
  default: 6.0
  description: Automatic interface cutoff in angstrom.
  ui_control: number
  protein_native_cli: interface_dist
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_sample_hotspot_rate_min
  type: number
  default: 0.2
  description: Minimum hotspot sampling fraction; explicit hotspots require native
    default rates.
  ui_control: number
  protein_native_cli: sample_hotspot_rate_min
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_sample_hotspot_rate_max
  type: number
  default: 0.5
  description: Maximum hotspot sampling fraction.
  ui_control: number
  protein_native_cli: sample_hotspot_rate_max
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_t_method
  type: string
  default: uniform
  description: Native randomized time distribution, not fixed time.
  ui_control: select
  protein_native_path: interpolant.t_method
  enum:
  - uniform
  - beta
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_alpha_t
  type: number
  default: 3.0
  description: Native beta time-distribution shape.
  ui_control: number
  protein_native_path: interpolant.alpha_t
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_rotation_corrupt
  type: boolean
  default: true
  description: Corrupt seed rotations.
  ui_control: checkbox
  protein_native_path: interpolant.rots.corrupt
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_rotation_sample_schedule
  type: string
  default: exp
  description: Native rotation schedule.
  ui_control: select
  protein_native_path: interpolant.rots.sample_schedule
  enum:
  - linear
  - exp
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_rotation_exp_rate
  type: number
  default: 10.0
  description: Rotation exponential schedule rate.
  ui_control: number
  protein_native_path: interpolant.rots.exp_rate
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_translation_corrupt
  type: boolean
  default: true
  description: Corrupt seed translations.
  ui_control: checkbox
  protein_native_path: interpolant.trans.corrupt
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_translation_var_scale
  type: number
  default: 10.0
  description: Native translation noise scale.
  ui_control: number
  protein_native_path: interpolant.trans.var_scale
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_self_condition
  type: boolean
  default: true
  description: Native self-conditioning.
  ui_control: checkbox
  protein_native_path: interpolant.self_condition
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_starting_at_hotspot_center
  type: boolean
  default: false
  description: Initialize noise offset at hotspot center.
  ui_control: checkbox
  protein_native_path: interpolant.starting_at_hotspot_center
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_dataset_seed
  type: integer
  default: 123
  description: Dataset RNG seed only; not full-run determinism.
  ui_control: number
  protein_native_path: ppi_dataset.seed
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_samples_batch_size
  type: integer
  default: 1
  description: Native sample batching.
  ui_control: number
  protein_native_path: ppi_dataset.samples_batch_size
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_samples_min_hotspots
  type: integer
  default: 3
  description: Native minimum hotspot count.
  ui_control: number
  protein_native_path: ppi_dataset.samples_min_hotspots
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_cache_num_res
  type: integer
  default: 0
  description: Native feature cache residue threshold.
  ui_control: number
  protein_native_path: ppi_dataset.cache_num_res
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  group: PPIFlow partial-flow science
- name: ppiflow_protein_num_timesteps
  type: integer
  default: 100
  description: Native partial integration step count.
  protein_native_path: interpolant.sampling.num_timesteps
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_scaffold_contig
  type: string
  default: null
  description: Binder author range and signed length delta, e.g. B10-20,1. Pinned
    implementation inserts one residue for nonnegative delta; negative branch uses
    native index deletion, not arbitrary length generation.
  protein_native_path: ppi_dataset.scaffold_contig
  ui_control: residue
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_use
  type: boolean
  default: false
  description: Native reconstruction guidance. Off in shipped profile. Other twisting
    values have no shipped defaults; supply explicitly when enabled. Native assumes
    batch size one.
  protein_native_path: interpolant.twisting.use
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_motif_loc
  type: boolean
  default: null
  description: Condition on known motif locations. No value in shipped partial config.
  protein_native_path: interpolant.twisting.motif_loc
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_num_rots
  type: integer
  default: null
  description: Number of marginalized rotations. No value in shipped partial config.
  protein_native_path: interpolant.twisting.num_rots
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_align
  type: boolean
  default: null
  description: Align motif rotations. No value in shipped partial config.
  protein_native_path: interpolant.twisting.align
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_scale_rots
  type: number
  default: null
  description: Rotation sampling scale. No value in shipped partial config.
  protein_native_path: interpolant.twisting.scale_rots
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_max_offsets
  type: integer
  default: null
  description: Maximum marginalized motif offsets. No value in shipped partial config.
  protein_native_path: interpolant.twisting.max_offsets
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_t_min
  type: number
  default: null
  description: Start guidance at this native time. No value in shipped partial config.
  protein_native_path: interpolant.twisting.t_min
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_potential_rot
  type: boolean
  default: null
  description: Apply rotational likelihood potential. No value in shipped partial
    config.
  protein_native_path: interpolant.twisting.potential_rot
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_potential_trans
  type: boolean
  default: null
  description: Apply translation likelihood potential. No value in shipped partial
    config.
  protein_native_path: interpolant.twisting.potential_trans
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_scale_w_t
  type: string
  default: null
  description: Guidance time scaling. No value in shipped partial config.
  protein_native_path: interpolant.twisting.scale_w_t
  ui_control: select
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  enum:
  - ot
  - linear
  - constant
- name: ppiflow_protein_twisting_obs_noise
  type: number
  default: null
  description: Observation noise scale. No value in shipped partial config.
  protein_native_path: interpolant.twisting.obs_noise
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_scale
  type: number
  default: null
  description: Guidance scale. No value in shipped partial config.
  protein_native_path: interpolant.twisting.scale
  ui_control: number
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_update_trans
  type: boolean
  default: null
  description: Update translations under guidance. No value in shipped partial config.
  protein_native_path: interpolant.twisting.update_trans
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_twisting_update_rot
  type: boolean
  default: null
  description: Update rotations under guidance. No value in shipped partial config.
  protein_native_path: interpolant.twisting.update_rot
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_trainer_deterministic
  type: boolean
  default: false
  description: Native trainer deterministic algorithms option; does not seed all RNGs
    or promise deterministic full-run sampling.
  protein_native_path: experiment.trainer.deterministic
  ui_control: checkbox
  group: Protein advanced sampling
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
- name: ppiflow_protein_profile_node_embed_size
  type: integer
  default: 256
  description: Pinned node_embed_size value; visible checkpoint profile.
  protein_native_path: model.node_embed_size
  ui_control: number
  group: Protein checkpoint profile
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  read_only: true
  authority: profile
  fixed_reason: Pinned binder checkpoint architecture; not a different trained model.
  minimum: 256
  maximum: 256
- name: ppiflow_protein_profile_edge_embed_size
  type: integer
  default: 128
  description: Pinned edge_embed_size value; visible checkpoint profile.
  protein_native_path: model.edge_embed_size
  ui_control: number
  group: Protein checkpoint profile
  applicability:
    field: ppiflow_task
    operator: equals
    value: protein_binder_partial
  read_only: true
