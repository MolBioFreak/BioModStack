# Boltz-2 Model Configuration
# Structure prediction via diffusion

id: boltz2
name: Boltz-2
version: "2.0.0"
category: structure_prediction
description: >
  Diffusion-based structure prediction from sequences. Predicts protein
  structure, confidence scores, and can handle protein-ligand complexes.
  Primary structure validator for BioModStack designs.
container: boltz2.sif

ui_icon: cube
ui_color: "#3B82F6"

inputs:
  - fasta
  - yaml
outputs:
  - pdb
  - json

modes:
  - id: predict
    name: Structure Prediction
    description: Predict structure from sequence
    params:
      - boltz_recycling_steps
      - boltz_diffusion_samples
      - boltz_use_msa
      - boltz_method

  - id: complex
    name: Complex Prediction
    description: Predict protein-ligand or protein-protein complex
    params:
      - boltz_recycling_steps
      - boltz_diffusion_samples
      - boltz_use_potentials
      - boltz_use_msa
      - boltz_method

params:
  - name: boltz_recycling_steps
    type: integer
    description: Number of recycling iterations
    required: false
    default: 3
    minimum: 1
    maximum: 10

  - name: boltz_diffusion_samples
    type: integer
    description: Number of diffusion samples for structure generation
    required: false
    default: 1
    minimum: 1
    maximum: 10

  - name: boltz_sampling_steps
    type: integer
    description: Number of sampling steps
    required: false
    default: 200
    hidden: true
    minimum: 50
    maximum: 500

  - name: boltz_use_potentials
    type: boolean
    description: Use physics-based potentials (Boltz-2x mode) for better accuracy
    required: false
    default: false

    hidden: true
    minimum: 50
    maximum: 500

  - name: boltz_use_potentials
    type: boolean
    description: Use physics-based potentials (Boltz-2x mode) for better accuracy
    required: false
    default: false

  - name: boltz_use_msa
    type: boolean
    description: Enable Remote MSA Generation (slower, better quality)
    required: false
    default: true

  - name: boltz_method
    type: string
    description: Experimental Method Conditioning
    required: false
    default: ""
    enum:
      - ""
      - md
      - x-ray diffraction
      - electron microscopy
      - solution nmr
      - solid-state nmr
      - neutron diffraction
      - electron crystallography
      - fiber diffraction
      - powder diffraction
      - infrared spectroscopy
      - fluorescence transfer
      - epr
      - theoretical model
      - solution scattering
      - other
      - afdb
      - boltz-1

  - name: boltz_extra_config
    type: string
    description: Additional Boltz-2 parameters
    required: false
    hidden: true

enabled: true
experimental: false
