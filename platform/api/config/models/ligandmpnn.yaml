# LigandMPNN Model Configuration
# Ligand/nucleotide-aware sequence design

id: ligandmpnn
name: LigandMPNN
version: "1.0.0"
category: sequence_design
description: >
  Sequence design conditioned on a supplied protein-context structure using
  Foundry LigandMPNN. Small molecules, nucleotides, metals and nucleic acids
  require actual positioned coordinates; descriptive labels do not create geometry.
container: foundry.sif

ui_icon: flask
ui_color: "#F59E0B"

inputs:
  - pdb
  - cif
outputs:
  - cif
  - fasta
  - json

modes:
  - id: ligand_aware
    name: Ligand-Aware Design
    description: Design sequences aware of bound ligand coordinates
    params:
      - target_pdb
      - ligand_pdb
      - ligand_smiles
      - ntp_type
      - metal_type
      - dna_sequence
      - temperature
      - design_seed
      - batch_size
      - number_of_batches
      - remove_ccds
      - remove_waters
      - occupancy_threshold_sidechain
      - occupancy_threshold_backbone
      - structure_noise
      - decode_type
      - causality_pattern
      - initialize_sequence_embedding_with_ground_truth
      - atomize_side_chains
      - fixed_residues
      - designed_residues
      - fixed_chains
      - designed_chains
      - bias
      - bias_per_residue
      - omit
      - omit_per_residue
      - pair_bias
      - pair_bias_per_residue_pair
      - temperature_per_residue
      - symmetry_residues
      - symmetry_residues_weights
      - homo_oligomer_chains
      - write_fasta
      - write_structures

  - id: ntp_aware
    name: NTP-Aware Design
    description: Design sequences for nucleotide triphosphate binding (e.g., DNA Polymerase engineering)
    params:
      - target_pdb
      - ligand_pdb
      - ligand_smiles
      - ntp_type
      - metal_type
      - dna_sequence
      - temperature
      - design_seed
      - batch_size
      - number_of_batches
      - remove_ccds
      - remove_waters
      - occupancy_threshold_sidechain
      - occupancy_threshold_backbone
      - structure_noise
      - decode_type
      - causality_pattern
      - initialize_sequence_embedding_with_ground_truth
      - atomize_side_chains
      - fixed_residues
      - designed_residues
      - fixed_chains
      - designed_chains
      - bias
      - bias_per_residue
      - omit
      - omit_per_residue
      - pair_bias
      - pair_bias_per_residue_pair
      - temperature_per_residue
      - symmetry_residues
      - symmetry_residues_weights
      - homo_oligomer_chains
      - write_fasta
      - write_structures

  - id: metal_aware
    name: Metal-Aware Design
    description: Design sequences for metal ion coordination
    params:
      - target_pdb
      - ligand_pdb
      - ligand_smiles
      - ntp_type
      - metal_type
      - dna_sequence
      - temperature
      - design_seed
      - batch_size
      - number_of_batches
      - remove_ccds
      - remove_waters
      - occupancy_threshold_sidechain
      - occupancy_threshold_backbone
      - structure_noise
      - decode_type
      - causality_pattern
      - initialize_sequence_embedding_with_ground_truth
      - atomize_side_chains
      - fixed_residues
      - designed_residues
      - fixed_chains
      - designed_chains
      - bias
      - bias_per_residue
      - omit
      - omit_per_residue
      - pair_bias
      - pair_bias_per_residue_pair
      - temperature_per_residue
      - symmetry_residues
      - symmetry_residues_weights
      - homo_oligomer_chains
      - write_fasta
      - write_structures

  - id: dna_aware
    name: DNA-Aware Design
    description: Design sequences for DNA binding
    params:
      - target_pdb
      - ligand_pdb
      - ligand_smiles
      - ntp_type
      - metal_type
      - dna_sequence
      - temperature
      - design_seed
      - batch_size
      - number_of_batches
      - remove_ccds
      - remove_waters
      - occupancy_threshold_sidechain
      - occupancy_threshold_backbone
      - structure_noise
      - decode_type
      - causality_pattern
      - initialize_sequence_embedding_with_ground_truth
      - atomize_side_chains
      - fixed_residues
      - designed_residues
      - fixed_chains
      - designed_chains
      - bias
      - bias_per_residue
      - omit
      - omit_per_residue
      - pair_bias
      - pair_bias_per_residue_pair
      - temperature_per_residue
      - symmetry_residues
      - symmetry_residues_weights
      - homo_oligomer_chains
      - write_fasta
      - write_structures

  - id: interface_context
    name: Selected Interface Context
    description: Post-round masked-patch comparison on the selected Design subset; native samples are unclassified.
    selected_only: true
    params:
      - ligandmpnn_interface_selection
      - interface_context_manifest
      - binder_chain
      - target_chain
      - target_patch
      - seed
      - samples
      - temperature

params:
  - name: ligandmpnn_interface_selection
    type: object
    description: Server-owned immutable selected Design source/request binding.
    required: true
    hidden: true

  - name: interface_context_manifest
    type: file
    description: Server-owned private manifest for the selected native inputs.
    required: true
    hidden: true

  - name: binder_chain
    type: string
    description: Explicit binder chain in each selected Design structure.
    required: true
    pattern: '^[A-Za-z0-9]$'

  - name: target_chain
    type: string
    description: Explicit target chain in each selected Design structure.
    required: true
    pattern: '^[A-Za-z0-9]$'

  - name: target_patch
    type: string_list
    description: Explicit target-chain residue IDs for masked-patch sampling.
    required: true

  - name: seed
    type: integer
    description: Native random seed for selected interface-context samples.
    required: true
    minimum: 0
    maximum: 2147483647

  - name: samples
    type: integer
    description: Number of native samples per selected condition.
    required: true
    minimum: 1
    maximum: 16

  - name: temperature
    type: number
    description: Sampling temperature
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0

  - name: ligand_pdb
    type: file
    description: Legacy source alias for a complete protein-context PDB/mmCIF; a separate ligand-only file is not automatically assembled.
    required: false
    file_type: pdb
    preset_type: pdb

  - name: ligand_smiles
    type: string
    description: Optional descriptive SMILES only; inference uses supplied complex coordinates, not generated ligand geometry.
    required: false
    preset_type: ligand

  - name: target_pdb
    type: file
    description: Complete protein-context PDB/mmCIF with positioned ligand, nucleotide, metal or nucleic-acid coordinates.
    required: true
    file_type: pdb
    preset_type: pdb

  - name: ntp_type
    type: string
    description: Descriptive nucleotide identity; actual conditioning comes only from coordinates in the supplied complex.
    required: false
    enum:
      - dATP
      - dTTP
      - dGTP
      - dCTP
      - ATP
      - UTP
      - GTP
      - CTP

  - name: metal_type
    type: string
    description: Descriptive metal identity; actual conditioning comes only from coordinates in the supplied complex.
    required: false
    enum:
      - Mg2+
      - Mn2+
      - Zn2+
      - Ca2+
      - Fe2+
      - Fe3+
      - Cu2+

  - name: dna_sequence
    type: string
    description: Descriptive DNA sequence; inference requires positioned nucleic-acid coordinates in the complex.
    required: false

  - name: design_seed
    type: integer
    description: "Native random seed; null preserves native unseeded sampling (separate from diagnostic seed)."
    required: false
    default: null

  - name: batch_size
    type: integer
    description: "Native rc-foundry 0.1.9 batch_size control; typed nested shape is defined by NativeOptions."
    required: false
    default: 1
    minimum: 1

  - name: number_of_batches
    type: integer
    description: "Native rc-foundry 0.1.9 number_of_batches control; typed nested shape is defined by NativeOptions."
    required: false
    default: 1
    minimum: 1

  - name: remove_ccds
    type: string_list
    description: "CCD residue names removed during parsing; empty list retains native complex components."
    required: false
    default: []

  - name: remove_waters
    type: boolean
    description: "Override native water removal; null uses native parser default."
    required: false
    default: null

  - name: occupancy_threshold_sidechain
    type: number
    description: "Native rc-foundry 0.1.9 occupancy_threshold_sidechain control; typed nested shape is defined by NativeOptions."
    required: false
    default: 0.0

  - name: occupancy_threshold_backbone
    type: number
    description: "Native rc-foundry 0.1.9 occupancy_threshold_backbone control; typed nested shape is defined by NativeOptions."
    required: false
    default: 0.0

  - name: structure_noise
    type: number
    description: "Native coordinate noise standard deviation in Angstroms."
    required: false
    default: 0.0

  - name: decode_type
    type: string
    description: "Native rc-foundry 0.1.9 decode_type control; typed nested shape is defined by NativeOptions."
    required: false
    default: "auto_regressive"
    enum: [auto_regressive, teacher_forcing]

  - name: causality_pattern
    type: string
    description: "Native rc-foundry 0.1.9 causality_pattern control; typed nested shape is defined by NativeOptions."
    required: false
    default: "auto_regressive"
    enum: [auto_regressive, unconditional, conditional, conditional_minus_self]

  - name: initialize_sequence_embedding_with_ground_truth
    type: boolean
    description: "Native rc-foundry 0.1.9 initialize_sequence_embedding_with_ground_truth control; typed nested shape is defined by NativeOptions."
    required: false
    default: false

  - name: atomize_side_chains
    type: boolean
    description: "Atomize fixed-residue side chains as structural context; native default false."
    required: false
    default: false

  - name: fixed_residues
    type: string_list
    description: "Native fixed author residue IDs; mutually exclusive with designed residues and chain scopes."
    required: false
    default: null

  - name: designed_residues
    type: string_list
    description: "Native designed author residue IDs; null scope designs all protein residues."
    required: false
    default: null

  - name: fixed_chains
    type: string_list
    description: "Native rc-foundry 0.1.9 fixed_chains control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: designed_chains
    type: string_list
    description: "Native rc-foundry 0.1.9 designed_chains control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: bias
    type: object
    description: "Native rc-foundry 0.1.9 bias control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: bias_per_residue
    type: object
    description: "Native rc-foundry 0.1.9 bias_per_residue control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: omit
    type: string_list
    description: "Native rc-foundry 0.1.9 omit control; typed nested shape is defined by NativeOptions."
    required: false
    default: ["UNK"]

  - name: omit_per_residue
    type: object
    description: "Native rc-foundry 0.1.9 omit_per_residue control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: pair_bias
    type: object
    description: "Native rc-foundry 0.1.9 pair_bias control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: pair_bias_per_residue_pair
    type: object
    description: "Native rc-foundry 0.1.9 pair_bias_per_residue_pair control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: temperature_per_residue
    type: object
    description: "Native rc-foundry 0.1.9 temperature_per_residue control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: symmetry_residues
    type: array
    description: "Native rc-foundry 0.1.9 symmetry_residues control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: symmetry_residues_weights
    type: array
    description: "Native rc-foundry 0.1.9 symmetry_residues_weights control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: homo_oligomer_chains
    type: array
    description: "Native rc-foundry 0.1.9 homo_oligomer_chains control; typed nested shape is defined by NativeOptions."
    required: false
    default: null

  - name: write_fasta
    type: boolean
    description: "Write native FASTA sequences."
    required: false
    default: true

  - name: write_structures
    type: boolean
    description: "Write native designed CIF structures (sequence design, not side-chain packing)."
    required: false
    default: true

# Pre-configured NTP templates for DNA polymerase work
ntp_templates:
  - id: dATP
    name: Deoxyadenosine Triphosphate
    smiles: "Nc1ncnc2c1ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3"
    description: dATP - pairs with thymine in DNA synthesis

  - id: dTTP
    name: Deoxythymidine Triphosphate
    smiles: "Cc1cn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)[nH]c1=O"
    description: dTTP - pairs with adenine in DNA synthesis

  - id: dGTP
    name: Deoxyguanosine Triphosphate
    smiles: "Nc1nc2c(ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3)c(=O)[nH]1"
    description: dGTP - pairs with cytosine in DNA synthesis

  - id: dCTP
    name: Deoxycytidine Triphosphate
    smiles: "Nc1ccn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)n1"
    description: dCTP - pairs with guanine in DNA synthesis

  - id: ATP
    name: Adenosine Triphosphate
    smiles: "Nc1ncnc2c1ncn2[C@@H]3O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]3O"
    description: ATP - RNA nucleotide, also energy currency

  - id: UTP
    name: Uridine Triphosphate  
    smiles: "O=c1ccn([C@@H]2O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]2O)c(=O)[nH]1"
    description: UTP - RNA nucleotide, replaces TTP

  - id: GTP
    name: Guanosine Triphosphate
    smiles: "Nc1nc2c(ncn2[C@@H]3O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]3O)c(=O)[nH]1"
    description: GTP - RNA nucleotide, also signaling molecule

  - id: CTP
    name: Cytidine Triphosphate
    smiles: "Nc1ccn([C@@H]2O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]2O)c(=O)n1"
    description: CTP - RNA nucleotide

enabled: true
experimental: false
