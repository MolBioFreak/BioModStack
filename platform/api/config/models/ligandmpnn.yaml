# LigandMPNN Model Configuration
# Ligand/nucleotide-aware sequence design

id: ligandmpnn
name: LigandMPNN
version: "1.0.0"
category: sequence_design
description: >
  Sequence design with explicit ligand awareness. Critical for designing
  proteins that interact with small molecules, nucleotides (NTPs), metals,
  or nucleic acids. Essential for DNA polymerase engineering.
container: foundry.sif

ui_icon: flask
ui_color: "#F59E0B"

inputs:
  - pdb
  - smiles
outputs:
  - pdb
  - fasta
  - json

modes:
  - id: ligand_aware
    name: Ligand-Aware Design
    description: Design sequences aware of bound ligand coordinates
    params:
      - ligand_pdb
      - ligand_smiles
      - temperature

  - id: ntp_aware
    name: NTP-Aware Design
    description: Design sequences for nucleotide triphosphate binding (e.g., DNA Polymerase engineering)
    params:
      - ntp_type
      - target_pdb
      - temperature

  - id: metal_aware
    name: Metal-Aware Design
    description: Design sequences for metal ion coordination
    params:
      - metal_type
      - target_pdb
      - temperature

  - id: dna_aware
    name: DNA-Aware Design
    description: Design sequences for DNA binding
    params:
      - dna_sequence
      - target_pdb
      - temperature

  - id: interface_context
    name: Experimental Interface Context
    description: >
      Optional, unqualified whole-patch held-out target identity sampling on a
      supplied binder–target PDB, compared with the binder chain removed.
      Produces raw unclassified evidence, never a binding verdict or redesign.
    params:
      - binder_chain
      - target_chain
      - target_patch
      - seed
      - samples
      - temperature

params:
  # The parent binds candidate_id, round_id, source_sha256 and the immutable
  # structure snapshot. They are result identity, not operator scientific knobs.
  - name: binder_chain
    type: string
    description: Exact one-character PDB chain held fixed in the supplied complex
    required: true
    pattern: '^[A-Za-z0-9]$'

  - name: target_chain
    type: string
    description: Exact one-character PDB chain containing the assessed patch
    required: true
    pattern: '^[A-Za-z0-9]$'

  - name: target_patch
    type: array
    description: Ordered unique target-chain PDB residue IDs (1–32), e.g. A31, A32A; the entire patch is hidden together
    required: true

  - name: seed
    type: integer
    description: Foundry sampling seed (nonnegative 31-bit integer)
    required: true
    minimum: 0
    maximum: 2147483647

  - name: samples
    type: integer
    description: Number of samples in each of the two matched context conditions
    required: true
    minimum: 1
    maximum: 16

  - name: temperature
    type: number
    description: Sampling temperature
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0

  - name: ligand_pdb
    type: file
    description: PDB file containing ligand coordinates
    required: false
    file_type: pdb
    preset_type: pdb

  - name: ligand_smiles
    type: string
    description: SMILES string of the ligand
    required: false
    preset_type: ligand

  - name: target_pdb
    type: file
    description: Target protein PDB with ligand binding site
    required: true
    file_type: pdb
    preset_type: pdb

  - name: ntp_type
    type: string
    description: Type of nucleotide triphosphate
    required: false
    enum:
      - dATP
      - dTTP
      - dGTP
      - dCTP
      - ATP
      - UTP
      - GTP
      - CTP

  - name: metal_type
    type: string
    description: Metal ion type
    required: false
    enum:
      - Mg2+
      - Mn2+
      - Zn2+
      - Ca2+
      - Fe2+
      - Fe3+
      - Cu2+

  - name: dna_sequence
    type: string
    description: DNA sequence for context
    required: false

# Pre-configured NTP templates for DNA polymerase work
ntp_templates:
  - id: dATP
    name: Deoxyadenosine Triphosphate
    smiles: "Nc1ncnc2c1ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3"
    description: dATP - pairs with thymine in DNA synthesis

  - id: dTTP
    name: Deoxythymidine Triphosphate
    smiles: "Cc1cn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)[nH]c1=O"
    description: dTTP - pairs with adenine in DNA synthesis

  - id: dGTP
    name: Deoxyguanosine Triphosphate
    smiles: "Nc1nc2c(ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3)c(=O)[nH]1"
    description: dGTP - pairs with cytosine in DNA synthesis

  - id: dCTP
    name: Deoxycytidine Triphosphate
    smiles: "Nc1ccn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)n1"
    description: dCTP - pairs with guanine in DNA synthesis

  - id: ATP
    name: Adenosine Triphosphate
    smiles: "Nc1ncnc2c1ncn2[C@@H]3O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]3O"
    description: ATP - RNA nucleotide, also energy currency

  - id: UTP
    name: Uridine Triphosphate  
    smiles: "O=c1ccn([C@@H]2O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]2O)c(=O)[nH]1"
    description: UTP - RNA nucleotide, replaces TTP

  - id: GTP
    name: Guanosine Triphosphate
    smiles: "Nc1nc2c(ncn2[C@@H]3O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]3O)c(=O)[nH]1"
    description: GTP - RNA nucleotide, also signaling molecule

  - id: CTP
    name: Cytidine Triphosphate
    smiles: "Nc1ccn([C@@H]2O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]2O)c(=O)n1"
    description: CTP - RNA nucleotide

enabled: true
experimental: false
