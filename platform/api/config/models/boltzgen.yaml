    source: services/boltzgen_request_compatibility.py:BoltzGenRankWeights
    group: selection
    modes:
    - protein_binder
    - peptide_binder
    - nanobody_binder
    exclusiveMinimum: 0
  - name: boltzgen_covalent_bonds
    type: string
    default: null
    nullable: true
