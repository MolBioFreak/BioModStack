    nullable: true
    group: source
  - name: boltzgen_batch_size
    type: integer
    description: Batch size for parallel generation (designs per GPU pass)
    default: 1
    minimum: 1
    modes:
    - protein_binder
    - peptide_binder
    - nanobody_binder
    source: modules/boltzgen.nf:RunBoltzGen/FilterBoltzGen
    nullable: false
    group: run
  - name: boltzgen_budget
    type: integer
    description: Final number of designs to keep after diversity selection
    required: false
    minimum: 1
    modes:
    - protein_binder
    - peptide_binder
    - nanobody_binder
    source: modules/boltzgen.nf:RunBoltzGen/FilterBoltzGen
    default: null
    nullable: true
    group: selection
  - name: boltzgen_alpha
    type: number
    description: 'Quality/diversity tradeoff: 0.0=quality only, 1.0=diversity only'
    default: 0.01
    minimum: 0
    maximum: 1
    modes:
    - protein_binder
    - peptide_binder
    - nanobody_binder
    source: modules/boltzgen.nf:RunBoltzGen/FilterBoltzGen
    nullable: false
    group: selection
  - name: boltzgen_max_rmsd
