    - peptide_binder
    - nanobody_binder
    exclusiveMinimum: 0
  - name: boltzgen_rank_affinity_probability_weight
    type: number
    default: 1.0
    nullable: true
    description: Native affinity_probability rank weight; null disables this metric.
      Not a universal confidence score.
    source: services/boltzgen_request_compatibility.py:BoltzGenRankWeights
    group: selection
    modes:
    - protein_binder
    - peptide_binder
    - nanobody_binder
    exclusiveMinimum: 0
  - name: boltzgen_rank_filter_rmsd_weight
    type: number
    default: 1.0
    nullable: true
    description: Native filter_rmsd rank weight; null disables this metric. Not a universal
