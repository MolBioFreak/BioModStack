id: caliby_experimental
name: Caliby Standalone
version: 0.2.0
category: generative_design
description: Native ensemble-conditioned sequence design and fixed-sequence side-chain
  packing. Historical design/task requests remain retired; caliby_binder is unchanged.
container: caliby.sif
inputs:
- pdb
- cif
outputs:
- cif
- json
modes:
- id: ensemble_design
  name: Ensemble Sequence Design
  description: Ordered conformers condition one ensemble; first state is primary.
  params:
  - batch_size
  - num_workers
  - scn_num_steps
  - scn_step_scale
  - ensembles
  - model_name
  - num_seqs_per_pdb
  - temperature
  - omit_aas
  - verbose
  - use_primary_res_type
  - ensemble_ignore_res_idx_mismatch
  - gaussian_n_conformers
  - gaussian_noise_std
  - potts_regularization
  - potts_sweeps
  - potts_proposal
  - potts_rejection_step
  - potts_only_cond
- id: sidechain_pack
  name: Fixed-sequence Side-chain Packing
  description: Pack the native input sequence without amino-acid redesign.
  params:
  - batch_size
  - num_workers
  - scn_num_steps
  - scn_step_scale
  - structures
  - packer_model_name
params:
- name: batch_size
  type: integer
  description: 'Batch Size. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 4
  minimum: 1
- name: num_workers
  type: integer
  description: 'Num Workers. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 8
  minimum: 0
- name: scn_num_steps
  type: integer
  description: 'Scn Num Steps. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 50
  minimum: 1
- name: scn_step_scale
  type: number
  description: 'Scn Step Scale. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 1.5
- name: ensembles
  type: array
  description: Ordered ensembles with ensemble_id and ordered states. Each state has
    state_id, structure path, and typed native positional constraints; first state
    is primary.
  required: true
- name: model_name
  type: string
  description: 'Model Name. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: soluble_caliby_v1
  enum:
  - caliby
  - soluble_caliby
  - soluble_caliby_v1
- name: num_seqs_per_pdb
  type: integer
  description: 'Num Seqs Per Pdb. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 4
  minimum: 1
- name: temperature
  type: number
  description: 'Temperature. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 0.1
- name: omit_aas
  type: string_list
  description: 'Omit Aas. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default:
  - C
- name: verbose
  type: boolean
  description: 'Verbose. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: true
- name: use_primary_res_type
  type: boolean
  description: 'Use Primary Res Type. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: true
- name: ensemble_ignore_res_idx_mismatch
  type: boolean
  description: 'Ensemble Ignore Res Idx Mismatch. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: false
- name: gaussian_n_conformers
  type: integer
  description: 'Gaussian N Conformers. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 0
  minimum: 0
- name: gaussian_noise_std
  type: number
  description: 'Gaussian Noise Std. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 0.0
  minimum: 0
- name: potts_regularization
  type: string
  description: 'Potts Regularization. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: LCP
  enum:
  - LCP
  - none
- name: potts_sweeps
  type: integer
  description: 'Potts Sweeps. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: 500
  minimum: 1
- name: potts_proposal
  type: string
  description: 'Potts Proposal. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: dlmc
  enum:
  - dlmc
  - chromatic
- name: potts_rejection_step
  type: boolean
  description: 'Potts Rejection Step. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: false
- name: potts_only_cond
  type: boolean
  description: 'Potts Only Cond. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: false
- name: structures
  type: array
  description: Input structures with distinct state_id and structure path; sequence
    identities stay fixed.
  required: true
- name: packer_model_name
  type: string
  description: 'Packer Model Name. Native typed contract: services.caliby_native.REQUEST.'
  required: false
  default: caliby_packer_010
  enum:
  - caliby_packer_000
  - caliby_packer_010
  - caliby_packer_030
enabled: true
experimental: true

