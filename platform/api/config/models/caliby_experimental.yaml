id: caliby_experimental
name: Caliby Experimental
version: "0.1.0"
category: generative_design
description: >
  Experimental structure-conditioned sequence design workflow using Caliby.
  Supports single-structure design, ensemble-conditioned design, and sidechain
  packing through one BMS launcher surface.
container: caliby.sif

ui_icon: sparkles
ui_color: "#14B8A6"

inputs:
  - pdb
  - cif
  - csv
outputs:
  - pdb
  - json

modes:
  - id: design
    name: Experimental Sequence Design
    description: Structure-conditioned sequence design and packing with Caliby
    params:
      - task
      - input_pdb_dir
      - conformer_dir
      - pdb_name_list
      - pos_constraint_csv
      - model_name
      - packer_model_name
      - num_seqs_per_pdb
      - batch_size
      - num_workers
      - clean_num_workers
      - temperature
      - omit_aas
      - run_self_consistency_eval
      - self_consistency_num_models
      - self_consistency_num_recycles
      - self_consistency_use_multimer
      - sampling_overrides_json

params:
  - name: task
    type: string
    description: Caliby task to run
    required: true
    default: sequence_design
    enum:
      - sequence_design
      - ensemble_design
      - sidechain_pack

  - name: input_pdb_dir
    type: directory
    description: Directory of input PDB/mmCIF structures for sequence design or packing
    required: false

  - name: conformer_dir
    type: directory
    description: Directory containing ensemble conformers grouped by structure
    required: false

  - name: pdb_name_list
    type: file
    description: Optional newline-delimited subset of structure IDs to process
    required: false

  - name: pos_constraint_csv
    type: file
    description: Optional Caliby positional-constraint CSV
    required: false

  - name: model_name
    type: string
    description: Caliby checkpoint name or .ckpt path
    required: false
    default: soluble_caliby_v1
    enum:
      - caliby
      - soluble_caliby
      - soluble_caliby_v1

  - name: packer_model_name
    type: string
    description: Sidechain packer checkpoint name used for sidechain_pack tasks
    required: false
    default: caliby_packer_010
    enum:
      - caliby_packer_000
      - caliby_packer_010
      - caliby_packer_030

  - name: num_seqs_per_pdb
    type: integer
    description: Number of sequences to sample per structure
    required: false
    default: 4
    minimum: 1
    maximum: 64

  - name: batch_size
    type: integer
    description: Batch size for Caliby inference
    required: false
    default: 4
    minimum: 1
    maximum: 64

  - name: num_workers
    type: integer
    description: Number of Caliby dataloader workers
    required: false
    default: 8
    minimum: 1
    maximum: 64

  - name: clean_num_workers
    type: integer
    description: Number of workers used to clean input structures before design
    required: false
    default: 2
    minimum: 1
    maximum: 32

  - name: temperature
    type: number
    description: Final Potts sampling temperature
    required: false
    default: 0.1
    minimum: 0.001
    maximum: 1.0

  - name: omit_aas
    type: string
    description: Comma-separated amino acids to omit globally during design
    required: false
    default: C

  - name: run_self_consistency_eval
    type: boolean
    description: Run AlphaFold2 self-consistency evaluation on designed outputs
    required: false
    default: false

  - name: self_consistency_num_models
    type: integer
    description: Number of AF2 models to sample during self-consistency evaluation
    required: false
    default: 5
    minimum: 1
    maximum: 5

  - name: self_consistency_num_recycles
    type: integer
    description: AF2 recycle count during self-consistency evaluation
    required: false
    default: 3
    minimum: 1
    maximum: 12

  - name: self_consistency_use_multimer
    type: boolean
    description: Use AF2-Multimer for self-consistency evaluation
    required: false
    default: false

  - name: sampling_overrides_json
    type: text
    description: Optional JSON merged into Caliby sampling_overrides
    required: false

enabled: false
experimental: true
