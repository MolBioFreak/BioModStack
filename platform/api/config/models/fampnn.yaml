# Full-Atom MPNN (FAMPNN) Model Configuration
# Sequence design with sidechain awareness

id: fampnn
name: Full-Atom MPNN
version: "1.0.0"
category: sequence_design
description: >
  Full-atom message passing neural network for sequence design.
  Unlike ProteinMPNN, considers sidechain conformations for more
  accurate sequence predictions.
container: fampnn.sif

ui_icon: atom
ui_color: "#06B6D4"

inputs:
  - pdb
  - sequence
outputs:
  - pdb
  - fasta
  - json

modes:
  - id: design
    name: Full-Atom Sequence Design
    description: Design sequences from a PDB backbone structure
    params:
      - input_pdb
      - design_chain
      - target_chain
      - fampnn_temperature
      - fampnn_exclude_cys
      - fampnn_fix_target_sidechains
      - fampnn_psce_threshold
      - fampnn_seq_only
      - fampnn_num_steps
      - fampnn_batch_size
      - fampnn_repack_last
      - fampnn_extra_config

  - id: fixed_backbone
    name: Fixed Backbone Redesign
    description: Redesign sequence while keeping specific residues fixed
    params:
      - input_pdb
      - fixed_positions
      - fampnn_temperature
      - fampnn_exclude_cys
      - fampnn_psce_threshold
      - fampnn_seq_only
      - fampnn_num_steps
      - fampnn_extra_config

  - id: binder_design
    name: Binder Sequence Design
    description: Design binder sequences against a fixed target
    params:
      - input_pdb
      - design_chain
      - target_chain
      - fampnn_temperature
      - fampnn_exclude_cys
      - fampnn_fix_target_sidechains
      - fampnn_psce_threshold
      - fampnn_seq_only
      - fampnn_num_steps
      - fampnn_batch_size
      - fampnn_repack_last
      - fampnn_extra_config

params:
  # Input file
  - name: input_pdb
    type: file
    description: Input PDB structure for sequence design
    required: true
    file_type: pdb
    preset_type: pdb

  # Chain specification
  - name: design_chain
    type: string
    description: "Chain ID(s) to redesign (e.g., 'A' or 'A,B')"
    required: false
    default: "A"

  - name: target_chain
    type: string
    description: "Target chain ID(s) to keep fixed (e.g., 'B' for binder design)"
    required: false

  - name: fixed_positions
    type: string
    description: "Residue positions to keep fixed (e.g., 'A:1-10,A:50-60' or 'A:1,A:5,A:10')"
    required: false

  # Core sampling parameters
  - name: fampnn_temperature
    type: number
    description: "Sampling temperature (0.1=conservative, 1.0=diverse, 2.0=creative)"
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0

  - name: fampnn_exclude_cys
    type: boolean
    description: Exclude cysteine residues from design (prevents disulfide issues)
    required: false
    default: true

  - name: fampnn_fix_target_sidechains
    type: boolean
    description: Fix target sidechain positions during binder design
    required: false
    default: false

  - name: fampnn_constraint_mode
    type: string
    description: "Constraint mode: 'generic' (no fixed residues) or 'antibody' (CDR-aware constraints)"
    required: false
    default: "generic"
    enum:
      - generic
      - antibody

  - name: fampnn_psce_threshold
    type: number
    description: "PSCE confidence threshold for sidechain filtering (0.0-1.0)"
    required: false
    default: 0.3
    minimum: 0.0
    maximum: 1.0

  # Advanced denoising parameters
  - name: fampnn_seq_only
    type: boolean
    description: Sequence-only mode (skip sidechain diffusion, faster but less accurate)
    required: false
    default: false

  - name: fampnn_num_steps
    type: integer
    description: "Number of denoising timesteps (higher = better quality, slower)"
    required: false
    default: 100
    minimum: 10
    maximum: 500

  - name: fampnn_batch_size
    type: integer
    description: Batch size for inference (reduce if OOM errors)
    required: false
    default: 16
    minimum: 1
    maximum: 64

  - name: fampnn_repack_last
    type: boolean
    description: Repack sidechains after final denoising step
    required: false
    default: true

  # Debug/Advanced parameters
  - name: fampnn_extra_config
    type: string
    description: "Raw config passthrough for debugging (e.g., 'seed=42 scn_diffusion.num_steps=50')"
    required: false
    hidden: false

# Preset PDB structures for testing
preset_structures:
  - id: pdl1
    name: "PD-L1 (5o45)"
    path: "benchmarkdata/5o45_pd-l1.pdb"
    description: "Immune checkpoint target"
    
  - id: trka
    name: "TrkA Receptor (1www)"
    path: "benchmarkdata/1www_trka.pdb"
    description: "Neurotrophin receptor"
    
  - id: il7ra
    name: "IL-7Rα (3di3)"
    path: "benchmarkdata/3di3_il7ra.pdb"
    description: "Interleukin receptor"

  - id: tdt
    name: "TdT Polymerase (1kej)"
    path: "rcsb/1kej_tdt.pdb"
    description: "Terminal deoxynucleotidyl transferase"

  - id: klenow
    name: "Klenow Fragment (1kln)"
    path: "rcsb/1kln_klenow.pdb"
    description: "DNA Polymerase I Klenow fragment"

enabled: true
experimental: false
