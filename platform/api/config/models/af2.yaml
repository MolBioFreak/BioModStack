# AlphaFold2 Model Configuration
# Structure prediction with initial guess support

id: af2
name: AlphaFold2
version: "2.3.2"
category: structure_prediction
description: >
  AlphaFold2 structure prediction with support for initial guess mode.
  Used as secondary validator, particularly effective for binder validation
  with target structure hints.
container: af2.sif

ui_icon: brain
ui_color: "#6366F1"

inputs:
  - fasta
  - pdb
outputs:
  - pdb
  - json

modes:
  - id: af2_predict
    name: Structure Prediction
    description: Predict structure from sequence
    params:
      - sequence
      - sequence_name

  - id: initial_guess
    name: Initial Guess Mode
    description: Prediction with structure hints from input PDB
    params:
      - sequence
      - sequence_name
      - af2_initial_guess
      - uncropped_target_pdb

params:
  # Input sequence
  - name: sequence
    type: text
    description: Amino acid sequence to predict
    required: true
    preset_type: sequence

  - name: sequence_name
    type: string
    description: Name for output structure files
    required: false
    default: predicted

  - name: af2_initial_guess
    type: boolean
    description: Use initial guess from input structure
    required: false
    default: true

  - name: uncropped_target_pdb
    type: file
    description: Full target PDB for context in binder prediction
    required: false
    file_type: pdb
    preset_type: pdb

  - name: af2_extra_config
    type: string
    description: "Additional AF2 CLI arguments (e.g., '-recycle 3')"
    required: false

enabled: true
experimental: false
