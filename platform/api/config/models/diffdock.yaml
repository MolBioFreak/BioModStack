# DiffDock Model Configuration
# Protein-ligand docking via diffusion

id: diffdock
name: DiffDock
version: "1.1.0"
category: docking
description: >
  Diffusion-based molecular docking for predicting ligand binding poses.
  Essential for understanding NTP binding sites in DNA polymerases and
  validating designed binding pockets.
container: diffdock.sif

ui_icon: arrows-to-dot
ui_color: "#EC4899"

inputs:
  - pdb
  - smiles
  - sdf
outputs:
  - pdb
  - sdf
  - json

modes:
  - id: dock
    name: Ligand Docking
    description: Dock a ligand to a protein structure
    params:
      - protein_pdb
      - ligand_smiles
      - num_poses
      - confidence_threshold

  - id: ntp_dock
    name: NTP Docking
    description: Dock nucleotide triphosphates to polymerase
    params:
      - protein_pdb
      - ntp_type
      - num_poses

params:
  - name: protein_pdb
    type: file
    description: Protein structure PDB file
    required: true

  - name: ligand_smiles
    type: string
    description: Ligand SMILES string
    required: false

  - name: ligand_sdf
    type: file
    description: Ligand structure in SDF format
    required: false

  - name: ntp_type
    type: string
    description: Pre-configured NTP type for docking
    required: false
    enum:
      - dATP
      - dTTP
      - dGTP
      - dCTP
      - ATP
      - UTP
      - GTP
      - CTP

  - name: num_poses
    type: integer
    description: Number of docking poses to generate
    required: false
    default: 10
    minimum: 1
    maximum: 100

  - name: confidence_threshold
    type: number
    description: Minimum confidence score for poses
    required: false
    default: 0.0
    minimum: 0.0
    maximum: 1.0

# Pre-configured NTP templates (shared with LigandMPNN)
ntp_templates:
  - id: dATP
    name: Deoxyadenosine Triphosphate
    smiles: "Nc1ncnc2c1ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3"
    description: dATP - pairs with thymine

  - id: dTTP
    name: Deoxythymidine Triphosphate
    smiles: "Cc1cn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)[nH]c1=O"
    description: dTTP - pairs with adenine

  - id: dGTP
    name: Deoxyguanosine Triphosphate
    smiles: "Nc1nc2c(ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3)c(=O)[nH]1"
    description: dGTP - pairs with cytosine

  - id: dCTP
    name: Deoxycytidine Triphosphate
    smiles: "Nc1ccn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)n1"
    description: dCTP - pairs with guanine

# Mark as planned but not yet integrated
enabled: true
experimental: false
