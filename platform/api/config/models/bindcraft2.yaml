# Runtime asset declaration only. The native inventory is not yet a complete
# typed operator/browser contract; no public job or agent route is enabled.
id: bindcraft2
name: BindCraft2
version: "1.0.1+d5bae16e9fee95f4c97fc16bc05dcbde4ccb885f"
category: generative_design
description: >
  Pinned native BindCraft2 campaign runtime. Not launchable until the global
  typed settings, artifact publication and local/remote bridge are integrated.
container: bindcraft2.sif
inputs:
  - cif
  - pdb
  - fasta
  - json
outputs:
  - cif
  - csv
  - json
modes:
  - id: campaign
    name: Native campaign
    description: Pinned typed scientific request; requires model-owned native compilation.
    params: [bindcraft2_settings, bc2_preview_digest]
params:
  - name: bindcraft2_settings
    type: object
    required: true
    description: Complete typed BindCraft2 native scientific settings, including finite max_trajectories.
  - name: bc2_preview_digest
    type: string
    required: true
    pattern: '^[0-9a-f]{64}$'
    description: Digest of the pinned native preview for this exact request and governed source bytes.
enabled: false
experimental: true
public_launch: false
