id: protein_cad_experimental
name: Protein CAD Experimental
version: "0.1.0"
category: generative_design
description: >
  Experimental multimodel de novo protein design workflow that routes to
  La-Proteina or DISCO from one BMS surface. This is the starting point for a
  future constraint-driven protein CAD stack rather than a finished product.
container: foundry.sif

ui_icon: cube
ui_color: "#06B6D4"

inputs:
  - pdb
  - sdf
  - json
outputs:
  - pdb
  - json

modes:
  - id: design
    name: Experimental Design
    description: Generate de novo protein candidates with La-Proteina or DISCO
    params:
      - backend
      - design_task
      - num_designs
      - target_lengths
      - laproteina_preset
      - laproteina_samples_per_length
      - laproteina_num_steps
      - laproteina_motif_task_name
      - laproteina_motif_pdb
      - laproteina_contig_string
      - laproteina_segment_order
      - laproteina_atom_selection_mode
      - laproteina_motif_min_length
      - laproteina_motif_max_length
      - laproteina_checkpoint_dir
      - laproteina_data_path
      - disco_experiment
      - disco_effort
      - disco_num_inference_seeds
      - disco_seeds
      - disco_input_json_path
      - disco_ligand_sdf
      - disco_ligand_name
      - disco_na_sequence
      - disco_checkpoint_path
      - disco_use_deepspeed_evo_attention
      - disco_cutlass_path

params:
  - name: backend
    type: string
    description: Experimental backend to run
    required: true
    default: disco
    enum:
      - disco
      - laproteina
    ui_group: General
    ui_order: 1

  - name: design_task
    type: string
    description: Task family to compile into the selected backend's native input format
    required: true
    default: unconditional
    enum:
      - unconditional
      - motif_scaffolding
      - ligand_conditioned
      - dna_conditioned
      - rna_conditioned
      - custom_json
    ui_group: General
    ui_order: 2

  - name: num_designs
    type: integer
    description: Number of candidate designs or seeds to generate
    required: true
    default: 8
    minimum: 1
    maximum: 512
    ui_group: General
    ui_order: 3

  - name: target_lengths
    type: string
    description: >
      Comma-separated protein lengths to generate (for example 100,150,200).
      For La-Proteina this becomes the unconditional length sweep. For DISCO it
      controls masked-chain length jobs unless a custom JSON is supplied.
    required: true
    default: "100,200"
    ui_group: General
    ui_order: 4

  - name: laproteina_preset
    type: string
    description: Upstream La-Proteina inference preset
    required: false
    default: ucond_tri
    enum:
      - ucond_tri
      - ucond_notri
      - ucond_notri_long
      - motif_idx_aa
      - motif_idx_tip
      - motif_uidx_aa
      - motif_uidx_tip
    ui_group: La-Proteina
    ui_order: 10

  - name: laproteina_samples_per_length
    type: integer
    description: Number of La-Proteina samples to draw per target length
    required: false
    default: 8
    minimum: 1
    maximum: 512
    ui_group: La-Proteina
    ui_order: 11

  - name: laproteina_num_steps
    type: integer
    description: Sampling steps written into the La-Proteina generation config
    required: false
    default: 400
    minimum: 50
    maximum: 2000
    ui_group: La-Proteina
    ui_order: 12

  - name: laproteina_motif_task_name
    type: string
    description: >
      Upstream motif task key from configs/generation/motif_dict.yaml. Leave
      empty if you are supplying a custom motif PDB and contig string.
    required: false
    ui_group: La-Proteina
    ui_order: 13

  - name: laproteina_motif_pdb
    type: file
    description: Custom motif/reference PDB for La-Proteina motif scaffolding
    required: false
    file_type: pdb
    preset_type: pdb
    ui_group: La-Proteina
    ui_order: 14

  - name: laproteina_contig_string
    type: string
    description: Contig string for custom La-Proteina motif scaffolding tasks
    required: false
    ui_group: La-Proteina
    ui_order: 15

  - name: laproteina_segment_order
    type: string
    description: Optional segment-order string for custom motif tasks (for example A;B;C)
    required: false
    ui_group: La-Proteina
    ui_order: 16

  - name: laproteina_atom_selection_mode
    type: string
    description: Atom-selection mode for custom motif scaffolding
    required: false
    default: all_atom
    enum:
      - all_atom
      - tip_atoms
      - backbone
      - sidechain
      - ca_only
      - random
    ui_group: La-Proteina
    ui_order: 17

  - name: laproteina_motif_min_length
    type: integer
    description: Minimum total generated length for a custom motif task
    required: false
    minimum: 1
    maximum: 2000
    ui_group: La-Proteina
    ui_order: 18

  - name: laproteina_motif_max_length
    type: integer
    description: Maximum total generated length for a custom motif task
    required: false
    minimum: 1
    maximum: 2000
    ui_group: La-Proteina
    ui_order: 19

  - name: laproteina_checkpoint_dir
    type: directory
    description: Optional override for the La-Proteina checkpoint directory
    required: false
    ui_group: La-Proteina
    ui_order: 20

  - name: laproteina_data_path
    type: directory
    description: Optional DATA_PATH override for La-Proteina dataloaders and motif assets
    required: false
    ui_group: La-Proteina
    ui_order: 21

  - name: disco_experiment
    type: string
    description: DISCO experiment preset controlling designability versus diversity
    required: false
    default: designable
    enum:
      - designable
      - diverse
    ui_group: DISCO
    ui_order: 30

  - name: disco_effort
    type: string
    description: DISCO compute preset
    required: false
    default: fast
    enum:
      - fast
      - max
    ui_group: DISCO
    ui_order: 31

  - name: disco_num_inference_seeds
    type: integer
    description: Number of inference seeds to generate when explicit seeds are not supplied
    required: false
    default: 8
    minimum: 1
    maximum: 1024
    ui_group: DISCO
    ui_order: 32

  - name: disco_seeds
    type: string
    description: Optional explicit comma-separated seed list for DISCO
    required: false
    ui_group: DISCO
    ui_order: 33

  - name: disco_input_json_path
    type: file
    description: >
      Path to a fully specified DISCO input JSON. Required for custom_json and
      optional for advanced users who want to bypass BMS request compilation.
    required: false
    file_type: json
    ui_group: DISCO
    ui_order: 34

  - name: disco_ligand_sdf
    type: file
    description: Ligand SDF file for DISCO ligand-conditioned generation
    required: false
    file_type: sdf
    ui_group: DISCO
    ui_order: 35

  - name: disco_ligand_name
    type: string
    description: Human-readable ligand label for DISCO ligand-conditioned jobs
    required: false
    ui_group: DISCO
    ui_order: 36

  - name: disco_na_sequence
    type: text
    description: DNA or RNA sequence for nucleic-acid-conditioned DISCO generation
    required: false
    ui_group: DISCO
    ui_order: 37

  - name: disco_checkpoint_path
    type: file
    description: Optional explicit DISCO checkpoint path; defaults to BMS weights root
    required: false
    ui_group: DISCO
    ui_order: 38

  - name: disco_use_deepspeed_evo_attention
    type: boolean
    description: Enable DISCO's DeepSpeed EvoformerAttention path (requires CUTLASS)
    required: false
    default: false
    ui_group: DISCO
    ui_order: 39

  - name: disco_cutlass_path
    type: directory
    description: Optional CUTLASS checkout path used when DeepSpeed EvoformerAttention is enabled
    required: false
    ui_group: DISCO
    ui_order: 40

enabled: true
experimental: true
