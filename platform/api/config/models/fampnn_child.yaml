# FAMPNN Child Sequence-Design Workflow
# Internal GPU-orchestrated child for batched FA-MPNN redesign.

id: fampnn_child
name: FAMPNN Sequence Design (Child)
version: 1.0.0
category: sequence_design
description: >
  Internal child workflow for parallel FA-MPNN sequence design over selected
  antibody/backbone PDB batches. Spawned by parent workflows; hidden from the
  normal launcher menu.

workflow_type: pipeline
container: apptainer/fampnn.sif

ui_icon: protein
ui_color: "#06b6d4"
hidden: true

modes:
  - id: sequence_design
    name: Sequence Design
    description: Design CDR/binder sequences for a batch of input PDBs
    params: []

inputs:
  - pdb_paths

outputs:
  - pdb
  - json
  - csv
