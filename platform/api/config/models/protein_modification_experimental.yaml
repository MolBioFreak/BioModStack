id: protein_modification_experimental
name: De Novo Design
version: "0.1.0"
category: generative_design
description: >
  Experimental protein design and modification workbench. Current modes cover
  fresh protein generation and structure-conditioned regional redesign while
  retaining distinct scientific contracts under one product boundary.
container: foundry.sif

ui_icon: cube
ui_color: "#22C55E"

inputs:
  - pdb
  - sdf
  - json
outputs:
  - pdb
  - json

modes:
  - id: de_novo_design
    name: De Novo Design
    description: Generate new protein candidates with DISCO or La-Proteina
    params:
      - backend
      - design_task
      - num_designs
      - target_lengths
      - laproteina_preset
      - laproteina_samples_per_length
      - laproteina_num_steps
      - disco_experiment
      - disco_effort
      - disco_input_json_path
  - id: shape_blueprint
    name: Generate Into Shape
    description: Generate, sequence, and refold proteins against immutable canonical geometry
    params:
      - shape_request_path
      - shape_geometry_manifest_path
      - shape_vertices_path
      - shape_faces_path
      - shape_points_path
      - shape_sdf_path
      - shape_request_sha256
      - shape_geometry_sha256
      - shape_point_pool_sha256
      - shape_target_length
      - shape_num_backbones
      - shape_sequences_per_backbone
      - shape_seed
      - shape_generator
      - shape_sequence_engines
      - shape_predictor
  - id: region_redesign
    name: Region Redesign
    description: Modify selected regions of an existing protein or complex
    params:
      - input_pdb
      - design_chains
      - context_chains
      - region_mode
      - redesign_ranges
      - interface_cutoff
      - region_padding
      - num_designs
      - seq_method
      - run_boltz_validation

params:
  - name: backend
    type: string
    description: De novo generator backend
    required: false
    default: disco
    enum: [disco, laproteina]
    ui_group: De Novo Design
    ui_order: 1
  - name: design_task
    type: string
    description: De novo design task
    required: false
    default: unconditional
    enum: [unconditional, motif_scaffolding, ligand_conditioned, dna_conditioned, rna_conditioned, custom_json]
    ui_group: De Novo Design
    ui_order: 2
  - name: num_designs
    type: integer
    description: Number of candidates to generate
    required: false
    default: 8
    minimum: 1
    maximum: 512
    ui_group: General
    ui_order: 3
  - name: target_lengths
    type: string
    description: Comma-separated de novo target lengths
    required: false
    default: "100,200"
    ui_group: De Novo Design
    ui_order: 4
  - name: laproteina_preset
    type: string
    description: La-Proteina generation preset
    required: false
    default: ucond_tri
    enum: [ucond_tri, ucond_notri, ucond_notri_long, motif_idx_aa, motif_idx_tip, motif_uidx_aa, motif_uidx_tip]
    ui_group: La-Proteina
    ui_order: 10
  - name: laproteina_samples_per_length
    type: integer
    description: Samples per requested length
    required: false
    default: 8
    minimum: 1
    maximum: 512
    ui_group: La-Proteina
    ui_order: 11
  - name: laproteina_num_steps
    type: integer
    description: La-Proteina sampling steps
    required: false
    default: 400
    minimum: 50
    maximum: 2000
    ui_group: La-Proteina
    ui_order: 12
  - name: disco_experiment
    type: string
    description: DISCO experiment preset
    required: false
    default: designable
    ui_group: DISCO
    ui_order: 20
  - name: disco_effort
    type: string
    description: DISCO inference effort
    required: false
    default: fast
    enum: [fast, medium, max]
    ui_group: DISCO
    ui_order: 21
  - name: disco_input_json_path
    type: file
    description: Optional native DISCO input JSON
    required: false
    file_type: json
    ui_group: DISCO
    ui_order: 22
  - name: input_pdb
    type: file
    description: Protein or complex structure to modify
    required: false
    file_type: pdb
    preset_type: pdb
    ui_group: Region Redesign
    ui_order: 30
  - name: design_chains
    type: string
    description: Chains eligible for redesign
    required: false
    ui_group: Region Redesign
    ui_order: 31
  - name: context_chains
    type: string
    description: Context chains preserved during redesign
    required: false
    ui_group: Region Redesign
    ui_order: 32
  - name: region_mode
    type: string
    description: Region selection strategy
    required: false
    default: manual_ranges
    enum: [manual_ranges, interface_shell]
    ui_group: Region Redesign
    ui_order: 33
  - name: redesign_ranges
    type: string
    description: Residue ranges selected for modification
    required: false
    ui_group: Region Redesign
    ui_order: 34
  - name: interface_cutoff
    type: float
    description: Interface-shell distance cutoff in angstroms
    required: false
    default: 6.0
    minimum: 1.0
    maximum: 20.0
    ui_group: Region Redesign
    ui_order: 35
  - name: region_padding
    type: integer
    description: Residue padding around selected regions
    required: false
    default: 2
    minimum: 0
    maximum: 50
    ui_group: Region Redesign
    ui_order: 36
  - name: seq_method
    type: string
    description: Sequence redesign engine
    required: false
    default: fampnn
    enum: [fampnn, mpnn]
    ui_group: Region Redesign
    ui_order: 37
  - name: run_boltz_validation
    type: boolean
    description: Validate redesigned candidates with Boltz-2
    required: false
    default: true
    ui_group: Region Redesign
    ui_order: 38
