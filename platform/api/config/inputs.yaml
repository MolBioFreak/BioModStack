# Input Presets Configuration
# Defines standard paths and pre-populated input options

# Base directory for the project (used to resolve relative paths)
project_root: /home/dalab/ProteinDJ_fork/Protein-De-Novo-Modification-and-Design-Platform

# Standard directories
standard_paths:
  benchmarkdata:
    path: benchmarkdata
    description: Benchmark target proteins for testing
  outputs:
    path: pdj_results
    description: Pipeline output directory
  lib:
    path: lib
    description: Library files and examples
  inputs:
    path: platform/api/inputs
    description: Uploaded input files

# Directory presets for batch processing
preset_directories:
  - id: all_polymerases
    name: All DNA Polymerases (3 PDBs)
    path: rcsb
    description: TdT, Klenow, and Taq polymerases for batch validation
    count: 3
    
  - id: all_benchmark
    name: All Benchmark Targets (6 PDBs)
    path: benchmarkdata
    description: TrkA, PD-L1, IL-7Rα, IR, HA - complete benchmark set
    count: 6
    
  - id: receptors_only
    name: Receptor Targets (4 PDBs)
    path: benchmarkdata
    filter_ids: [trka, il7ra, ir, ha]
    description: Receptor-type targets only
    count: 4
    
  - id: immune_only
    name: Immune Targets (2 PDBs)
    path: benchmarkdata
    filter_ids: [pdl1, pdl1_uncropped]
    description: Immune checkpoint proteins
    count: 2

# Preset PDB files for target selection
preset_pdbs:
  - id: trka
    name: TrkA Receptor (1www)
    path: benchmarkdata/1www_trka.pdb
    description: Tropomyosin receptor kinase A - nerve growth factor receptor
    category: receptor
    
  - id: pdl1
    name: PD-L1 (5o45)
    path: benchmarkdata/5o45_pd-l1.pdb
    description: Immune checkpoint protein - cancer immunotherapy target
    category: immune
    
  - id: pdl1_uncropped
    name: PD-L1 Uncropped (5o45)
    path: benchmarkdata/5o45_pd-l1_uncropped.pdb
    description: Full-length PD-L1 structure
    category: immune
    
  - id: il7ra
    name: IL-7Rα (3di3)
    path: benchmarkdata/3di3_il7ra.pdb
    description: Interleukin-7 receptor alpha chain
    category: receptor
    
  - id: ir
    name: Insulin Receptor (4zxb)
    path: benchmarkdata/4zxb_ir.pdb
    description: Insulin receptor - metabolic signaling
    category: receptor

  - id: tdt
    name: Human TdT (1KEJ)
    path: rcsb/1kej.pdb
    description: Terminal deoxynucleotidyl transferase - template-independent polymerase
    category: polymerase

  - id: klenow
    name: E. coli DNA Pol I Klenow (1KLN)
    path: rcsb/1kln.pdb
    description: Klenow fragment of E. coli DNA polymerase I
    category: polymerase

  - id: taq
    name: Taq DNA Polymerase (1TAQ)
    path: rcsb/1taq.pdb
    description: Thermus aquaticus DNA polymerase - thermostable enzyme for PCR
    category: polymerase
    
  - id: ha
    name: Hemagglutinin (5vli)
    path: benchmarkdata/5vli_ha.pdb
    description: Influenza hemagglutinin - viral entry protein
    category: viral
    
  - id: example_binder
    name: Example Binder
    path: lib/examplebinder.pdb
    description: Example binder-target complex for reference
    category: example

