preset_yamls:
- id: boltz_binder_simple
  name: Simple Binder Config
  description: Basic Boltz-2 config for binder-target prediction
  content: "version: 1\nsequences:\n  - protein:\n      id: A\n      sequence: TARGET_SEQUENCE_HERE\n\
    \  - protein:\n      id: B\n      sequence: BINDER_SEQUENCE_HERE\n"
- id: boltz_monomer
  name: Monomer Prediction
  description: Single chain structure prediction
  content: "version: 1\nsequences:\n  - protein:\n      id: A\n      sequence: YOUR_SEQUENCE_HERE\n"
preset_contigs:
- id: binder_50_100
  name: Generic Binder 50-100 residues
  value: '[A17-145/0 50-100]'
  description: For benchmark targets (TrkA, IL7RA). Edit chain/residue numbers for
    other structures.
- id: binder_70_90
  name: Generic Binder 70-90 residues
  value: '[A17-145/0 70-90]'
  description: For benchmark targets. Medium size binder.
- id: monomer_100
  name: Monomer 100 residues
  value: '[100-100]'
  description: Generate 100 residue monomer de novo
- id: monomer_variable
  name: Monomer 50-150 residues
  value: '[50-150]'
  description: Generate variable-length monomer
- id: tdt_binder_50_100
  name: TdT Binder 50-100 residues
  value: '[A148-386/A390-420/A424-510/0 50-100]'
  description: For Human TdT (1KEJ). Chain A with gap residues excluded, design 50-100
    residue binder.
- id: klenow_binder_50_100
  name: Klenow Binder 50-100 residues
  value: '[A324-928/0 50-100]'
  description: For E. coli Klenow (1KLN). Keep chain A, design 50-100 residue binder.
- id: taq_binder_50_100
  name: Taq Binder 50-100 residues
  value: '[A10-832/0 50-100]'
  description: For Taq polymerase (1TAQ). Keep entire chain A, design 50-100 residue
    binder.
