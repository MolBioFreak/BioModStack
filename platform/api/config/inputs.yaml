# Preset YAML configs for Boltz-2
preset_yamls:
  - id: boltz_binder_simple
    name: Simple Binder Config
    description: Basic Boltz-2 config for binder-target prediction
    content: |
      version: 1
      sequences:
        - protein:
            id: A
            sequence: TARGET_SEQUENCE_HERE
        - protein:
            id: B
            sequence: BINDER_SEQUENCE_HERE

  - id: boltz_monomer
    name: Monomer Prediction
    description: Single chain structure prediction
    content: |
      version: 1
      sequences:
        - protein:
            id: A
            sequence: YOUR_SEQUENCE_HERE

# Preset contig specifications for RFdiffusion
preset_contigs:
  # Generic contigs (for benchmark structures)
  - id: binder_50_100
    name: Generic Binder 50-100 residues
    value: "[A17-145/0 50-100]"
    description: "For benchmark targets (TrkA, IL7RA). Edit chain/residue numbers for other structures."
    
  - id: binder_70_90
    name: Generic Binder 70-90 residues
    value: "[A17-145/0 70-90]"
    description: "For benchmark targets. Medium size binder."
    
  - id: monomer_100
    name: Monomer 100 residues
    value: "[100-100]"
    description: Generate 100 residue monomer de novo
    
  - id: monomer_variable
    name: Monomer 50-150 residues
    value: "[50-150]"
    description: Generate variable-length monomer
    
  # TdT-specific (1KEJ, Chain A, res 148-510 with gaps at 387-389, 421-423)
  - id: tdt_binder_50_100
    name: TdT Binder 50-100 residues
    value: "[A148-386/A390-420/A424-510/0 50-100]"
    description: "For Human TdT (1KEJ). Chain A with gap residues excluded, design 50-100 residue binder."
    
  # Klenow-specific (1KLN, Chain A primary)
  - id: klenow_binder_50_100
    name: Klenow Binder 50-100 residues
    value: "[A324-928/0 50-100]"
    description: "For E. coli Klenow (1KLN). Keep chain A, design 50-100 residue binder."
    
  # Taq-specific (1TAQ, Chain A, res 10-832)
  - id: taq_binder_50_100
    name: Taq Binder 50-100 residues
    value: "[A10-832/0 50-100]"
    description: "For Taq polymerase (1TAQ). Keep entire chain A, design 50-100 residue binder."

# NTP presets for LigandMPNN
preset_ntps:
  - id: dATP
    name: dATP (DNA)
    smiles: "Nc1ncnc2c1ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3"
    description: Deoxyadenosine triphosphate - pairs with thymine
    
  - id: dTTP
    name: dTTP (DNA)
    smiles: "Cc1cn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)[nH]c1=O"
    description: Deoxythymidine triphosphate - pairs with adenine
    
  - id: dGTP
    name: dGTP (DNA)
    smiles: "Nc1nc2c(ncn2[C@H]3C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O3)c(=O)[nH]1"
    description: Deoxyguanosine triphosphate - pairs with cytosine
    
  - id: dCTP
    name: dCTP (DNA)
    smiles: "Nc1ccn([C@H]2C[C@H](O)[C@@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O2)c(=O)n1"
    description: Deoxycytidine triphosphate - pairs with guanine
    
  - id: ATP
    name: ATP (RNA/Energy)
    smiles: "Nc1ncnc2c1ncn2[C@@H]3O[C@H](COP(=O)(O)OP(=O)(O)OP(=O)(O)O)[C@@H](O)[C@H]3O"
    description: Adenosine triphosphate - energy currency and RNA nucleotide

