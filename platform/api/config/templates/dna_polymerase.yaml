# DNA Polymerase Engineering Template
# Sequence redesign for nucleotide binding

id: dna_polymerase
name: DNA Polymerase Engineering
icon: dna
color: "#10B981"
description: >
  Redesign protein sequences to optimize nucleotide triphosphate (NTP) binding.
  Uses ligand-aware sequence design to account for NTP interactions, followed
  by structure validation.

stages:
  - name: Sequence Design
    tool: LigandMPNN
    description: Redesign sequences with awareness of NTP binding geometry and chemistry.
  - name: Structure Validation
    tool: Boltz-2
    description: Predict structures to verify designs maintain proper NTP coordination.

preset_params:
  skip_rfd: true
  seq_method: fampnn
  pred_method: boltz

user_params:
  - name: skip_input_dir
    label: Input PDB Directory
    type: directory
    required: true
    description: Directory containing your polymerase PDB structure(s).
    
  - name: ntp_type
    label: NTP Type
    type: enum
    required: true
    enum:
      - dATP
      - dTTP
      - dGTP
      - dCTP
      - ATP
      - UTP
      - GTP
      - CTP
    description: Select the nucleotide triphosphate for design context.
    
  - name: temperature
    label: Design Temperature
    type: number
    required: false
    default: 0.1
    minimum: 0.01
    maximum: 2.0
    description: Lower = more conservative designs, Higher = more diversity.

enabled: true
