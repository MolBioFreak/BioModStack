# Fold-CP experimental workflow

id: boltz_cp_experimental
name: Fold-CP Experimental
icon: sparkles
color: "#F97316"
experimental: true
description: >
  Experimental Fold-CP large-protein launcher. The default
  true-distributed-context-parallel backend runs the DTensor context-parallel
  Boltz-2 prediction data-plane with torch.distributed; shared-cache-serial-output-tiling
  remains a legacy control-plane/output-tiling fallback for explicit diagnostic use.
goal: >
  Make the native distributed CP data-plane the default BMS launch path while
  keeping legacy publication backends visibly separate.
status: >
  Experimental alpha. true-distributed-context-parallel is the default data-plane
  backend. Legacy shared-cache publication remains opt-in and should not be read
  as native distributed CP. Host-RAM spill modes are predictor-owned rank-local
  Pairformer z offload at layer/op boundaries only; they do not reduce within-op
  triangle-attention or outer-product scratch peaks.

stages:
  - name: Input Intake
    tool: BMS Launcher
    description: Capture canonical structure-launcher inputs and CP launch settings.
  - name: True Distributed CP Prediction
    tool: Fold-CP distributed predictor
    description: Launch torch.distributed DTensor context-parallel Boltz-2 prediction across the selected physical GPUs.
  - name: Artifact Collect
    tool: BMS Output Collector
    description: Flatten prediction artifacts into standard BMS output folders for review.

preset_params:
  template_model_id: boltz_cp_experimental
  template_mode_id: design
  structure_launch_variant: boltz_cp_experimental
  bcp_repo_path: /home/dalab/tmp/boltz-cp
  bcp_backend: true-distributed-context-parallel
  bcp_triattn_backend: reference
  bcp_context_store_mode: evidence-only
  bcp_shard_plan_id: 2x2
  bcp_input_format: config_files
  bcp_output_format: mmcif
  bcp_write_full_pae: false
  bcp_confidence_prediction: false
  bcp_max_msa_seqs: 128
  bcp_max_parallel_samples: 1
  bcp_precision: BF16

user_params: []
