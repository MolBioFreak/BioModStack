# Fold-CP experimental workflow

id: boltz_cp_experimental
name: Fold-CP Experimental
icon: sparkles
color: "#F97316"
experimental: true
description: >
  Experimental Fold-CP large-protein control-plane launcher. It exposes honest
  backend selection and preserves shard-plan metadata; the shared-cache legacy
  path is not native distributed context parallel and only does one single full
  Boltz prediction then output tiling.
goal: >
  Make backend identity explicit in the BMS launcher while keeping the true
  distributed context-parallel data-plane gap visible instead of hiding it behind
  ad hoc shell commands.
status: >
  Experimental alpha. Backend metadata is explicit. The shared-cache serial
  output-tiling backend is a diagnostic/publication utility, not true CP; the
  DRAM context-spill workhorse path is an operation-level proof and remains
  separate from a complete native distributed Boltz prediction.

stages:
  - name: Input Intake
    tool: BMS Launcher
    description: Capture canonical structure-launcher inputs and CP launch settings.
  - name: Backend Execution
    tool: Fold-CP experimental large-protein runtime
    description: Select the requested backend; shared-cache-serial-output-tiling is control-plane output publication, not native distributed context parallel.
  - name: Artifact Collect
    tool: BMS Output Collector
    description: Flatten prediction artifacts into standard BMS output folders for review.

preset_params:
  template_model_id: boltz_cp_experimental
  template_mode_id: design
  structure_launch_variant: boltz_cp_experimental
  bcp_repo_path: /home/dalab/tmp/boltz-cp
  bcp_backend: dram-context-spill-workhorse
  bcp_shard_plan_id: 2x2
  bcp_input_format: config_files
  bcp_output_format: mmcif
  bcp_write_full_pae: false

user_params: []
