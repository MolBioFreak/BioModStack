# Structure Prediction Template
# Predict protein and complex structures with shared Structure workflow controls

id: structure_prediction
name: Structure Prediction
icon: bolt
color: "#F59E0B"
description: >
  Predict protein and complex structures with local, remote, and OEM
  context-parallel predictors, followed by optional FrustraMPNN mapping.

stages:
  - name: Structure Prediction
    tool: Boltz-2 / NVIDIA Fold-CP
    description: Run the selected predictor through the shared Structure launch surface.
  - name: Frustration Mapping
    tool: FrustraMPNN
    description: Analyze the resulting structure when requested.

preset_params:
  skip_rfd: true
  skip_rfd_seq: true
  rfd_mode: null

user_params:
  # === Core Inputs ===
  - name: pred_method
    label: Structure Predictor
    type: enum
    enum: [boltz, fold_cp]
    enum_labels:
      boltz: Boltz-2 (Fast, SOTA accuracy)
      fold_cp: NVIDIA Fold-CP (OEM context parallelism)
    default: boltz
    required: true
    description: Deep learning model for structure prediction

  - name: sequence
    label: Amino Acid Sequence
    type: text
    required: true
    description: Single-letter amino acid sequence (A-Z), or paste FASTA format
    
  - name: sequence_name
    label: Sequence Name
    type: string
    default: predicted
    description: Name for output structure files

  - name: run_frustrampnn
    label: Run FrustraMPNN Analysis
    type: boolean
    default: true
    description: Run FrustraMPNN analysis after structure prediction.

  - name: frustrampnn_requiredness
    label: FrustraMPNN Requiredness
    type: enum
    enum: [required]
    default: required
    description: FrustraMPNN is fail-closed when enabled and must remain required.
    condition:
      param: run_frustrampnn
      values: [true]

  - name: frustrampnn_settings
    label: FrustraMPNN Settings
    type: object
    ui_control: frustrampnn_settings
    default_source: frustrampnn.canonical_defaults
    description: Complete nested FrustraMPNNRequestedSettings contract, schema version 1.
    condition:
      param: run_frustrampnn
      values: [true]
    
  # === Boltz-2 Parameters ===
  - name: boltz_use_msa
    label: "[Boltz-2 / Fold-CP] Use MSA"
    type: boolean
    default: true
    description: Use the selected Structure MSA provider
    condition:
      param: pred_method
      values: [boltz, fold_cp]

  - name: boltz_recycling_steps
    label: "[Boltz-2 / Fold-CP] Recycling Steps"
    type: integer
    default: 3
    minimum: 1
    maximum: 10
    description: "Iterative refinement (Default: 3). Use 10 for difficult targets."
    condition:
      param: pred_method
      values: [boltz, fold_cp]
    
  - name: boltz_sampling_steps
    label: "[Boltz-2 / Fold-CP] Sampling Steps"
    type: integer
    default: 50
    minimum: 10
    maximum: 1000
    description: "Diffusion steps (Default: 50). Higher = potential side-chain precision."
    condition:
      param: pred_method
      values: [boltz, fold_cp]
    
  - name: boltz_num_samples
    label: "[Boltz-2 / Fold-CP] Number of Candidate Structures"
    type: integer
    default: 1
    minimum: 1
    maximum: 32
    description: "Final ranked candidate structures generated from the same input; model_0 is shown as the top-ranked result."
    condition:
      param: pred_method
      values: [boltz, fold_cp]

  # === NVIDIA Fold-CP OEM Parameters ===
  - name: bcp_size_cp
    label: "[Fold-CP] Context Parallel Size"
    type: integer
    default: 1
    minimum: 1
    maximum: 64
    description: OEM square context-parallel mesh size, constrained by the selected GPU count.
    condition:
      param: pred_method
      values: [fold_cp]

  - name: bcp_output_format
    label: "[Fold-CP] Output Format"
    type: enum
    enum: [mmcif, pdb]
    default: mmcif
    description: OEM structure output format.
    condition:
      param: pred_method
      values: [fold_cp]

  - name: bcp_write_full_pae
    label: "[Fold-CP] Write Full PAE"
    type: boolean
    default: false
    description: Request the complete predicted aligned error matrix.
    condition:
      param: pred_method
      values: [fold_cp]

  - name: bcp_seed
    label: "[Fold-CP] Seed"
    type: integer
    required: false
    description: Optional OEM inference seed.
    condition:
      param: pred_method
      values: [fold_cp]

  - name: boltz_max_parallel_samples
    label: "[Boltz-2] Denoiser Chunk Limit"
    type: integer
    default: 1
    minimum: 1
    maximum: 32
    description: "Caps denoiser-forward chunk size for already-requested Boltz diffusion/FK particles; not a full one-at-a-time job guarantee."
    condition:
      param: pred_method
      values: [boltz]

  - name: boltz_method
    label: "[Boltz-2] Conditioning Method"
    type: enum
    enum: 
      - ""
      - md
      - x-ray diffraction
      - electron microscopy
      - solution nmr
      - solid-state nmr
      - neutron diffraction
      - electron crystallography
      - fiber diffraction
      - powder diffraction
      - infrared spectroscopy
      - fluorescence transfer
      - epr
      - theoretical model
      - solution scattering
      - other
      - afdb
      - boltz-1
    enum_labels:
      "": "None (Standard Folding)"
    default: ""
    description: Hint experimental context
    condition:
      param: pred_method
      values: [boltz]
    
  # === Parallelization / Stress Test ===
  - name: num_parallel_jobs
    label: Parallel Jobs
    type: integer
    default: 1
    minimum: 1
    maximum: 500
    description: Concurrent GPU tasks (Limited by VRAM)
