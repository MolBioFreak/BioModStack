# First-class experimental molecular-dynamics workflow.

id: molecular_dynamics
name: Molecular Dynamics
icon: activity
color: "#22C55E"
experimental: true
description: >
  Run reproducible biomolecular molecular-dynamics jobs with engine-neutral
  contracts. GROMACS is the Phase 1 production engine; OpenMM is retained as
  a separate validation backend rather than silently substituted.
goal: >
  Validate a versioned MD job specification, prepare deterministic topology and
  restart artifacts, execute independent replicas, and publish checksum-bound
  trajectory, structure, and provenance artifacts.
status: >
  Experimental alpha. Protein systems are supported first. Protein-DNA and
  protein-ligand capabilities remain gated until their benchmark and force-field
  acceptance criteria pass. Production fan-out is fail-closed; the local wrapper
  is development-only and is never used as an automatic fallback.

stages:
  - name: Validate
    tool: BMS MD Contract
    description: Validate the versioned job specification, input structure, engine, force field, replica count, seed policy, and convergence thresholds.
  - name: Prepare
    tool: GROMACS / OpenMM Adapter
    description: Prepare topology, coordinates, integrator inputs, force-field metadata, and deterministic replica seeds.
  - name: Simulate
    tool: Nextflow Replica Workers
    description: Run independent restart-safe replicas with isolated work and publish directories.
  - name: Publish
    tool: BMS Result Contract
    description: Publish normalized structures, trajectories, logs, checksums, provenance, and an artifact manifest. Analysis availability is reported separately and never implied by this launch template.

preset_params:
  template_model_id: molecular_dynamics
  template_mode_id: simulate
  workflow_model_topic: molecular_dynamics

user_params:
  - name: md_job_config
    ui_group: Inputs
    ui_order: 10
    label: MD Job Specification
    type: file
    required: true
    description: Versioned JSON or YAML MD job specification. Use the BMS MD schema; implicit engine or force-field defaults are rejected.

  - name: structure_file
    ui_group: Inputs
    ui_order: 20
    label: Starting Structure
    type: file
    required: true
    description: Starting PDB or mmCIF structure referenced by the job specification.

  - name: engine
    ui_group: Runtime
    ui_order: 10
    label: MD Engine
    type: enum
    required: true
    default: gromacs
    description: Explicit execution backend. No automatic cross-engine fallback is permitted.
    enum:
      - gromacs
      - openmm
    enum_labels:
      gromacs: GROMACS (Phase 1 production)
      openmm: OpenMM (validation backend)

  - name: replicas
    ui_group: Runtime
    ui_order: 20
    label: Independent Replicas
    type: integer
    required: true
    default: 3
    min: 1
    max: 64
    description: Independently seeded replicas. Production execution uses durable parent/child orchestration rather than in-process fan-out.

  - name: production_ns
    ui_group: Runtime
    ui_order: 30
    label: Production Length per Replica (ns)
    type: number
    required: true
    default: 1.0
    min: 0.001
    description: Requested production duration for each replica.

  - name: seed_policy
    ui_group: Reproducibility
    ui_order: 10
    label: Seed Policy
    type: enum
    required: true
    default: derived
    description: Deterministic derivation is recommended; explicit seeds remain available for exact replay.
    enum:
      - derived
      - explicit
    enum_labels:
      derived: Deterministic derived seeds
      explicit: Explicit per-replica seeds

  - name: force_field
    ui_group: System
    ui_order: 10
    label: Force Field
    type: enum
    required: true
    default: charmm36m
    description: Explicit force-field family; acceptance remains system-class specific.
    enum:
      - charmm36m
      - amber14sb
    enum_labels:
      charmm36m: CHARMM36m
      amber14sb: AMBER14SB

  - name: solvent_model
    ui_group: System
    ui_order: 20
    label: Solvent Model
    type: enum
    required: true
    default: tip3p
    enum:
      - tip3p
    enum_labels:
      tip3p: TIP3P

  - name: notes
    ui_group: Metadata
    ui_order: 10
    label: Experiment Notes
    type: textarea
    required: false
    description: Optional operator notes stored with the job provenance.

docs:
  - title: Molecular Dynamics Architecture
    path: docs/Molecular_Dynamics_Architecture.md
  - title: Molecular Dynamics User Guide
    path: docs/Molecular_Dynamics_User_Guide.md
  - title: Molecular Dynamics Validation
    path: docs/Molecular_Dynamics_Validation.md
