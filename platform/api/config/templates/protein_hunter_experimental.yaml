# Protein Hunter experimental workflow

id: protein_hunter_experimental
name: Protein Hunter Experimental
icon: sparkles
color: "#F97316"
experimental: true
description: >
  Experimental iterative generator family based on Protein Hunter. Routes to
  Boltz or Chai backends for broad binder exploration and unconditional
  generation, then normalizes the resulting cohorts into reusable BMS
  artifacts.
goal: >
  Bring Protein Hunter into BMS as an experimental generator family with a
  clean UV-based runtime, explicit backend/task compilation, and stable
  normalized outputs.
status: >
  Experimental alpha. Boltz and Chai generator launch surfaces are wired, AF3
  validation is intentionally not exposed, and this workflow is not yet wired
  into downstream refinement loops.

stages:
  - name: Request Compile
    tool: BMS Compiler
    description: Normalize backend/task inputs and stage optional target assets.
  - name: Iterative Generation
    tool: Protein Hunter
    description: Run the selected Boltz or Chai generator backend through Protein Hunter.
  - name: Artifact Normalize
    tool: BMS Output Normalizer
    description: Convert the selected Protein Hunter cohort into stable BMS design IDs and metadata sidecars.

preset_params:
  template_model_id: protein_hunter_experimental
  template_mode_id: design

user_params:
  - name: backend
    label: Backend
    type: enum
    required: true
    default: boltz
    description: Protein Hunter backend.
    enum:
      - boltz
      - chai
    enum_labels:
      boltz: Protein Hunter Boltz
      chai: Protein Hunter Chai

  - name: task
    label: Task
    type: enum
    required: true
    default: protein_binder
    description: Experimental generator task family.
    enum:
      - protein_binder
      - unconditional
      - ligand_binder
      - nucleic_binder
    enum_labels:
      protein_binder: Protein binder
      unconditional: Unconditional monomer
      ligand_binder: Ligand binder
      nucleic_binder: DNA/RNA binder

  - name: num_designs
    label: Designs / Trials
    type: integer
    required: true
    default: 4
    minimum: 1
    maximum: 128
    description: Number of independent Protein Hunter designs or trials.

  - name: num_cycles
    label: Design Cycles
    type: integer
    required: true
    default: 7
    minimum: 1
    maximum: 64
    description: Number of iterative design cycles.

  - name: min_protein_length
    label: Min Binder Length
    type: integer
    required: true
    default: 90
    minimum: 1
    maximum: 2000
    description: Minimum generated binder length.

  - name: max_protein_length
    label: Max Binder Length
    type: integer
    required: true
    default: 150
    minimum: 1
    maximum: 2000
    description: Maximum generated binder length.

  - name: percent_x
    label: Percent X
    type: integer
    required: false
    default: 50
    minimum: 0
    maximum: 100
    description: Percent of X residues in the initial binder sequence.

  - name: seed_binder_sequence
    label: Seed Binder Sequence
    type: string
    required: false
    description: Optional starting binder sequence for seeded redesign.

  - name: target_protein_sequences
    label: Target Protein Sequence
    type: string
    required: false
    description: >
      Target protein sequence. For Boltz, multiple target chains can be
      separated by ':'.
    condition:
      param: task
      values:
        - protein_binder

  - name: target_pdb
    label: Target PDB
    type: file
    required: false
    description: Optional target/template PDB for the Chai backend.
    condition:
      param: backend
      values:
        - chai

  - name: target_pdb_chain
    label: Target PDB Chain
    type: string
    required: false
    description: Chain ID for target_pdb when using Chai.
    condition:
      param: backend
      values:
        - chai

  - name: target_template_path
    label: Boltz Template Path
    type: string
    required: false
    description: Optional Boltz template path or PDB code.
    condition:
      param: backend
      values:
        - boltz

  - name: target_template_chain_id
    label: Boltz Template Chain
    type: string
    required: false
    description: Optional Boltz mmCIF template chain ID.
    condition:
      param: backend
      values:
        - boltz

  - name: ligand_smiles
    label: Ligand SMILES
    type: string
    required: false
    description: Ligand SMILES for ligand-binder tasks.
    condition:
      param: task
      values:
        - ligand_binder

  - name: ligand_ccd
    label: Ligand CCD
    type: string
    required: false
    description: Optional ligand CCD code for Boltz ligand-binder tasks.
    condition:
      param: backend
      values:
        - boltz

  - name: nucleic_sequence
    label: Nucleic Sequence
    type: string
    required: false
    description: DNA or RNA target sequence.
    condition:
      param: task
      values:
        - nucleic_binder

  - name: nucleic_type
    label: Nucleic Type
    type: enum
    required: false
    default: rna
    description: Nucleic-acid target type.
    enum:
      - dna
      - rna
    condition:
      param: task
      values:
        - nucleic_binder

  - name: contact_residues
    label: Contact Residues
    type: string
    required: false
    description: Optional target contact residues for Boltz contact conditioning.
    condition:
      param: backend
      values:
        - boltz

  - name: cyclic
    label: Cyclic Binder
    type: boolean
    required: false
    default: false
    description: Enable cyclic topology for the designed binder.

  - name: alanine_bias
    label: Alanine Bias
    type: boolean
    required: false
    default: true
    description: Enable Protein Hunter alanine-bias mode.

  - name: temperature
    label: Final Temperature
    type: number
    required: false
    default: 0.1
    minimum: 0.001
    maximum: 2.0
    description: Final sequence-design temperature.

  - name: high_iptm_threshold
    label: High iPTM Threshold
    type: number
    required: false
    default: 0.7
    minimum: 0.0
    maximum: 1.0
    description: Threshold for saving top Protein Hunter outputs.

  - name: high_plddt_threshold
    label: High pLDDT Threshold
    type: number
    required: false
    default: 0.8
    minimum: 0.0
    maximum: 1.0
    description: High-confidence pLDDT threshold.

  - name: msa_mode
    label: Boltz MSA Mode
    type: enum
    required: false
    default: mmseqs
    description: Boltz MSA source mode.
    enum:
      - single
      - mmseqs
    condition:
      param: backend
      values:
        - boltz

  - name: boltz_model_version
    label: Boltz Model
    type: enum
    required: false
    default: boltz2
    description: Protein Hunter Boltz model version.
    enum:
      - boltz2
      - boltz1
    condition:
      param: backend
      values:
        - boltz

  - name: boltz_model_path
    label: Boltz Checkpoint Path
    type: string
    required: false
    description: Optional override for the Boltz checkpoint path.
    condition:
      param: backend
      values:
        - boltz

  - name: boltz_ccd_path
    label: Boltz CCD Path
    type: string
    required: false
    description: Optional override for the Boltz molecule cache directory.
    condition:
      param: backend
      values:
        - boltz

  - name: chai_hysteresis_mode
    label: Chai Hysteresis
    type: enum
    required: false
    default: templates
    description: Chai hysteresis mode.
    enum:
      - templates
      - esm
      - partial_diffusion
      - none
    condition:
      param: backend
      values:
        - chai

  - name: chai_num_recycles
    label: Chai Recycles
    type: integer
    required: false
    default: 3
    minimum: 1
    maximum: 16
    description: Number of Chai trunk recycles.
    condition:
      param: backend
      values:
        - chai

  - name: chai_num_diff_steps
    label: Chai Diffusion Steps
    type: integer
    required: false
    default: 200
    minimum: 1
    maximum: 1000
    description: Number of Chai diffusion steps.
    condition:
      param: backend
      values:
        - chai

  - name: chai_repredict
    label: Chai Final Repredict
    type: boolean
    required: false
    default: true
    description: Run final Chai reprediction without templates.
    condition:
      param: backend
      values:
        - chai
