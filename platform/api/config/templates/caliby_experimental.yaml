# Caliby experimental workflow

id: caliby_experimental
name: Caliby Experimental
icon: sparkles
color: "#14B8A6"
experimental: true
description: >
  Experimental structure-conditioned sequence design and sidechain packing with
  Caliby. This is the first BMS landing surface for ensemble-aware Caliby work
  before broader refinement-loop adoption.
goal: >
  Bring Caliby into BMS as an experimental sequence-design backend that can run
  on single structures or conformer ensembles, normalize outputs into reusable
  BMS artifacts, and serve as the integration base for later refinement-loop
  reuse.
status: >
  Experimental beta. Single-structure design, ensemble-conditioned design, and
  sidechain packing are wired. Broader scoring-only surfaces and deeper
  refinement-side analytics are deferred.

stages:
  - name: Request Compile
    tool: BMS Compiler
    description: Normalize Caliby task settings, stage input directories, and compile optional constraints.
  - name: Sequence Design
    tool: Caliby
    description: Run structure-conditioned or ensemble-conditioned sequence design, or sidechain packing.
  - name: Artifact Normalize
    tool: BMS Output Normalizer
    description: Convert Caliby outputs into stable BMS design IDs, PDB artifacts, and metadata sidecars.

preset_params:
  template_model_id: caliby_experimental
  template_mode_id: design

user_params:
  - name: task
    label: Task
    type: enum
    required: true
    default: sequence_design
    description: Caliby task mode.
    enum:
      - sequence_design
      - ensemble_design
      - sidechain_pack
    enum_labels:
      sequence_design: Single-structure design
      ensemble_design: Ensemble-conditioned design
      sidechain_pack: Sidechain packing

  - name: input_pdb_dir
    label: Input Structure Dir
    type: directory
    required: false
    description: Directory of PDB/mmCIF files for sequence design or sidechain packing.
    condition:
      param: task
      values:
        - sequence_design
        - sidechain_pack

  - name: conformer_dir
    label: Conformer Dir
    type: directory
    required: false
    description: Directory containing conformer ensembles grouped per structure.
    condition:
      param: task
      values:
        - ensemble_design

  - name: pdb_name_list
    label: Optional Name List
    type: file
    required: false
    description: Optional newline-delimited subset of structure IDs to process.

  - name: pos_constraint_csv
    label: Positional Constraints CSV
    type: file
    required: false
    description: Optional Caliby-compatible positional-constraint CSV.

  - name: model_name
    label: Sequence Model
    type: enum
    required: false
    default: soluble_caliby_v1
    description: Caliby model checkpoint name.
    enum:
      - caliby
      - soluble_caliby
      - soluble_caliby_v1

  - name: packer_model_name
    label: Packer Model
    type: enum
    required: false
    default: caliby_packer_010
    description: Sidechain packer checkpoint used for sidechain-pack tasks.
    enum:
      - caliby_packer_000
      - caliby_packer_010
      - caliby_packer_030

  - name: num_seqs_per_pdb
    label: Seqs Per Structure
    type: integer
    required: false
    default: 4
    minimum: 1
    maximum: 64
    description: Number of designed sequences sampled per input structure.
    condition:
      param: task
      values:
        - sequence_design
        - ensemble_design

  - name: batch_size
    label: Batch Size
    type: integer
    required: false
    default: 4
    minimum: 1
    maximum: 64
    description: Caliby inference batch size.

  - name: num_workers
    label: Data Workers
    type: integer
    required: false
    default: 8
    minimum: 1
    maximum: 64
    description: Number of Caliby dataloader workers.

  - name: clean_num_workers
    label: Clean Workers
    type: integer
    required: false
    default: 2
    minimum: 1
    maximum: 32
    description: Number of workers used to sanitize PDB/mmCIF inputs.
    condition:
      param: task
      values:
        - sequence_design
        - sidechain_pack

  - name: temperature
    label: Final Temperature
    type: number
    required: false
    default: 0.1
    minimum: 0.001
    maximum: 1.0
    description: Final Potts sampling temperature. Higher values increase diversity.
    condition:
      param: task
      values:
        - sequence_design
        - ensemble_design

  - name: omit_aas
    label: Omit Amino Acids
    type: string
    required: false
    default: C
    description: Comma-separated amino acids globally excluded from design.
    condition:
      param: task
      values:
        - sequence_design
        - ensemble_design

  - name: run_self_consistency_eval
    label: AF2 Self-Consistency
    type: boolean
    required: false
    default: false
    description: Run AF2 self-consistency evaluation on designed outputs.
    condition:
      param: task
      values:
        - sequence_design
        - ensemble_design

  - name: self_consistency_num_models
    label: AF2 Models
    type: integer
    required: false
    default: 5
    minimum: 1
    maximum: 5
    description: Number of AF2 models sampled during self-consistency evaluation.
    condition:
      param: run_self_consistency_eval
      values:
        - true

  - name: self_consistency_num_recycles
    label: AF2 Recycles
    type: integer
    required: false
    default: 3
    minimum: 1
    maximum: 12
    description: AF2 recycle count during self-consistency evaluation.
    condition:
      param: run_self_consistency_eval
      values:
        - true

  - name: self_consistency_use_multimer
    label: AF2 Multimer
    type: boolean
    required: false
    default: false
    description: Use AF2-Multimer during self-consistency evaluation.
    condition:
      param: run_self_consistency_eval
      values:
        - true

  - name: sampling_overrides_json
    label: Sampling Overrides JSON
    type: text
    required: false
    description: Optional JSON merged into Caliby sampling_overrides for expert tuning.
