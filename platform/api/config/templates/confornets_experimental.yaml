# Conformational mapping experimental workflow; currently backed by ConforNets.

id: confornets_experimental
name: Conformational Mapping
icon: sparkles
color: "#F97316"
experimental: true
description: >
  Experimental monomer-only conformational mapping workflow. The first backend is
  ConforNets/OpenFold3 for latent conformer diversity, MSE/reference-guided
  steering, and transfer sampling on one single-chain protein.
goal: >
  Stage a single-chain monomer query for the selected mapping backend, run the
  pinned backend scripts, and normalize real CIF conformers plus provenance into
  BioModStack artifacts for landscape viewing.
status: >
  Experimental alpha. ConforNets is the first implemented backend; this wrapper
  preserves its upstream semantics, requires an OF3p2/OpenFold3-preview compatible
  checkpoint, and enforces the current upstream two reference state limit per test
  case. Upstream notes that ConforNets backpropagates through Pairformer and uses
  more GPU memory than standard inference; treat long chains and diversity mode as
  VRAM-sensitive. Complexes, ligands, nucleic acids, docking, and calibrated
  ensemble probabilities are out of scope.

stages:
  - name: Asset Compile
    tool: BMS Mapping Wrapper
    description: Validate monomer-only input, stage backend query JSON, references.csv, and up to two reference structures in the current backend asset layout.
  - name: Upstream ConforNets Run
    tool: ConforNets / OpenFold3
    description: >
      Run the first implemented backend: preprocess.py plus the selected upstream
      diversity, MSE, or transfer script against staged OF3p2 assets.
  - name: Artifact Normalize
    tool: BMS Output Normalizer
    description: Collect real generated CIF conformers, backend state files, confidence CSVs, checksums, and provenance into stable BMS artifacts.

preset_params:
  template_model_id: confornets_experimental
  template_mode_id: design
  cn_task: diversity
  workflow_model_topic: confornets

user_params:
  - name: task
    ui_group: Mapping Mode
    ui_order: 10
    label: Mapping Task
    type: enum
    required: true
    default: diversity
    description: Monomer-only mapping mode for the current ConforNets backend. Diversity samples a conformational landscape; MSE steers toward references; transfer reuses a trained ConforNet.
    enum:
      - diversity
      - mse
      - transfer
    enum_labels:
      diversity: Diversity sampling
      mse: Reference-guided MSE steering
      transfer: Transfer trained ConforNet

  - name: sequence
    ui_group: Inputs
    ui_order: 10
    label: Monomer Sequence
    type: text
    required: true
    description: Single-chain protein sequence only; ':' multi-chain separators, complexes, ligands, DNA/RNA, and multimer cases are rejected.

  - name: chain_id
    ui_group: Inputs
    ui_order: 20
    label: Chain ID
    type: enum
    required: false
    default: A
    description: Single chain ID written into the OpenFold3 query JSON.
    enum:
      - A
      - B
      - C
      - D
    enum_labels:
      A: Chain A (default monomer)
      B: Chain B
      C: Chain C
      D: Chain D

  - name: reference_pdb_1
    ui_group: Inputs
    ui_order: 30
    label: Reference State 1
    type: file
    required: false
    description: Optional PDB/mmCIF first reference state. Required for MSE steering.
    condition:
      param: task
      values:
        - mse

  - name: reference_name_1
    ui_group: Inputs
    ui_order: 40
    label: Reference 1 Name
    type: enum
    required: false
    default: ref_a
    description: Stable label for the first reference state in upstream references.csv.
    enum:
      - ref_a
      - open_ref
      - active_ref
      - closed_ref
    enum_labels:
      ref_a: Reference A
      open_ref: Open state
      active_ref: Active state
      closed_ref: Closed state
    condition:
      param: task
      values:
        - mse

  - name: reference_pdb_2
    ui_group: Inputs
    ui_order: 50
    label: Reference State 2
    type: file
    required: false
    description: Optional second PDB/mmCIF reference state. Upstream ConforNets currently supports at most two reference states per test case.
    condition:
      param: task
      values:
        - mse

  - name: reference_name_2
    ui_group: Inputs
    ui_order: 60
    label: Reference 2 Name
    type: enum
    required: false
    default: ref_b
    description: Stable label for the second reference state; do not provide more than two references.
    enum:
      - ref_b
      - closed_ref
      - inactive_ref
      - alternate_ref
    enum_labels:
      ref_b: Reference B
      closed_ref: Closed state
      inactive_ref: Inactive state
      alternate_ref: Alternate state
    condition:
      param: task
      values:
        - mse

  - name: confornet_path
    ui_group: Inputs
    ui_order: 70
    label: Trained ConforNet
    type: file
    required: false
    description: "Transfer mode: explicit trained confornet.pt to apply to this monomer."
    condition:
      param: task
      values:
        - transfer

  - name: mse_dir
    ui_group: Inputs
    ui_order: 80
    label: MSE Output Directory
    type: directory
    required: false
    description: "Transfer mode: previous MSE output root for upstream confornet.pt auto-discovery."
    condition:
      param: task
      values:
        - transfer

  - name: source_test_cases
    ui_group: Inputs
    ui_order: 90
    label: Transfer Source Test Cases
    type: enum
    required: false
    default: ""
    description: "Transfer auto-discovery only; choose a prior BMS source test-case preset under mse_dir."
    enum:
      - ""
      - monomer_case
      - ref_a,ref_b
      - open_ref,closed_ref
    enum_labels:
      "": Auto-discover under MSE output
      monomer_case: BMS default monomer case
      ref_a,ref_b: Two-reference case labels
      open_ref,closed_ref: Open/closed reference labels
    condition:
      param: task
      values:
        - transfer

  - name: checkpoint_path
    ui_group: Advanced
    ui_order: 10
    label: OF3p2 Checkpoint
    type: file
    required: false
    default: /weights/openfold3/of3-p2-155k.pt
    description: OpenFold3-preview OF3p2 checkpoint path. OF3p1 checkpoints are not compatible with the current upstream path.

  - name: confornets_repo_path
    ui_group: Advanced
    ui_order: 20
    label: ConforNets Repo Path
    type: directory
    required: false
    default: /opt/confornets
    description: Pinned upstream ConforNets checkout inside the runtime or container.

  - name: num_runs
    ui_group: Model Orchestration
    ui_order: 10
    label: Runs / Seeds
    type: integer
    required: false
    default: 2
    minimum: 1
    maximum: 128
    ui_control: slider
    step: 1
    description: Independent upstream runs/seeds for diversity or MSE training.

  - name: k_confornets
    ui_group: Model Orchestration
    ui_order: 20
    label: Backend States per Run
    type: integer
    required: false
    default: 2
    minimum: 2
    maximum: 16
    ui_control: slider
    step: 1
    description: Diversity-mode backend states to train per run. Minimum 2 because the current ConforNets backend maximizes pairwise separation.
    condition:
      param: task
      values:
        - diversity

  - name: num_samples
    ui_group: Model Orchestration
    ui_order: 30
    label: Samples per State
    type: integer
    required: false
    default: 5
    minimum: 1
    maximum: 512
    ui_control: slider
    step: 1
    description: Samples per saved backend state.

  - name: max_steps
    ui_group: Model Orchestration
    ui_order: 40
    label: Optimization Steps
    type: integer
    required: false
    default: 21
    minimum: 1
    maximum: 2000
    ui_control: slider
    step: 1
    description: Backend optimization steps for the current ConforNets implementation.

  - name: save_steps
    ui_group: Model Orchestration
    ui_order: 50
    label: Diversity Save Steps
    type: enum
    required: false
    default: "5,10,15,20"
    description: Preset diversity save steps; each value must be lower than max_steps.
    enum:
      - "5,10,15,20"
      - "2,4,6,8"
      - "10,20,30,40"
      - "25,50,75,100"
    enum_labels:
      "5,10,15,20": Default short trajectory
      "2,4,6,8": Very short smoke-test trajectory
      "10,20,30,40": Medium trajectory; raise max_steps above 40
      "25,50,75,100": Long trajectory; raise max_steps above 100
    condition:
      param: task
      values:
        - diversity

  - name: num_recycles
    ui_group: Model Orchestration
    ui_order: 60
    label: OF3 Recycles
    type: integer
    required: false
    default: 0
    minimum: 0
    maximum: 16
    ui_control: slider
    step: 1
    description: OpenFold3 recycles passed to upstream scripts.

  - name: num_diffusion_steps
    ui_group: Model Orchestration
    ui_order: 70
    label: Diversity Diffusion Steps
    type: integer
    required: false
    default: 200
    minimum: 1
    maximum: 1000
    ui_control: slider
    step: 1
    description: Diversity-mode sampling diffusion steps.
    condition:
      param: task
      values:
        - diversity

  - name: skip_msa
    ui_group: Model Orchestration
    ui_order: 80
    label: Skip MSA
    type: boolean
    required: false
    default: false
    description: Only enable when query_msa.json and batch/*.pt are already staged; otherwise upstream preprocessing must run MSA.

  - name: compute_confidence
    ui_group: Outputs
    ui_order: 10
    label: Compute Confidence
    type: boolean
    required: false
    default: true
    description: Request upstream pLDDT/gPDE/PTM confidence CSV outputs when supported.

  - name: save_full_confidence
    ui_group: Outputs
    ui_order: 20
    label: Save Full Confidence Tensors
    type: boolean
    required: false
    default: false
    description: Persist raw per-sample confidence tensors in addition to CSV summaries.

  - name: compute_evaluation
    ui_group: Outputs
    ui_order: 30
    label: Compute Evaluation Metrics
    type: boolean
    required: false
    default: true
    description: Compute reference RMSD, success@1, pairwise diversity, and 2D landscape coordinates from real normalized CIF conformers and staged references.
