# Standalone ESMFold2 experimental workflow

id: esmfold2_experimental
name: ESMFold2 Experimental
icon: sparkles
color: "#22D3EE"
experimental: true
description: >
  Standalone local ESMFold2 all-atom folding path. It reuses the existing
  Structure Prediction launcher for sequence/PDB import and complex-component
  controls, while the backend maps that canonical payload to the ESMFold2 runtime.
goal: >
  Fold a real protein or protein-containing complex through a pinned Biohub
  ESMFold2 local runtime contract, publish real mmCIF plus metrics, and fail
  closed when required local assets are absent rather than downloading weights
  implicitly.
status: >
  Experimental alpha. Local-files-only remains the default; installing the
  container and ESMFold2/ESMC-6B cache is a separate operator action. PDB import
  is sequence-source only, not structural-template conditioning.

stages:
  - name: Runtime Preflight
    tool: BMS ESMFold2 Wrapper
    description: Validate canonical structure-launcher inputs and local-only model selection before inference.
  - name: Local ESMFold2 Fold
    tool: Biohub ESMFold2
    description: Run the pinned Biohub ESMFold2 local Python API against local Hugging Face cache and supplied components.
  - name: Artifact Publish
    tool: BMS Output Normalizer
    description: Publish real mmCIF, metrics JSON, and manifest files for downstream BMS ingestion work.

preset_params:
  template_model_id: esmfold2_experimental
  template_mode_id: predict
  structure_launch_variant: esmfold2_experimental
  model_variant: fast

# Dedicated UI: StructurePredictionTemplate owns visible input controls.
# Keep this empty so JobSubmission does not render a duplicate generic form.
user_params: []
