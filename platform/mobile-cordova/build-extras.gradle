// BioModStack release signing is explicit and fail-closed. Do not put credentials in this file.
def bmsSigningValue = { String key ->
    def propertyValue = project.findProperty(key)?.toString()
    propertyValue?.trim() ? propertyValue : System.getenv(key)
}

def bmsKeystorePath = bmsSigningValue('BMS_ANDROID_KEYSTORE_PATH')
def bmsKeystorePassword = bmsSigningValue('BMS_ANDROID_KEYSTORE_PASSWORD')
def bmsKeyAlias = bmsSigningValue('BMS_ANDROID_KEY_ALIAS')
def bmsKeyPassword = bmsSigningValue('BMS_ANDROID_KEY_PASSWORD')
def bmsReleaseSigningConfigured = [
    bmsKeystorePath, bmsKeystorePassword, bmsKeyAlias, bmsKeyPassword
].every { it != null && !it.toString().trim().isEmpty() }

android {
    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds true
    }

    if (bmsReleaseSigningConfigured) {
        signingConfigs {
            bmsRelease {
                storeFile file(bmsKeystorePath)
                storePassword bmsKeystorePassword
                keyAlias bmsKeyAlias
                keyPassword bmsKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
        buildTypes.release.signingConfig signingConfigs.bmsRelease
    }
}

def releaseArtifactTaskPattern = ~/^(assemble|bundle|package|sign|validateSigning|install).*Release.*$/
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task -> releaseArtifactTaskPattern.matcher(task.name).matches() }
    if (releaseRequested && !bmsReleaseSigningConfigured) {
        throw new GradleException(
            'Release tasks require BMS_ANDROID_KEYSTORE_PATH, BMS_ANDROID_KEYSTORE_PASSWORD, ' +
            'BMS_ANDROID_KEY_ALIAS, and BMS_ANDROID_KEY_PASSWORD as environment variables or Gradle properties.'
        )
    }
    if (releaseRequested && !file(bmsKeystorePath).isFile()) {
        throw new GradleException('BMS_ANDROID_KEYSTORE_PATH does not identify a readable file.')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
