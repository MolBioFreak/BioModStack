[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-alignment-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
bms-alignment = "bms_alignment.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
