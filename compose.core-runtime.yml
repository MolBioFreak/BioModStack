services:
  bms-analytical-postgres:
    image: postgres:16-alpine
    container_name: biomodstack-analytical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms_analytical_data
      POSTGRES_USER: bms_assay
      POSTGRES_PASSWORD: ${BMS_ANALYTICAL_DB_PASSWORD:-bms_assay_dev}
    ports:
      - "127.0.0.1:${BMS_ANALYTICAL_DB_PORT:-55432}:5432"
    volumes:
      - bms_analytical_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms_assay -d bms_analytical_data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bms-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: biomodstack-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      bms-analytical-postgres:
        condition: service_healthy
    environment:
      BMS_HOME: /app
      BMS_STATE_DIR: ${BMS_STATE_DIR:-/mnt/BioModStack}
      BMS_CONTAINER_STATE_PATH: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
      BMS_INPUTS_CONTAINER_PATH: ${BMS_INPUTS_CONTAINER_PATH:-/var/lib/biomodstack/inputs}
      BMS_DB_CONTAINER_PATH: ${BMS_DB_CONTAINER_PATH:-/var/lib/biomodstack/biomodstack.db}
      BMS_DATA: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
      BMS_INPUTS: ${BMS_INPUTS_CONTAINER_PATH:-/var/lib/biomodstack/inputs}
      BMS_DB_PATH: ${BMS_DB_CONTAINER_PATH:-/var/lib/biomodstack/biomodstack.db}
      BMS_WEIGHTS: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/weights
      BMS_COLABFOLD_DB: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/colabfold_db
      BMS_MSA_CACHE: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/msa_cache
      BMS_SABDAB_CACHE: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/sabdab_cache
      BMS_WORK: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/work
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1,http://127.0.0.1:5173,http://127.0.0.1:18080,http://localhost,https://localhost,http://localhost:5173,http://localhost:18080,https://localhost:5173,https://127.0.0.1}
      BMS_CORE_RUNTIME_MODE: ${BMS_CORE_RUNTIME_MODE:-1}
      BMS_WORKFLOW_ADAPTER_URL: ${BMS_WORKFLOW_ADAPTER_URL:-http://127.0.0.1:8001}
      BMS_CPU_POWER_COLLECTOR_URL: ${BMS_CPU_POWER_COLLECTOR_URL:-http://127.0.0.1:8797/power}
      BMS_ANALYTICAL_DATABASE_URL: ${BMS_ANALYTICAL_DATABASE_URL:-postgresql+asyncpg://bms_assay:${BMS_ANALYTICAL_DB_PASSWORD:-bms_assay_dev}@127.0.0.1:${BMS_ANALYTICAL_DB_PORT:-55432}/bms_analytical_data}
      BMS_ANALYTICAL_INIT_ON_STARTUP: ${BMS_ANALYTICAL_INIT_ON_STARTUP:-1}
      BIOXP_SERVER_URL: ${BIOXP_SERVER_URL:-}
    volumes:
      - type: bind
        source: ${BMS_STATE_DIR:-/mnt/BioModStack}
        target: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  bms-cpu-power:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: biomodstack-cpu-power
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      BMS_POWER_CAP_ROOT: /host_sys/class/powercap
      BMS_CPU_POWER_BIND_HOST: 127.0.0.1
      BMS_CPU_POWER_PORT: ${BMS_CPU_POWER_PORT:-8797}
    volumes:
      - type: bind
        source: /sys
        target: /host_sys
        read_only: true
    command: ["python", "/app/platform/api/tools/cpu_power_collector.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BMS_CPU_POWER_PORT:-8797}/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  bms-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: biomodstack-web
    restart: unless-stopped
    network_mode: host
    environment:
      BMS_WEB_HOST_PORT: ${BMS_WEB_HOST_PORT:-18080}
    depends_on:
      bms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${BMS_WEB_HOST_PORT:-18080}/bms/\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bms_analytical_postgres_data:
