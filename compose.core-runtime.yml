x-bms-json-logging: &bms-json-logging
  driver: json-file
  options:
    max-size: ${BMS_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${BMS_DOCKER_LOG_MAX_FILE:-5}"

x-bms-default-ulimits: &bms-default-ulimits
  nofile:
    soft: ${BMS_CONTAINER_NOFILE_SOFT:-131072}
    hard: ${BMS_CONTAINER_NOFILE_HARD:-131072}

services:
  bms-api:
    image: ${BMS_API_IMAGE:-biomodstack/api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api-runtime
      args:
        BMS_BUILD_SHA: ${BMS_BUILD_SHA:-unknown}
        BMS_BUILD_ID: ${BMS_BUILD_ID:-development}
        BMS_BUILD_TIME: ${BMS_BUILD_TIME:-unknown}
    mem_limit: ${BMS_API_MEMORY_LIMIT:-16g}
    pids_limit: ${BMS_API_PIDS_LIMIT:-4096}
    ulimits: *bms-default-ulimits
    container_name: biomodstack-api
    restart: "no"
    logging: *bms-json-logging
    network_mode: host
    environment:
      BMS_HOME: /app
      BMS_STATE_DIR: ${BMS_STATE_DIR:-/mnt/BioModStack}
      BMS_NVIDIA_SMI_PATH: ${BMS_NVIDIA_SMI_PATH:-/usr/bin/nvidia-smi}
      BMS_GPU_CONFIG_PATH: /app/platform/api/config/gpu_power_limits.json
      BMS_CONTAINER_STATE_PATH: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
      BMS_INPUTS_CONTAINER_PATH: ${BMS_INPUTS_CONTAINER_PATH:-/var/lib/biomodstack/inputs}
      BMS_DB_CONTAINER_PATH: ${BMS_DB_CONTAINER_PATH:-/var/lib/biomodstack/biomodstack.db}
      BMS_DATA: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
      BMS_INPUTS: ${BMS_INPUTS_CONTAINER_PATH:-/var/lib/biomodstack/inputs}
      BMS_DB_PATH: ${BMS_DB_CONTAINER_PATH:-/var/lib/biomodstack/biomodstack.db}
      BMS_WEIGHTS: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/weights
      BMS_COLABFOLD_DB: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/colabfold_db
      BMS_MSA_CACHE: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/msa_cache
      BMS_SABDAB_CACHE: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/sabdab_cache
      BMS_WORK: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}/work
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1,http://127.0.0.1:5173,http://127.0.0.1:18080,http://localhost,https://localhost,http://localhost:5173,http://localhost:18080,https://localhost:5173,https://127.0.0.1}
      BMS_CORE_RUNTIME_MODE: ${BMS_CORE_RUNTIME_MODE:-1}
      BMS_MOBILE_APK_TRUSTED_PROXY_HOSTS: ${BMS_MOBILE_APK_TRUSTED_PROXY_HOSTS:-}
      BMS_MOBILE_APK_ALLOWED_TAILSCALE_USERS: ${BMS_MOBILE_APK_ALLOWED_TAILSCALE_USERS:-}
      BMS_CM_TRUSTED_PROXY_SECRET: ${BMS_CM_TRUSTED_PROXY_SECRET:-}
      BMS_CM_ALLOWED_ORIGINS: ${BMS_CM_ALLOWED_ORIGINS:-http://127.0.0.1:18080,http://localhost:18080}
      BMS_FEATURE_BIOXP: ${BMS_FEATURE_BIOXP:-1}
      BMS_BIOXP_MUTATIONS_ENABLED: ${BMS_BIOXP_MUTATIONS_ENABLED:-0}
      BMS_BIOXP_ALLOWED_HOSTS: ${BMS_BIOXP_ALLOWED_HOSTS:-robot}
      BMS_BIOXP_ALLOWED_CIDRS: ${BMS_BIOXP_ALLOWED_CIDRS:-}
      BMS_FEATURE_MOLECULAR_DYNAMICS: ${BMS_FEATURE_MOLECULAR_DYNAMICS:-0}
      ADDGENE_API_TOKEN: ${ADDGENE_API_TOKEN:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      BOLTZ_API_KEY: ${BOLTZ_API_KEY:-}
      BMS_BOLTZ_API_CLI: ${BMS_BOLTZ_API_CLI:-/var/lib/biomodstack/tools/boltz-api}
      BMS_BOLTZ_API_HOME: ${BMS_BOLTZ_API_HOME:-/var/lib/biomodstack/secrets/boltz-api-home}
      BMS_BOLTZ_DOWNLOAD_ROOT: ${BMS_BOLTZ_DOWNLOAD_ROOT:-/var/lib/biomodstack/boltz_results}
      BMS_WORKFLOW_ADAPTER_URL: ${BMS_WORKFLOW_ADAPTER_URL:-http://127.0.0.1:8001}
      BMS_HOST_AGENT_URL: ${BMS_HOST_AGENT_URL:-http://127.0.0.1:8798}
      BMS_HOST_AGENT_TIMEOUT_SECONDS: ${BMS_HOST_AGENT_TIMEOUT_SECONDS:-2.0}
      BMS_ONT_MINKNOW_ENABLED: ${BMS_ONT_MINKNOW_ENABLED:-1}
      BMS_CPU_POWER_COLLECTOR_URL: ${BMS_CPU_POWER_COLLECTOR_URL:-http://127.0.0.1:8797/power}
      BMS_STATS_TOOLKIT_URL: ${BMS_STATS_TOOLKIT_URL:-http://127.0.0.1:18181}
      BMS_STATS_TOOLKIT_ENTRY_URL: ${BMS_STATS_TOOLKIT_ENTRY_URL:-http://127.0.0.1:18180/stats/}
      BMS_DOCKER_COMPOSE_PROJECT: ${BMS_DOCKER_COMPOSE_PROJECT:-biomodstack-core-runtime}
    volumes:
      - type: bind
        source: ${BMS_STATE_DIR:-/mnt/BioModStack}
        target: ${BMS_CONTAINER_STATE_PATH:-/var/lib/biomodstack}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  bms-host-agent:
    image: ${BMS_HOST_AGENT_IMAGE:-biomodstack/host-agent:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api-runtime
      args:
        BMS_BUILD_SHA: ${BMS_BUILD_SHA:-unknown}
        BMS_BUILD_ID: ${BMS_BUILD_ID:-development}
        BMS_BUILD_TIME: ${BMS_BUILD_TIME:-unknown}
    mem_limit: ${BMS_HOST_AGENT_MEMORY_LIMIT:-2g}
    pids_limit: ${BMS_HOST_AGENT_PIDS_LIMIT:-512}
    ulimits: *bms-default-ulimits
    container_name: biomodstack-host-agent
    restart: "no"
    logging: *bms-json-logging
    network_mode: host
    labels:
      org.biomodstack.service_id: bms-host-agent
      org.biomodstack.component: host-agent
      org.biomodstack.optional_at_boot: "true"
    environment:
      BMS_HOST_AGENT_COMPOSE_FILE: /app/compose.core-runtime.yml
      BMS_DOCKER_COMPOSE_PROJECT: ${BMS_DOCKER_COMPOSE_PROJECT:-biomodstack-core-runtime}
      COMPOSE_PROJECT_NAME: ${BMS_DOCKER_COMPOSE_PROJECT:-biomodstack-core-runtime}
      MINKNOW_TRUSTED_CA: ${MINKNOW_TRUSTED_CA:-/var/lib/minknow/data/rpc-certs/minknow/ca.crt}
      MINKNOW_API_USE_LOCAL_TOKEN: ${MINKNOW_API_USE_LOCAL_TOKEN:-1}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /var/lib/minknow
        target: /var/lib/minknow
        read_only: true
      - type: bind
        source: /tmp/minknow-auth-token.json
        target: /tmp/minknow-auth-token.json
        read_only: true
    command: ["/app/platform/api/.venv/bin/python", "/app/scripts/bms_host_agent.py", "--host", "127.0.0.1", "--port", "8798"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8798/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  bms-cpu-power:
    image: ${BMS_CPU_POWER_IMAGE:-biomodstack/cpu-power:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api-runtime
      args:
        BMS_BUILD_SHA: ${BMS_BUILD_SHA:-unknown}
        BMS_BUILD_ID: ${BMS_BUILD_ID:-development}
        BMS_BUILD_TIME: ${BMS_BUILD_TIME:-unknown}
    mem_limit: ${BMS_CPU_POWER_MEMORY_LIMIT:-1g}
    pids_limit: ${BMS_CPU_POWER_PIDS_LIMIT:-256}
    ulimits: *bms-default-ulimits
    container_name: biomodstack-cpu-power
    restart: "no"
    logging: *bms-json-logging
    network_mode: host
    user: "0:0"
    environment:
      BMS_POWER_CAP_ROOT: /host_sys/class/powercap
      BMS_CPU_POWER_BIND_HOST: 127.0.0.1
      BMS_CPU_POWER_PORT: ${BMS_CPU_POWER_PORT:-8797}
    volumes:
      - type: bind
        source: /sys
        target: /host_sys
        read_only: true
    command: ["python", "/app/platform/api/tools/cpu_power_collector.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BMS_CPU_POWER_PORT:-8797}/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  tailnet-production-proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: biomodstack-tailnet-production-proxy
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./docker/tailnet-production-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      com.biomodstack.tailnet-proxy-config-sha: "${BMS_TAILNET_PROXY_CONFIG_SHA256:?set by scripts/manage_tailnet_production_proxy.sh}"
      com.biomodstack.tailnet-proxy-owner: compose.core-runtime
    command: ["nginx", "-g", "daemon off;"]

  bms-web:
    image: ${BMS_WEB_IMAGE:-biomodstack/web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        BMS_BUILD_SHA: ${BMS_BUILD_SHA:-unknown}
        BMS_BUILD_ID: ${BMS_BUILD_ID:-development}
        BMS_BUILD_TIME: ${BMS_BUILD_TIME:-unknown}
    mem_limit: ${BMS_WEB_MEMORY_LIMIT:-2g}
    pids_limit: ${BMS_WEB_PIDS_LIMIT:-512}
    ulimits: *bms-default-ulimits
    container_name: biomodstack-web
    restart: "no"
    logging: *bms-json-logging
    network_mode: host
    environment:
      BMS_WEB_HOST_PORT: ${BMS_WEB_HOST_PORT:-18080}
      BMS_CM_TRUSTED_PROXY_SECRET: ${BMS_CM_TRUSTED_PROXY_SECRET:-}
      BMS_CM_ALLOWED_HOST_PATTERN: ${BMS_CM_ALLOWED_HOST_PATTERN:-127\.0\.0\.1|localhost}
    depends_on:
      bms-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${BMS_WEB_HOST_PORT:-18080}/bms/\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
